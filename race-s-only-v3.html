<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <title>EvoWild Run — S-only 2.5D V3</title>
    <link rel="stylesheet" href="/src/race_s_only_v3.css" />
  </head>
  <body>
    <main class="race-shell" id="stage"
      data-race-state="loading"
      data-s-run-sheet="loading"
      data-renderer="pseudo3d-segments"
      data-field="s-only">
      <canvas id="raceCanvas" aria-label="EvoWild Run S-only 2.5D race"></canvas>

      <header class="hud top-hud">
        <div class="brand">
          <span class="kicker">EVOWILD RUN / 2.5D V3</span>
          <strong>S-ONLY RACE PROOF</strong>
        </div>
        <div class="race-readout">
          <span id="rank">— / 8</span>
          <b id="speed">0</b><small>km/h</small>
        </div>
      </header>

      <div class="hud command-hud">
        <span>RACE AGENT</span>
        <strong id="command">HOLD FORM</strong>
        <small id="reason">Pre-start</small>
      </div>

      <div class="countdown" id="countdown">3</div>

      <section class="hud bottom-hud">
        <div class="progress-meta">
          <span id="distance">0 / 1440 m</span>
          <span id="clock">00:00.00</span>
        </div>
        <div class="progress-track"><i id="progress"></i></div>
        <div class="mini-ranking" id="ranking"></div>
      </section>

      <div class="controls">
        <button id="pause" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
      </div>

      <div class="asset-status" id="assetStatus">Loading S run cycle…</div>
    </main>

    <script type="module" src="/src/race_s_only_v3.js"></script>
  </body>
</html>
