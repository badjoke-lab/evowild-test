name: S creature Vibe lane Gate B1a v3 shoulder chest cleanup
on:
  push:
    branches: [exp/s-creature-vibe-modeling]
    paths:
      - .github/workflows/s-creature-vibe-b1a-v3.yml
      - art/s-creature/blender/refine_s_vibe_b1a_v3.py
      - art/s-creature/blender/render_s_vibe_b1a_v3.py
permissions:
  contents: write
concurrency:
  group: s-creature-vibe-b1a-v3
  cancel-in-progress: false
jobs:
  vibe-b1a-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/s-creature-vibe-modeling
          fetch-depth: 0
      - name: Verify B1a-v3 source
        run: |
          test -f art/s-creature/output/S-vibe-b0-v025.blend
          test "$(git branch --show-current)" = "exp/s-creature-vibe-modeling"
      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Apply B1a-v3 eight-cycle cleanup
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-b0-v025.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/refine_s_vibe_b1a_v3.py
      - name: Render five B1a-v3 views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-b1a-v3.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_vibe_b1a_v3.py
      - name: Verify B1a-v3 hard scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-vibe-b1a-v3-validation.json').read_text())
          assert r['gate']=='B1a-v3-local-shoulder-chest-relax'
          assert r['parameters']['lambda']==0.32
          assert r['parameters']['mu']==-0.33
          assert r['parameters']['cycles']==8
          assert r['max_displacement'] <= 0.010
          assert r['fixed_geometry_unchanged']
          assert r['preserved_geometry_unchanged']
          assert r['topology_unchanged']
          assert r['render_fixed_geometry_unchanged']
          for stem in ('side','front','front34','rear34','back'):
              assert (root/f'output/review/vibe-b1a-v3/S_vibe_b1a_v3_{stem}.png').stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-vibe-B1a-v3-review
          path: |
            art/s-creature/output/S-vibe-b1a-v3.blend
            art/s-creature/output/S-vibe-b1a-v3-validation.json
            art/s-creature/output/review/vibe-b1a-v3/
          if-no-files-found: error
      - name: Commit B1a-v3 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-vibe-b1a-v3.blend art/s-creature/output/S-vibe-b1a-v3-validation.json art/s-creature/output/review/vibe-b1a-v3/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save Vibe B1a-v3 shoulder chest cleanup review'
          git push origin HEAD:exp/s-creature-vibe-modeling
