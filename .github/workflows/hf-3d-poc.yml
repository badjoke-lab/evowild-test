name: HF TripoSR Running Space POC

on:
  push:
    branches:
      - test/hf-triposr-running-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q gradio_client requests
      - name: Generate with non-Zero TripoSR Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, shutil
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from gradio_client import Client, handle_file

          token=os.environ.get("HF_TOKEN")
          src=Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          out=Path("hf-poc/output")
          out.mkdir(parents=True,exist_ok=True)

          spaces=["Orvixgames/TripoSR","gdTharusha/TripoSR"]
          last=None
          for sid in spaces:
              try:
                  client=Client(sid,token=token)
                  info=client.view_api(return_format="dict")
                  eps=info.get("named_endpoints",{})
                  print("SPACE",sid,"ENDPOINTS",list(eps))
                  for name,ep in eps.items():
                      print("EP",sid,name,[p.get("parameter_name") for p in ep.get("parameters",[])])
                  # Find an endpoint taking an image and returning a model/file.
                  chosen=None
                  for name,ep in eps.items():
                      ps=[p.get("parameter_name") for p in ep.get("parameters",[])]
                      rs=ep.get("returns",[])
                      if ps and any("image" in (p or "").lower() for p in ps):
                          chosen=name
                          break
                  if not chosen:
                      continue
                  ep=eps[chosen]
                  vals={
                    "image":handle_file(str(src)),
                    "input_image":handle_file(str(src)),
                    "foreground_ratio":0.85,
                    "mc_resolution":128,
                    "model_save_format":"glb",
                    "bake_texture":False,
                    "texture_resolution":1024,
                  }
                  args=[]
                  ok=True
                  for p in ep.get("parameters",[]):
                      n=p.get("parameter_name")
                      if n in vals:
                          args.append(vals[n])
                      elif p.get("parameter_has_default"):
                          args.append(p.get("parameter_default"))
                      else:
                          ok=False; break
                  if not ok:
                      print("UNSUPPORTED",sid,chosen)
                      continue
                  print("CALL",sid,chosen)
                  res=client.predict(*args,api_name=chosen)
                  print("RESULT",sid,repr(res)[:20000])
                  items=list(res) if isinstance(res,(list,tuple)) else [res]
                  cands=[]
                  for item in items:
                      if isinstance(item,str):
                          cands.append((item,None))
                      elif isinstance(item,dict):
                          p=item.get("path") or item.get("value")
                          if p:cands.append((str(p),item.get("url")))
                  models=[x for x in cands if x[0].lower().endswith((".glb",".obj",".ply"))]
                  if not models:
                      print("NO_MODEL",sid,cands); continue
                  path,url=models[-1]
                  ext=Path(path).suffix.lower() or ".glb"
                  dst=out/f"evowild_s_triposr_running{ext}"
                  if Path(path).exists():
                      shutil.copy2(path,dst)
                  elif url:
                      rr=requests.get(url,timeout=180)
                      if rr.ok:dst.write_bytes(rr.content)
                  if not dst.exists():
                      base=str(getattr(client,"src","")).rstrip("/")
                      enc=quote(path,safe="/")
                      for u in [f"{base}/gradio_api/file={enc}",f"{base}/file={enc}"]:
                          rr=requests.get(u,timeout=180)
                          if rr.ok and len(rr.content)>1024:
                              dst.write_bytes(rr.content);break
                  if dst.exists():
                      meta={"space":sid,"endpoint":chosen,"bytes":dst.stat().st_size,"file":dst.name}
                      (out/"triposr_running_metadata.json").write_text(json.dumps(meta,indent=2))
                      print("SAVED",json.dumps(meta))
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  last=e
                  print("SPACE_ERROR",sid,repr(e))
          raise RuntimeError(f"No running TripoSR Space succeeded: {last!r}")
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-triposr-running
          path: hf-poc/output/
          if-no-files-found: warn
