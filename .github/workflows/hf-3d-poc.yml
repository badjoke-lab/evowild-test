name: HF TripoSR Running Space POC

on:
  push:
    branches:
      - test/hf-triposr-running-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q gradio_client requests
      - name: Generate with non-Zero TripoSR Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, shutil
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from gradio_client import Client, handle_file

          token=os.environ.get("HF_TOKEN")
          src=Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          out=Path("hf-poc/output")
          out.mkdir(parents=True,exist_ok=True)

          sid="Orvixgames/TripoSR"
          client=Client(sid,token=token)
          info=client.view_api(return_format="dict")
          eps=info.get("named_endpoints",{})
          print("SPACE",sid,"ENDPOINTS",list(eps))
          if "/preprocess" not in eps or "/generate" not in eps:
              raise RuntimeError(f"Expected TripoSR endpoints missing: {list(eps)}")

          image_arg=handle_file(str(src))
          processed=client.predict(image_arg, True, 0.85, api_name="/preprocess")
          print("PREPROCESSED",repr(processed))

          # Orvixgames uses the current TripoSR-style signature:
          # generate(processed_image, mc_resolution) -> (obj, glb)
          res=client.predict(processed, 128, api_name="/generate")
          print("RESULT",repr(res)[:20000])

          items=list(res) if isinstance(res,(list,tuple)) else [res]
          cands=[]
          for item in items:
              if isinstance(item,str):
                  cands.append((item,None))
              elif isinstance(item,dict):
                  p=item.get("path") or item.get("value")
                  if p:cands.append((str(p),item.get("url")))
          models=[x for x in cands if x[0].lower().endswith((".glb",".obj",".ply"))]
          if not models:
              raise RuntimeError(f"No model returned: {cands}")
          glbs=[x for x in models if x[0].lower().endswith(".glb")]
          path,url=(glbs[-1] if glbs else models[-1])
          ext=Path(path).suffix.lower() or ".glb"
          dst=out/f"evowild_s_triposr_running{ext}"
          if Path(path).exists():
              shutil.copy2(path,dst)
          elif url:
              rr=requests.get(url,timeout=180)
              if rr.ok:dst.write_bytes(rr.content)
          if not dst.exists():
              base=str(getattr(client,"src","")).rstrip("/")
              enc=quote(path,safe="/")
              for u in [f"{base}/gradio_api/file={enc}",f"{base}/file={enc}"]:
                  rr=requests.get(u,timeout=180)
                  if rr.ok and len(rr.content)>1024:
                      dst.write_bytes(rr.content);break
          if not dst.exists():
              raise RuntimeError(f"Could not retrieve {path}")
          meta={"space":sid,"endpoint":"/generate","mc_resolution":128,"bytes":dst.stat().st_size,"file":dst.name}
          (out/"triposr_running_metadata.json").write_text(json.dumps(meta,indent=2))
          print("SAVED",json.dumps(meta))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-triposr-running
          path: hf-poc/output/
          if-no-files-found: warn
