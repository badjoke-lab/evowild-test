name: HF InstantMesh POC

on:
  push:
    branches:
      - test/hf-instantmesh-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: pip install -q gradio_client pillow requests

      - name: Generate EvoWild GLB with InstantMesh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, shutil, os
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image
          from gradio_client import Client, handle_file

          src = Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          runtime = Path("hf-poc/runtime")
          out = Path("hf-poc/output")
          runtime.mkdir(parents=True, exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)

          # Prepare transparent square image.
          im = Image.open(src).convert("RGBA")
          px = im.load()
          for y in range(im.height):
              for x in range(im.width):
                  r,g,b,a = px[x,y]
                  mn, mx = min(r,g,b), max(r,g,b)
                  if mn >= 245:
                      alpha = 0
                  elif mn >= 225 and mx - mn < 18:
                      alpha = int(max(0, min(255, (245 - mn) / 20 * 255)))
                  else:
                      alpha = 255
                  px[x,y] = (r,g,b,alpha)
          bbox = im.getbbox()
          if bbox:
              im = im.crop(bbox)
          w,h = im.size
          side = max(w,h)
          canvas = Image.new("RGBA",(side,side),(0,0,0,0))
          canvas.alpha_composite(im,((side-w)//2,(side-h)//2))
          inp = runtime / "evowild_3q_instantmesh.png"
          canvas.save(inp)

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("HF_TOKEN secret is not available to this workflow")
          print("HF_AUTH: token present")
          client = Client("TencentARC/InstantMesh", token=token)
          info = client.view_api(return_format="dict")
          print("API_INFO:", json.dumps(info, default=str))
          eps = info.get("named_endpoints", {})
          print("ENDPOINTS:", list(eps))

          def find_ep(fragment):
              for name in eps:
                  if fragment.lower() in name.lower():
                      return name
              return None

          preprocess_ep = find_ep("preprocess")
          mvs_ep = find_ep("generate_mvs")
          make3d_ep = find_ep("make3d")

          if not (mvs_ep and make3d_ep):
              # Fall back by parameter signatures.
              for name, ep in eps.items():
                  params = [p.get("parameter_name") for p in ep.get("parameters",[])]
                  if not mvs_ep and len(params) >= 3 and ("sample_steps" in params or "sample_seed" in params):
                      mvs_ep = name
                  if not make3d_ep and len(params) == 1 and params[0] in ("images","mv_images"):
                      make3d_ep = name

          print("SELECTED:", preprocess_ep, mvs_ep, make3d_ep)
          if not (mvs_ep and make3d_ep):
              raise RuntimeError(f"Required InstantMesh endpoints not found: {list(eps)}")

          image_arg = handle_file(str(inp))
          processed = image_arg
          if preprocess_ep:
              p = client.predict(image_arg, False, api_name=preprocess_ep)
              print("PREPROCESS:", p)
              processed = handle_file(p) if isinstance(p,str) and Path(p).exists() else p

          mvs = client.predict(processed, 30, 42, api_name=mvs_ep)
          print("MVS_RESULT:", mvs)

          # /make3d has no explicit parameters. It consumes the server-side
          # state established by /generate_mvs in the same Gradio client session.
          result = client.predict(api_name=make3d_ep)
          print("MAKE3D_RESULT:", result)
          items = list(result) if isinstance(result,(list,tuple)) else [result]

          # Prefer GLB output (typically second return).
          candidates = []
          for item in items:
              if isinstance(item,str):
                  candidates.append((item,None))
              elif isinstance(item,dict):
                  p = item.get("path") or item.get("value")
                  if p:
                      candidates.append((str(p),item.get("url")))
          glb_candidates = [(p,u) for p,u in candidates if p.lower().endswith(".glb")]
          if not glb_candidates:
              raise RuntimeError(f"No GLB returned: {result!r}")

          path,url = glb_candidates[-1]
          target = out / "evowild_s_instantmesh.glb"
          lp = Path(path)
          source = None
          if lp.exists():
              shutil.copy2(lp,target)
              source = "local"
          elif url:
              r = requests.get(url,timeout=180)
              print("DIRECT_DOWNLOAD:",r.status_code,len(r.content),url)
              if r.ok and len(r.content)>1024:
                  target.write_bytes(r.content)
                  source=url
          if not target.exists():
              base = str(getattr(client,"src","https://tencentarc-instantmesh.hf.space")).rstrip("/")
              enc = quote(path,safe="/")
              for u in [f"{base}/gradio_api/file={enc}",f"{base}/file={enc}"]:
                  r=requests.get(u,timeout=180)
                  print("DOWNLOAD:",r.status_code,len(r.content),u)
                  if r.ok and len(r.content)>1024:
                      target.write_bytes(r.content)
                      source=u
                      break

          if not target.exists() or target.read_bytes()[:4] != b"glTF":
              raise RuntimeError("InstantMesh GLB retrieval/validation failed")

          meta = {
              "space":"TencentARC/InstantMesh",
              "license":"apache-2.0",
              "source_image":str(src),
              "sample_steps":30,
              "seed":42,
              "output_bytes":target.stat().st_size,
              "source":source,
              "endpoints":{"preprocess":preprocess_ep,"generate_mvs":mvs_ep,"make3d":make3d_ep},
              "result_repr":repr(result)[:10000],
          }
          (out/"instantmesh_metadata.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
          print("SAVED:",target,target.stat().st_size)
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-instantmesh
          path: hf-poc/output/
          if-no-files-found: error
