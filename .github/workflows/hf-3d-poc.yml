name: HF 3D POC Generate

on:
  push:
    branches:
      - test/hf-3d-poc-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'
      - 'hf-poc/**'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install clients
        run: pip install -q gradio_client pillow

      - name: Validate and normalize reference images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("hf-poc/input")
          dst = Path("hf-poc/runtime")
          dst.mkdir(parents=True, exist_ok=True)

          names = [
              "01_SIDE_authority",
              "02_FRONT_width_reference",
              "03_BACK_rear_reference",
              "04_3Q_FRONT_shape_support",
          ]
          for name in names:
              path = src / f"{name}.jpg"
              with Image.open(path) as im:
                  im.load()
                  print(name, im.size, im.mode)
                  im.convert("RGB").save(dst / f"{name}.png", format="PNG")
          PY

      - name: Generate EvoWild S-Type mesh with Hunyuan3D-2mv
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          from gradio_client import Client, handle_file

          client = Client("tencent/Hunyuan3D-2mv")

          caption = (
              "slim futuristic quadruped racing creature, silver white body, cool blue and cyan accents, "
              "four clearly separated long legs, long narrow head, two upright horn ear structures, "
              "backward crest blades, blade-like fin tail, neutral standing pose, full body"
          )

          result = client.predict(
              caption,
              handle_file("hf-poc/runtime/04_3Q_FRONT_shape_support.png"),
              handle_file("hf-poc/runtime/02_FRONT_width_reference.png"),
              handle_file("hf-poc/runtime/03_BACK_rear_reference.png"),
              handle_file("hf-poc/runtime/01_SIDE_authority.png"),
              None,
              5,
              5.0,
              1234,
              256,
              True,
              8000,
              False,
              api_name="/shape_generation",
          )

          print("RESULT:", result)
          mesh_path = Path(result[0])
          out = Path("hf-poc/output")
          out.mkdir(parents=True, exist_ok=True)
          suffix = mesh_path.suffix or ".glb"
          target = out / f"evowild_s_hunyuan3d2mv{suffix}"
          shutil.copy2(mesh_path, target)

          metadata = {
              "source_space": "tencent/Hunyuan3D-2mv",
              "api": "/shape_generation",
              "caption": caption,
              "steps": 5,
              "guidance_scale": 5.0,
              "seed": result[3],
              "octree_resolution": 256,
              "mesh_stats": result[2],
              "output_filename": target.name,
          }
          (out / "metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          print("SAVED:", target)
          PY

      - name: Upload 3D result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-hunyuan3d2mv
          path: hf-poc/output/
          if-no-files-found: error
