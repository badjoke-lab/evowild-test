name: TripoSR CPU POC

on:
  push:
    branches:
      - test/triposr-cpu-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU PyTorch and TripoSR dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel scikit-build-core cmake ninja pybind11
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          pip install omegaconf==2.3.0 Pillow==10.1.0 einops==0.7.0 transformers==4.35.0 trimesh==4.0.5 rembg==2.0.50 onnxruntime huggingface-hub imageio xatlas==0.0.9
          pip install --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/TripoSR

      - name: Run TripoSR on CPU
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p hf-poc/output/triposr
          python /tmp/TripoSR/run.py             hf-poc/input/04_3Q_FRONT_shape_support.jpg             --device cpu             --pretrained-model-name-or-path stabilityai/TripoSR             --output-dir hf-poc/output/triposr             --model-save-format glb             --mc-resolution 128             --chunk-size 4096             --foreground-ratio 0.85

          find hf-poc/output/triposr -maxdepth 3 -type f -printf '%p %s bytes\n'

          python - <<'PY'
          from pathlib import Path
          import json, shutil
          glbs=list(Path("hf-poc/output/triposr").rglob("*.glb"))
          if not glbs:
              raise RuntimeError("TripoSR produced no GLB")
          src=glbs[0]
          dst=Path("hf-poc/output/evowild_s_triposr_cpu.glb")
          shutil.copy2(src,dst)
          if dst.read_bytes()[:4] != b"glTF":
              raise RuntimeError("TripoSR output is not GLB")
          meta={
            "source_model":"stabilityai/TripoSR",
            "device":"cpu",
            "mc_resolution":128,
            "chunk_size":4096,
            "output_bytes":dst.stat().st_size,
            "source_output":str(src),
          }
          Path("hf-poc/output/triposr_cpu_metadata.json").write_text(json.dumps(meta,indent=2))
          print("SAVED", dst, dst.stat().st_size)
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-triposr-cpu
          path: hf-poc/output/
          if-no-files-found: warn
