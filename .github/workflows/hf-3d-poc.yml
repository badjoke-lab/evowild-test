name: HF Stable Fast 3D POC

on:
  push:
    branches:
      - test/hf-3d-poc-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: pip install -q gradio_client pillow requests

      - name: Generate textured 20k GLB with Stable Fast 3D
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image
          from gradio_client import Client, handle_file

          src = Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          runtime = Path("hf-poc/runtime")
          out = Path("hf-poc/output")
          runtime.mkdir(parents=True, exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)

          # Simple white-background removal for the clean concept sheet crop.
          im = Image.open(src).convert("RGBA")
          px = im.load()
          for y in range(im.height):
              for x in range(im.width):
                  r,g,b,a = px[x,y]
                  m = min(r,g,b)
                  mx = max(r,g,b)
                  if m >= 245:
                      alpha = 0
                  elif m >= 225 and mx - m < 18:
                      alpha = int(max(0, min(255, (245 - m) / 20 * 255)))
                  else:
                      alpha = 255
                  px[x,y] = (r,g,b,alpha)

          bbox = im.getbbox()
          if bbox:
              im = im.crop(bbox)
          # square canvas with margin
          w,h = im.size
          side = max(w,h)
          canvas = Image.new("RGBA", (side,side), (0,0,0,0))
          canvas.alpha_composite(im, ((side-w)//2, (side-h)//2))
          cutout = runtime / "evowild_3q_cutout.png"
          canvas.save(cutout)

          client = Client("stabilityai/stable-fast-3d")
          info = client.view_api(return_format="dict")
          print("API_INFO:", json.dumps(info, default=str))

          result = client.predict(
              handle_file(str(cutout)),
              0.85,
              "None",
              20000,
              1024,
              api_name="/run_button",
          )
          print("RESULT:", result)

          file_result = result[1]
          server_path = file_result.get("value") if isinstance(file_result, dict) else str(file_result)
          if not server_path:
              raise RuntimeError(f"No GLB path in result: {file_result!r}")

          base = "https://stabilityai-stable-fast-3d.hf.space"
          encoded_path = quote(server_path, safe="/")
          response = None
          used_url = None
          for url in [
              f"{base}/gradio_api/file={encoded_path}",
              f"{base}/file={encoded_path}",
          ]:
              r = requests.get(url, timeout=180)
              print("DOWNLOAD:", r.status_code, len(r.content), url)
              if r.ok and len(r.content) > 1024:
                  response = r
                  used_url = url
                  break
          if response is None:
              raise RuntimeError("Generated GLB could not be downloaded")

          target = out / "evowild_s_stable_fast_3d_textured_20k.glb"
          target.write_bytes(response.content)
          if target.read_bytes()[:4] != b"glTF":
              raise RuntimeError("Downloaded file is not GLB")

          meta = {
              "space":"stabilityai/stable-fast-3d",
              "source":"04_3Q_FRONT_shape_support.jpg",
              "target_vertex_count":20000,
              "texture_size":1024,
              "remesh":"None",
              "output_bytes":target.stat().st_size,
              "server_path":server_path,
              "download_url":used_url,
          }
          (out/"stable_fast_3d_metadata.json").write_text(json.dumps(meta, indent=2), encoding="utf-8")
          print("SAVED:", target, target.stat().st_size)
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-stable-fast-3d-textured-20k
          path: hf-poc/output/
          if-no-files-found: error
