name: HF TRELLIS Single-image POC

on:
  push:
    branches:
      - test/hf-trellis-single-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: pip install -q gradio_client pillow requests

      - name: Generate textured EvoWild GLB with TRELLIS single-image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image
          from gradio_client import Client, handle_file

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("HF_TOKEN secret missing")
          print("HF_AUTH: token present")

          src = Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          runtime = Path("hf-poc/runtime/trellis-single")
          out = Path("hf-poc/output")
          runtime.mkdir(parents=True, exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)

          im = Image.open(src).convert("RGBA")
          px = im.load()
          for y in range(im.height):
              for x in range(im.width):
                  r,g,b,a = px[x,y]
                  mn, mx = min(r,g,b), max(r,g,b)
                  if mn >= 246:
                      alpha = 0
                  elif mn >= 226 and mx - mn < 18:
                      alpha = int(max(0, min(255, (246-mn)/20*255)))
                  else:
                      alpha = 255
                  px[x,y] = (r,g,b,alpha)
          bbox = im.getbbox()
          if bbox:
              im = im.crop(bbox)
          w,h = im.size
          side = int(max(w,h) * 1.12)
          canvas = Image.new("RGBA",(side,side),(0,0,0,0))
          canvas.alpha_composite(im,((side-w)//2,(side-h)//2))
          inp = runtime/"input.png"
          canvas.save(inp)

          client = Client("trellis-community/TRELLIS", token=token)
          info = client.view_api(return_format="dict")
          eps = info.get("named_endpoints", {})
          print("ENDPOINTS:", list(eps))

          if "/start_session" in eps:
              client.predict(api_name="/start_session")
              print("SESSION_STARTED")
          if "/lambda" in eps:
              client.predict(api_name="/lambda")
              print("SINGLEIMAGE_STATE_SELECTED")

          image_arg = handle_file(str(inp))
          if "/preprocess_image" in eps:
              processed = client.predict(image_arg, api_name="/preprocess_image")
              print("PREPROCESSED_IMAGE:", repr(processed))
              if isinstance(processed, str) and Path(processed).exists():
                  image_arg = handle_file(processed)
              else:
                  image_arg = processed

          gen_ep = "/generate_and_extract_glb"
          if gen_ep not in eps:
              raise RuntimeError(f"TRELLIS generation endpoint missing: {list(eps)}")

          result = client.predict(
              image_arg,
              [],
              42,
              7.5,
              12,
              3.0,
              12,
              "stochastic",
              0.95,
              1024,
              api_name=gen_ep,
          )
          print("RESULT_TYPE:", type(result).__name__)
          print("RESULT_REPR:", repr(result)[:10000])

          items = list(result) if isinstance(result,(list,tuple)) else [result]
          candidates=[]
          for item in items:
              if isinstance(item,str):
                  if item.lower().endswith(".glb") or "/tmp/" in item:
                      candidates.append((item,None))
              elif isinstance(item,dict):
                  p=item.get("path") or item.get("value")
                  u=item.get("url")
                  if p and (str(p).lower().endswith(".glb") or "/tmp/" in str(p)):
                      candidates.append((str(p),u))
          glbs=[(p,u) for p,u in candidates if p.lower().endswith(".glb")]
          if not glbs:
              raise RuntimeError(f"No GLB returned: {candidates}")

          path,url=glbs[-1]
          target=out/"evowild_s_trellis_single.glb"
          lp=Path(path)
          source=None
          if lp.exists():
              shutil.copy2(lp,target)
              source="local"
          elif url:
              r=requests.get(url,timeout=180)
              print("DIRECT_DOWNLOAD:",r.status_code,len(r.content),url)
              if r.ok and len(r.content)>1024:
                  target.write_bytes(r.content)
                  source=url
          if not target.exists():
              base=str(getattr(client,"src","https://trellis-community-trellis.hf.space")).rstrip("/")
              enc=quote(path,safe="/")
              for u in [f"{base}/gradio_api/file={enc}",f"{base}/file={enc}"]:
                  r=requests.get(u,timeout=180)
                  print("DOWNLOAD:",r.status_code,len(r.content),u)
                  if r.ok and len(r.content)>1024:
                      target.write_bytes(r.content)
                      source=u
                      break
          if not target.exists() or target.read_bytes()[:4] != b"glTF":
              raise RuntimeError("TRELLIS GLB retrieval/validation failed")

          meta={
              "space":"trellis-community/TRELLIS",
              "mode":"single-image",
              "source_image":str(src),
              "seed":42,
              "ss_guidance_strength":7.5,
              "ss_sampling_steps":12,
              "slat_guidance_strength":3.0,
              "slat_sampling_steps":12,
              "mesh_simplify":0.95,
              "texture_size":1024,
              "output_bytes":target.stat().st_size,
              "source":source,
          }
          (out/"trellis_single_metadata.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
          print("SAVED:",target,target.stat().st_size)
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-trellis-single
          path: hf-poc/output/
          if-no-files-found: error
