name: HF 3D POC Generate

on:
  push:
    branches:
      - test/hf-3d-poc-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'
      - 'hf-poc/**'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install clients
        run: pip install -q gradio_client pillow requests

      - name: Validate and normalize reference images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("hf-poc/input")
          dst = Path("hf-poc/runtime")
          dst.mkdir(parents=True, exist_ok=True)

          names = [
              "01_SIDE_authority",
              "02_FRONT_width_reference",
              "03_BACK_rear_reference",
              "04_3Q_FRONT_shape_support",
          ]
          for name in names:
              path = src / f"{name}.jpg"
              with Image.open(path) as im:
                  im.load()
                  print(name, im.size, im.mode)
                  im.convert("RGB").save(dst / f"{name}.png", format="PNG")
          PY

      - name: Generate EvoWild S-Type mesh with Hunyuan3D-2mv
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from gradio_client import Client, handle_file

          base = "https://tencent-hunyuan3d-2mv.hf.space"
          client = Client("tencent/Hunyuan3D-2mv")

          caption = (
              "slim futuristic quadruped racing creature, silver white body, cool blue and cyan accents, "
              "four clearly separated long legs, long narrow head, two upright horn ear structures, "
              "backward crest blades, blade-like fin tail, neutral standing pose, full body"
          )

          result = client.predict(
              caption,
              handle_file("hf-poc/runtime/04_3Q_FRONT_shape_support.png"),
              handle_file("hf-poc/runtime/02_FRONT_width_reference.png"),
              handle_file("hf-poc/runtime/03_BACK_rear_reference.png"),
              handle_file("hf-poc/runtime/01_SIDE_authority.png"),
              None,
              5,
              5.0,
              1234,
              256,
              True,
              8000,
              False,
              api_name="/shape_generation",
          )

          print("RESULT:", result)
          mesh_result = result[0]
          server_path = mesh_result.get("value") if isinstance(mesh_result, dict) else str(mesh_result)
          if not server_path:
              raise RuntimeError(f"No mesh path in result: {mesh_result!r}")

          encoded_path = quote(server_path, safe="/")
          candidates = [
              f"{base}/gradio_api/file={encoded_path}",
              f"{base}/file={encoded_path}",
          ]

          response = None
          used_url = None
          for mesh_url in candidates:
              r = requests.get(mesh_url, timeout=120)
              print("MESH_DOWNLOAD:", r.status_code, len(r.content), mesh_url)
              if r.ok and len(r.content) > 1024:
                  response = r
                  used_url = mesh_url
                  break

          if response is None:
              raise RuntimeError("Generated mesh exists, but no Gradio file endpoint returned it")

          out = Path("hf-poc/output")
          out.mkdir(parents=True, exist_ok=True)
          target = out / "evowild_s_hunyuan3d2mv.glb"
          target.write_bytes(response.content)

          if target.read_bytes()[:4] != b"glTF":
              raise RuntimeError("Downloaded file is not a binary GLB")

          metadata = {
              "source_space": "tencent/Hunyuan3D-2mv",
              "api": "/shape_generation",
              "caption": caption,
              "steps": 5,
              "guidance_scale": 5.0,
              "seed": result[3],
              "octree_resolution": 256,
              "mesh_stats": result[2],
              "server_path": server_path,
              "download_url": used_url,
              "output_filename": target.name,
              "output_bytes": target.stat().st_size,
          }
          (out / "metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          print("SAVED:", target, target.stat().st_size)
          PY

      - name: Upload 3D result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-hunyuan3d2mv
          path: hf-poc/output/
          if-no-files-found: error
