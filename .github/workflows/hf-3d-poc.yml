name: HF Pixal3D Server POC

on:
  push:
    branches:
      - test/hf-pixal3d-server-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client
        run: pip install -q gradio_client requests
      - name: Generate via Pixal3D Server
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, shutil, uuid
          from pathlib import Path
          import requests
          from gradio_client import Client, handle_file

          token=os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("HF_TOKEN missing")
          print("HF_AUTH: token present")
          src=Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          out=Path("hf-poc/output")
          out.mkdir(parents=True, exist_ok=True)
          sid="evowild-server-"+uuid.uuid4().hex[:10]

          client=Client("TencentARC/Pixal3D-Server", token=token)
          info=client.view_api(return_format="dict")
          eps=info.get("named_endpoints",{})
          print("ENDPOINTS:", list(eps))
          if "/preprocess" not in eps or "/generate_3d" not in eps:
              raise RuntimeError(f"Required API missing: {list(eps)}")

          processed=client.predict(handle_file(str(src)), api_name="/preprocess")
          print("PREPROCESSED:", repr(processed))

          result=client.predict(
              processed, 42, 1024,
              7.5, 0.7, 12, 5.0,
              7.5, 0.5, 12, 3.0,
              1.0, 0.0, 12, 3.0,
              -1.0, "deg", sid,
              api_name="/generate_3d"
          )
          print("GENERATE_RESULT:", repr(result)[:30000])

          if not isinstance(result, dict):
              raise RuntimeError(f"Unexpected generation result: {type(result)}")
          state=result.get("state_path")
          render_paths=result.get("render_paths") or {}
          copied=[]
          for mode,items in render_paths.items():
              for i,item in enumerate(items or []):
                  p=item if isinstance(item,str) else item.get("path")
                  u=None if isinstance(item,str) else item.get("url")
                  dst=out/f"pixal_server_{mode}_{i}.jpg"
                  if p and Path(p).exists():
                      shutil.copy2(p,dst); copied.append(dst.name)
                  elif u:
                      rr=requests.get(u,timeout=180)
                      if rr.ok:
                          dst.write_bytes(rr.content); copied.append(dst.name)

          if not state:
              raise RuntimeError("No state_path returned")

          glb_res=client.predict(state, 100000, 1024, sid, api_name="/extract_glb_api")
          print("GLB_RESULT:", repr(glb_res))
          p=glb_res.get("path") if isinstance(glb_res,dict) else str(glb_res)
          u=glb_res.get("url") if isinstance(glb_res,dict) else None
          dst=out/"evowild_s_pixal3d_server.glb"
          if p and Path(p).exists():
              shutil.copy2(p,dst)
          elif u:
              rr=requests.get(u,timeout=180)
              if rr.ok: dst.write_bytes(rr.content)
          if not dst.exists() or dst.read_bytes()[:4] != b"glTF":
              raise RuntimeError("No valid GLB retrieved")

          meta={
            "space":"TencentARC/Pixal3D-Server",
            "resolution":1024,
            "seed":42,
            "session_id":sid,
            "glb_bytes":dst.stat().st_size,
            "render_files":copied,
            "camera_angle_x":result.get("camera_angle_x"),
            "distance":result.get("distance"),
          }
          (out/"pixal3d_server_metadata.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
          print("SAVED:", json.dumps(meta))
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-pixal3d-server
          path: hf-poc/output/
          if-no-files-found: warn
