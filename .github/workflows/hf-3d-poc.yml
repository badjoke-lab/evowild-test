name: HF Microsoft TRELLIS Dedicated POC

on:
  push:
    branches:
      - test/hf-ms-trellis-dedicated-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client
        run: pip install -q gradio_client requests
      - name: Generate with Microsoft TRELLIS
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, shutil
          from pathlib import Path
          import requests
          from gradio_client import Client, handle_file

          token=os.environ.get("HF_TOKEN")
          src=Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          out=Path("hf-poc/output")
          out.mkdir(parents=True,exist_ok=True)

          client=Client("microsoft/TRELLIS", token=token)
          info=client.view_api(return_format="dict")
          eps=info.get("named_endpoints",{})
          print("ENDPOINTS:", list(eps))
          for name,ep in eps.items():
              print("EP:",name,[p.get("parameter_name") for p in ep.get("parameters",[])])

          # Initialize server-side session/state where exposed.
          for init_ep in ["/start_session","/lambda"]:
              if init_ep in eps:
                  try:
                      print("INIT",init_ep,client.predict(api_name=init_ep))
                  except Exception as e:
                      print("INIT_ERROR",init_ep,repr(e))

          image_arg=handle_file(str(src))
          if "/preprocess_image" in eps:
              p=client.predict(image_arg, api_name="/preprocess_image")
              print("PREPROCESSED:",repr(p))
              image_arg=p

          gen="/generate_and_extract_glb" if "/generate_and_extract_glb" in eps else None
          if not gen:
              candidates=[]
              for name,ep in eps.items():
                  params=[p.get("parameter_name") for p in ep.get("parameters",[])]
                  if "mesh_simplify" in params and "texture_size" in params:
                      candidates.append(name)
              if candidates: gen=candidates[0]
          if not gen:
              raise RuntimeError(f"No TRELLIS generation endpoint found: {list(eps)}")

          params=eps[gen].get("parameters",[])
          vals={
            "image":image_arg,
            "multiimages":[],
            "seed":42,
            "ss_guidance_strength":7.5,
            "ss_sampling_steps":12,
            "slat_guidance_strength":3.0,
            "slat_sampling_steps":12,
            "multiimage_algo":"stochastic",
            "mesh_simplify":0.95,
            "texture_size":1024,
          }
          args=[]
          for p in params:
              n=p.get("parameter_name")
              if n in vals:
                  args.append(vals[n])
              elif p.get("parameter_has_default"):
                  args.append(p.get("parameter_default"))
              else:
                  raise RuntimeError(f"Unsupported required parameter {n!r}")
          print("CALL:",gen,[p.get("parameter_name") for p in params])
          result=client.predict(*args,api_name=gen)
          print("RESULT:",repr(result)[:30000])

          items=list(result) if isinstance(result,(list,tuple)) else [result]
          candidates=[]
          for item in items:
              if isinstance(item,str):
                  candidates.append((item,None))
              elif isinstance(item,dict):
                  p=item.get("path") or item.get("value")
                  if p: candidates.append((str(p),item.get("url")))
          glbs=[x for x in candidates if x[0].lower().endswith(".glb")]
          if not glbs:
              raise RuntimeError(f"No GLB result: {candidates}")
          path,url=glbs[-1]
          dst=out/"evowild_s_ms_trellis.glb"
          if Path(path).exists():
              shutil.copy2(path,dst)
          elif url:
              r=requests.get(url,timeout=180)
              if r.ok: dst.write_bytes(r.content)
          if not dst.exists():
              base=str(getattr(client,"src","")).rstrip("/")
              from urllib.parse import quote
              enc=quote(path,safe="/")
              for u in [f"{base}/gradio_api/file={enc}",f"{base}/file={enc}"]:
                  r=requests.get(u,timeout=180)
                  if r.ok and len(r.content)>1024:
                      dst.write_bytes(r.content); break
          if not dst.exists() or dst.read_bytes()[:4] != b"glTF":
              raise RuntimeError("No valid GLB")
          meta={"space":"microsoft/TRELLIS","endpoint":gen,"bytes":dst.stat().st_size}
          (out/"ms_trellis_metadata.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
          print("SAVED:",json.dumps(meta))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-ms-trellis
          path: hf-poc/output/
          if-no-files-found: warn
