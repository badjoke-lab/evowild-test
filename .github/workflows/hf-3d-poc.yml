name: HF Direct3D-S2 Inspect

on:
  push:
    branches:
      - test/hf-direct3ds2-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q gradio_client
      - name: Inspect Direct3D-S2 API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,json
          from gradio_client import Client
          client=Client("wushuang98/Direct3D-S2-v1.0-demo", token=os.environ.get("HF_TOKEN"))
          info=client.view_api(return_format="dict")
          print("API_INFO:",json.dumps(info,default=str))
          PY
