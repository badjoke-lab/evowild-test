name: HF Hunyuan3D 2mv Auth Textured POC

on:
  push:
    branches:
      - test/hf-hunyuan2mv-auth-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: pip install -q gradio_client pillow requests

      - name: Generate textured EvoWild GLB with Hunyuan3D-2mv
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image
          from gradio_client import Client, handle_file

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("HF_TOKEN secret missing")
          print("HF_AUTH: token present")

          runtime = Path("hf-poc/runtime")
          out = Path("hf-poc/output")
          runtime.mkdir(parents=True, exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)

          refs = {
              "image": "hf-poc/input/04_3Q_FRONT_shape_support.jpg",
              "mv_image_front": "hf-poc/input/02_FRONT_width_reference.jpg",
              "mv_image_back": "hf-poc/input/03_BACK_rear_reference.jpg",
              "mv_image_left": "hf-poc/input/01_SIDE_authority.jpg",
          }
          normalized = {}
          for key, src in refs.items():
              p = runtime / f"{key}.png"
              Image.open(src).convert("RGBA").save(p)
              normalized[key] = p

          client = Client("tencent/Hunyuan3D-2mv", token=token)
          info = client.view_api(return_format="dict")
          eps = info.get("named_endpoints", {})
          if "/generation_all" not in eps:
              raise RuntimeError(f"/generation_all unavailable: {list(eps)}")

          params = eps["/generation_all"].get("parameters", [])
          names = [p.get("parameter_name") for p in params]
          print("PARAMS:", names)

          caption = (
              "slim futuristic quadruped racing creature, silver white body, cool blue accents, "
              "cyan glowing accents, four clearly separated long legs, long narrow head, "
              "two upright horn ear structures, backward crest blades, blade-like fin tail, "
              "head mounted Cue Band device on both sides, neutral standing pose, full body"
          )

          values = {
              "caption": caption,
              "image": handle_file(str(normalized["image"])),
              "mv_image_front": handle_file(str(normalized["mv_image_front"])),
              "mv_image_back": handle_file(str(normalized["mv_image_back"])),
              "mv_image_left": handle_file(str(normalized["mv_image_left"])),
              "mv_image_right": None,
              "steps": 5,
              "guidance_scale": 5.0,
              "seed": 1234,
              "octree_resolution": 128,
              "check_box_rembg": True,
              "num_chunks": 8000,
              "randomize_seed": False,
          }

          args = []
          for p in params:
              name = p.get("parameter_name")
              if name in values:
                  args.append(values[name])
              elif p.get("parameter_has_default"):
                  args.append(p.get("parameter_default"))
              else:
                  raise RuntimeError(f"Unsupported required parameter: {name}")

          result = client.predict(*args, api_name="/generation_all")
          print("RESULT:", result)

          items = list(result) if isinstance(result, (list, tuple)) else [result]
          file_items = []
          for item in items:
              if isinstance(item, str):
                  if item.endswith((".glb",".obj",".ply",".stl")) or "/tmp/" in item:
                      file_items.append((item, None))
              elif isinstance(item, dict):
                  path = item.get("path") or item.get("value")
                  url = item.get("url")
                  if path and (str(path).endswith((".glb",".obj",".ply",".stl")) or "/tmp/" in str(path)):
                      file_items.append((str(path), url))

          print("FILE_ITEMS:", file_items)
          if len(file_items) < 2:
              raise RuntimeError(f"Expected white + textured files, got: {file_items}")

          base = str(getattr(client, "src", "https://tencent-hunyuan3d-2mv.hf.space")).rstrip("/")

          def save_item(item, target):
              path, url = item
              lp = Path(path)
              if lp.exists():
                  shutil.copy2(lp, target)
                  return "local"
              if url:
                  r = requests.get(url, timeout=180)
                  print("DIRECT_DOWNLOAD:", r.status_code, len(r.content), url)
                  if r.ok and len(r.content) > 1024:
                      target.write_bytes(r.content)
                      return url
              enc = quote(path, safe="/")
              for u in [f"{base}/gradio_api/file={enc}", f"{base}/file={enc}"]:
                  r = requests.get(u, timeout=180)
                  print("DOWNLOAD:", r.status_code, len(r.content), u)
                  if r.ok and len(r.content) > 1024:
                      target.write_bytes(r.content)
                      return u
              raise RuntimeError(f"Could not retrieve {path}")

          white = out / "evowild_s_hunyuan3d2mv_auth_white.glb"
          textured = out / "evowild_s_hunyuan3d2mv_auth_textured.glb"
          white_src = save_item(file_items[0], white)
          tex_src = save_item(file_items[1], textured)

          for p in (white, textured):
              if p.read_bytes()[:4] != b"glTF":
                  raise RuntimeError(f"Not GLB: {p}")

          meta = {
              "space": "tencent/Hunyuan3D-2mv",
              "endpoint": "/generation_all",
              "octree_resolution": 128,
              "steps": 5,
              "seed": result[-1] if isinstance(result,(list,tuple)) else 1234,
              "mesh_stats": result[-2] if isinstance(result,(list,tuple)) and len(result) >= 2 else None,
              "white_bytes": white.stat().st_size,
              "textured_bytes": textured.stat().st_size,
              "white_source": white_src,
              "textured_source": tex_src,
          }
          (out/"hunyuan3d2mv_auth_metadata.json").write_text(json.dumps(meta, indent=2), encoding="utf-8")
          print("SAVED_TEXTURED:", textured.stat().st_size)
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-hunyuan3d2mv-auth-textured
          path: hf-poc/output/
          if-no-files-found: error
