name: HF Stable Fast 3D Retry POC

on:
  push:
    branches:
      - test/hf-sf3d-retry-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: pip install -q gradio_client pillow requests

      - name: Generate textured GLB with Stable Fast 3D
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, time, shutil, os
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image
          from gradio_client import Client, handle_file

          src = Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          runtime = Path("hf-poc/runtime")
          out = Path("hf-poc/output")
          runtime.mkdir(parents=True, exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)

          # Keep the silver-white creature intact. Stable Fast 3D receives the
          # original 3/4 reference and handles foreground framing itself.
          cutout = src

          spaces = [
              ("Upsampler/stable-fast-3d", "https://upsampler-stable-fast-3d.hf.space", 4),
              ("stabilityai/stable-fast-3d", "https://stabilityai-stable-fast-3d.hf.space", 1),
          ]

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("HF_TOKEN secret is not available to this workflow")
          print("HF_AUTH: token present")

          last_error = None
          success = None

          for space_id, base, attempts in spaces:
              try:
                  client = Client(space_id, token=token)
                  info = client.view_api(return_format="dict")
                  endpoints = info.get("named_endpoints", {})
                  api_name = next((n for n in ["/image_to_glb_1","/image_to_glb","/run_button"] if n in endpoints), None)
                  if api_name is None:
                      raise RuntimeError(f"No supported endpoint in {space_id}: {list(endpoints)}")
                  print("SPACE:", space_id, "ENDPOINT:", api_name)

                  for attempt in range(1, attempts + 1):
                      try:
                          print("ATTEMPT:", space_id, attempt)
                          result = client.predict(
                              handle_file(str(cutout)),
                              0.85,
                              "None",
                              -1,
                              1024,
                              api_name=api_name,
                          )
                          print("RESULT:", result)
                          success = (client, base, space_id, api_name, result, attempt)
                          break
                      except Exception as e:
                          last_error = e
                          print("ATTEMPT_ERROR:", repr(e))
                          if attempt < attempts:
                              time.sleep(15)
                  if success:
                      break
              except Exception as e:
                  last_error = e
                  print("SPACE_ERROR:", space_id, repr(e))

          if not success:
              raise RuntimeError(f"All Stable Fast 3D attempts failed: {last_error!r}")

          client, base, space_id, api_name, result, attempt = success
          items = list(result) if isinstance(result, (tuple,list)) else [result]

          def file_candidate(item):
              if isinstance(item, str):
                  return item, None
              if isinstance(item, dict):
                  return item.get("path") or item.get("value"), item.get("url")
              return None, None

          candidates = []
          for item in items:
              p,u = file_candidate(item)
              if p and (str(p).endswith(".glb") or "/tmp/" in str(p)):
                  candidates.append((str(p),u))
          if not candidates:
              # Stable Fast 3D commonly returns preview first and model last.
              p,u = file_candidate(items[-1])
              if p:
                  candidates.append((str(p),u))
          if not candidates:
              raise RuntimeError(f"No model file returned: {result!r}")

          path, url = candidates[-1]
          target = out / "evowild_s_stable_fast_3d_textured.glb"
          lp = Path(path)
          source = None
          if lp.exists():
              shutil.copy2(lp, target)
              source = "local"
          elif url:
              r = requests.get(url, timeout=180)
              print("DIRECT_DOWNLOAD:", r.status_code, len(r.content), url)
              if r.ok and len(r.content) > 1024:
                  target.write_bytes(r.content)
                  source = url
          if not target.exists():
              enc = quote(path, safe="/")
              for u in [f"{base}/gradio_api/file={enc}", f"{base}/file={enc}"]:
                  r = requests.get(u, timeout=180)
                  print("DOWNLOAD:", r.status_code, len(r.content), u)
                  if r.ok and len(r.content) > 1024:
                      target.write_bytes(r.content)
                      source = u
                      break
          if not target.exists():
              raise RuntimeError(f"Could not retrieve generated GLB: {path}")
          if target.read_bytes()[:4] != b"glTF":
              raise RuntimeError("Generated file is not a valid binary GLB")

          meta = {
              "space": space_id,
              "endpoint": api_name,
              "attempt": attempt,
              "source_image": str(src),
              "foreground_ratio": 0.85,
              "remesh": "None",
              "vertex_count": -1,
              "texture_size": 1024,
              "output_bytes": target.stat().st_size,
              "source": source,
              "result_repr": repr(result)[:10000],
          }
          (out/"stable_fast_3d_metadata.json").write_text(json.dumps(meta, indent=2), encoding="utf-8")
          print("SAVED:", target, target.stat().st_size)
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-stable-fast-3d-textured
          path: hf-poc/output/
          if-no-files-found: error
