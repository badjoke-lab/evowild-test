name: HF Hunyuan3D 2.1 POC

on:
  push:
    branches:
      - test/hf-hunyuan21-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client
        run: pip install -q gradio_client pillow requests

      - name: Generate EvoWild with official Hunyuan3D 2.1
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image
          from gradio_client import Client, handle_file

          out = Path("hf-poc/output")
          runtime = Path("hf-poc/runtime")
          out.mkdir(parents=True, exist_ok=True)
          runtime.mkdir(parents=True, exist_ok=True)

          # Normalize all four references to PNG.
          refs = {
              "image": "hf-poc/input/04_3Q_FRONT_shape_support.jpg",
              "mv_image_front": "hf-poc/input/02_FRONT_width_reference.jpg",
              "mv_image_back": "hf-poc/input/03_BACK_rear_reference.jpg",
              "mv_image_left": "hf-poc/input/01_SIDE_authority.jpg",
          }
          normalized = {}
          for key, src in refs.items():
              p = runtime / f"{key}.png"
              Image.open(src).convert("RGBA").save(p)
              normalized[key] = str(p)

          client = Client("tencent/Hunyuan3D-2.1")
          info = client.view_api(return_format="dict")
          print("API_INFO:", json.dumps(info, default=str))

          endpoints = info.get("named_endpoints", {})
          api_name = "/generation_all" if "/generation_all" in endpoints else None
          if api_name is None:
              # Prefer any endpoint whose name implies full generation.
              candidates = [k for k in endpoints if "generation" in k.lower() or "generate" in k.lower()]
              if not candidates:
                  raise RuntimeError(f"No generation endpoint found: {list(endpoints)}")
              api_name = candidates[0]
          print("USING_ENDPOINT:", api_name)

          ep = endpoints[api_name]
          params = ep.get("parameters", [])
          values = {
              "caption": "slim futuristic quadruped racing creature, silver white body, cool blue accents, cyan glowing accents, four clearly separated long legs, long narrow head, two upright horn ear structures, backward crest blades, blade-like fin tail, head mounted Cue Band on both sides, neutral standing pose, full body",
              "image": handle_file(normalized["image"]),
              "mv_image_front": handle_file(normalized["mv_image_front"]),
              "mv_image_back": handle_file(normalized["mv_image_back"]),
              "mv_image_left": handle_file(normalized["mv_image_left"]),
              "mv_image_right": None,
              "steps": 5,
              "guidance_scale": 5.0,
              "seed": 1234,
              "octree_resolution": 196,
              "check_box_rembg": True,
              "num_chunks": 8000,
              "randomize_seed": False,
          }

          args = []
          for p in params:
              name = p.get("parameter_name")
              if name in values:
                  args.append(values[name])
              elif p.get("parameter_has_default"):
                  args.append(p.get("parameter_default"))
              else:
                  raise RuntimeError(f"Unsupported required parameter {name!r} for {api_name}")
          print("PARAM_NAMES:", [p.get("parameter_name") for p in params])

          result = client.predict(*args, api_name=api_name)
          print("RESULT:", result)

          if not isinstance(result, (list, tuple)):
              result_items = [result]
          else:
              result_items = list(result)

          def extract_file(item):
              if isinstance(item, str):
                  if item.endswith((".glb",".obj",".ply",".stl")) or Path(item).exists():
                      return item, None
              if isinstance(item, dict):
                  path = item.get("path") or item.get("value")
                  url = item.get("url")
                  if path and (str(path).endswith((".glb",".obj",".ply",".stl")) or "/tmp/" in str(path)):
                      return str(path), url
              return None

          file_items = [x for x in (extract_file(i) for i in result_items) if x]
          print("FILE_ITEMS:", file_items)
          if not file_items:
              raise RuntimeError("Generation returned no downloadable 3D file")

          base = str(getattr(client, "src", "https://tencent-hunyuan3d-2-1.hf.space")).rstrip("/")

          def save_file(path, url, target):
              p = Path(path)
              if p.exists():
                  shutil.copy2(p, target)
                  return "local"
              if url:
                  r = requests.get(url, timeout=180)
                  print("DIRECT_DOWNLOAD:", r.status_code, len(r.content), url)
                  if r.ok and len(r.content) > 1024:
                      target.write_bytes(r.content)
                      return url
              enc = quote(path, safe="/")
              for u in [f"{base}/gradio_api/file={enc}", f"{base}/file={enc}"]:
                  r = requests.get(u, timeout=180)
                  print("DOWNLOAD:", r.status_code, len(r.content), u)
                  if r.ok and len(r.content) > 1024:
                      target.write_bytes(r.content)
                      return u
              raise RuntimeError(f"Could not retrieve generated file: {path}")

          saved = []
          for idx, (path, url) in enumerate(file_items[:3]):
              target = out / f"evowild_s_hunyuan3d21_{idx}.glb"
              source = save_file(path, url, target)
              if target.read_bytes()[:4] != b"glTF":
                  raise RuntimeError(f"{target} is not GLB")
              saved.append({"file":target.name,"bytes":target.stat().st_size,"source":source})

          meta = {
              "space":"tencent/Hunyuan3D-2.1",
              "api":api_name,
              "parameters":[p.get("parameter_name") for p in params],
              "saved":saved,
              "result_repr":repr(result)[:20000],
          }
          (out/"hunyuan3d21_metadata.json").write_text(json.dumps(meta, indent=2), encoding="utf-8")
          print("SAVED:", json.dumps(saved))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-hunyuan3d21
          path: hf-poc/output/
          if-no-files-found: error
