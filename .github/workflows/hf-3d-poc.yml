name: HF 3D POC Generate Textured Mini Turbo

on:
  push:
    branches:
      - test/hf-3d-poc-20260921
    paths:
      - '.github/workflows/hf-3d-poc.yml'
      - 'hf-poc/**'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install clients
        run: pip install -q gradio_client pillow requests

      - name: Validate and normalize reference images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("hf-poc/input")
          dst = Path("hf-poc/runtime")
          dst.mkdir(parents=True, exist_ok=True)

          names = [
              "01_SIDE_authority",
              "02_FRONT_width_reference",
              "03_BACK_rear_reference",
              "04_3Q_FRONT_shape_support",
          ]
          for name in names:
              path = src / f"{name}.jpg"
              with Image.open(path) as im:
                  im.load()
                  print(name, im.size, im.mode)
                  im.convert("RGB").save(dst / f"{name}.png", format="PNG")
          PY

      - name: Generate textured EvoWild S-Type with Hunyuan3D-2mv
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from gradio_client import Client, handle_file

          base = "https://tencent-hunyuan3d-2mini-turbo.hf.space"
          client = Client("tencent/Hunyuan3D-2mini-Turbo")

          caption = (
              "slim futuristic quadruped racing creature, silver white body, cool blue and cyan accents, "
              "four clearly separated long legs, long narrow head, two upright horn ear structures, "
              "backward crest blades, blade-like fin tail, neutral standing pose, full body"
          )

          result = client.predict(
              caption,
              handle_file("hf-poc/runtime/04_3Q_FRONT_shape_support.png"),
              None,
              None,
              None,
              None,
              5,
              5.0,
              1234,
              256,
              True,
              8000,
              False,
              api_name="/generation_all",
          )

          print("RESULT:", result)

          out = Path("hf-poc/output")
          out.mkdir(parents=True, exist_ok=True)

          def download_file(file_result, target_name):
              server_path = file_result.get("value") if isinstance(file_result, dict) else str(file_result)
              if not server_path:
                  raise RuntimeError(f"No file path in result: {file_result!r}")
              encoded_path = quote(server_path, safe="/")
              candidates = [
                  f"{base}/gradio_api/file={encoded_path}",
                  f"{base}/file={encoded_path}",
              ]
              for url in candidates:
                  r = requests.get(url, timeout=180)
                  print("DOWNLOAD:", target_name, r.status_code, len(r.content), url)
                  if r.ok and len(r.content) > 1024:
                      target = out / target_name
                      target.write_bytes(r.content)
                      if target.read_bytes()[:4] != b"glTF":
                          raise RuntimeError(f"{target_name} is not a binary GLB")
                      return server_path, url, target.stat().st_size
              raise RuntimeError(f"Could not download {target_name}")

          white_path, white_url, white_bytes = download_file(
              result[0], "evowild_s_hunyuan3d2mini_turbo_white.glb"
          )
          textured_path, textured_url, textured_bytes = download_file(
              result[1], "evowild_s_hunyuan3d2mini_turbo_textured.glb"
          )

          metadata = {
              "source_space": "tencent/Hunyuan3D-2mini-Turbo",
              "api": "/generation_all",
              "caption": caption,
              "steps": 5,
              "guidance_scale": 5.0,
              "seed": result[4],
              "octree_resolution": 256,
              "mesh_stats": result[3],
              "white": {
                  "server_path": white_path,
                  "download_url": white_url,
                  "output_bytes": white_bytes,
              },
              "textured": {
                  "server_path": textured_path,
                  "download_url": textured_url,
                  "output_bytes": textured_bytes,
              },
          }
          (out / "metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          print("SAVED_TEXTURED:", textured_bytes)
          PY

      - name: Upload 3D result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-hunyuan3d2mini-turbo-textured
          path: hf-poc/output/
          if-no-files-found: error
