name: UniMate S Bench

on:
  push:
    branches:
      - exp/unimate-s-motion-bench-20261001
    paths:
      - ".github/workflows/unimate-s-preflight.yml"
      - "public/models/evowild-s/focus-rigged-v5.glb"
      - "scripts/unimate/**"
      - "docs/unimate-s-motion-bench-v0.1.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  UNIMATE_COMMIT: 2c5b384715aa63d8639b1ed7eb74bfe614570c7a
  BENCH_OBJECT: evos

jobs:
  preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout EvoWild bench
        uses: actions/checkout@v4

      - name: Install Blender and preprocessing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg python3-pip
          python3 -m pip install --user --break-system-packages loguru matplotlib imageio imageio-ffmpeg tqdm

      - name: Checkout pinned UniMate and Motion
        run: |
          git clone https://github.com/Friedrich-M/UniMate.git /tmp/UniMate
          git -C /tmp/UniMate checkout "$UNIMATE_COMMIT"
          git clone https://github.com/inbar-2344/Motion.git /tmp/Motion
          test -f /tmp/Motion/Animation.py
          test -f /tmp/Motion/Quaternions.py

      - name: Preprocess EvoWild S with explicit facing pair
        env:
          PYTHONPATH: /tmp/UniMate:/tmp/Motion:/home/runner/.local/lib/python3.12/site-packages:/usr/lib/python3/dist-packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.unimate-preflight" "$GITHUB_WORKSPACE/.unimate-input"
          cp "$GITHUB_WORKSPACE/public/models/evowild-s/focus-rigged-v5.glb" "$GITHUB_WORKSPACE/.unimate-input/${BENCH_OBJECT}.glb"
          cd /tmp/UniMate
          blender -b -P data_process/mesh_animation/preprocess_char.py --             --char_path="$GITHUB_WORKSPACE/.unimate-input/${BENCH_OBJECT}.glb"             --output_dir="$GITHUB_WORKSPACE/.unimate-preflight"             --face_r=hind_R_upper             --face_l=hind_L_upper             --formats=glb             --keep_intermediate

      - name: Assert topology and facing
        run: |
          python3 - <<'PY'
          import json
          import numpy as np
          from pathlib import Path

          root = Path(".unimate-preflight")
          cond = np.load(root / "cond.npy", allow_pickle=True).item()
          if list(cond) != ["evos"]:
              raise SystemExit(f"unexpected object type(s): {list(cond)}")
          c = cond["evos"]
          names = [str(x) for x in c["joint_names"]]
          required = {
              "pelvis", "spine", "chest", "neck", "head", "tail",
              "hind_L_upper", "hind_R_upper", "hind_L_lower", "hind_R_lower",
              "hind_L_foot", "hind_R_foot", "fore_L_upper", "fore_R_upper",
              "fore_L_lower", "fore_R_lower", "fore_L_foot", "fore_R_foot",
          }
          missing = sorted(required - set(names))
          if missing:
              raise SystemExit(f"missing required joints: {missing}")
          face = c.get("face_joint_idxs", {})
          if int(face.get("r_hip", -1)) < 0 or int(face.get("l_hip", -1)) < 0:
              raise SystemExit(f"facing pair unresolved: {face}")
          motion_files = sorted(p.name for p in (root / "motions").glob("*.npz"))
          canonical = sorted(p.name for p in root.glob("*_canonical.glb"))
          if not motion_files or not canonical:
              raise SystemExit(f"missing preprocess outputs motions={motion_files} canonical={canonical}")
          summary = {
              "object_type": "evos",
              "joint_count": len(c["parents"]),
              "joint_names": names,
              "clean_joint_names": [str(x) for x in c.get("clean_joint_names", [])],
              "face_joint_idxs": face,
              "kinematic_chains": c.get("kinematic_chains"),
              "motion_files": motion_files,
              "canonical_glbs": canonical,
          }
          def conv(x):
              if hasattr(x, "tolist"):
                  return x.tolist()
              if isinstance(x, (set, tuple)):
                  return list(x)
              raise TypeError(type(x).__name__)
          (root / "preflight-summary.json").write_text(json.dumps(summary, indent=2, default=conv))
          print(json.dumps(summary, indent=2, default=conv))
          PY

      - name: Upload preflight artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unimate-s-preflight
          path: .unimate-preflight/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  cpu-smoke:
    needs: preprocess
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout EvoWild bench
        uses: actions/checkout@v4

      - name: Download preflight asset
        uses: actions/download-artifact@v4
        with:
          name: unimate-s-preflight
          path: .unimate-preflight

      - name: Checkout pinned UniMate and Motion
        run: |
          git clone https://github.com/Friedrich-M/UniMate.git /tmp/UniMate
          git -C /tmp/UniMate checkout "$UNIMATE_COMMIT"
          git clone https://github.com/inbar-2344/Motion.git /tmp/Motion

      - name: Install CPU inference dependencies
        run: |
          python3 -m pip install --break-system-packages --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python3 -m pip install --break-system-packages             numpy==2.2.6 transformers==5.16.1 sentencepiece==0.2.1             torch-geometric==2.7.0 torchdiffeq==0.2.5 einops==0.8.2             accelerate==1.14.0 tyro==1.0.12 rich==14.3.3 loguru==0.7.3 tqdm==4.67.3             matplotlib==3.10.8 imageio==2.37.3 imageio-ffmpeg==0.6.0

      - name: Download recommended UniMate v2 checkpoint
        run: |
          mkdir -p .unimate-exp/checkpoints
          curl -L --fail --retry 5 -o .unimate-exp/config.json             https://huggingface.co/Linzhan/UniMate/resolve/main/unimate_uniml3d_f60_v2/config.json
          curl -L --fail --retry 5 -o .unimate-exp/dataset_stats.npy             https://huggingface.co/Linzhan/UniMate/resolve/main/unimate_uniml3d_f60_v2/dataset_stats.npy
          curl -L --fail --retry 5 -o .unimate-exp/checkpoints/checkpoint_step_100000.pt             https://huggingface.co/Linzhan/UniMate/resolve/main/unimate_uniml3d_f60_v2/checkpoints/checkpoint_step_100000.pt
          test "$(stat -c%s .unimate-exp/checkpoints/checkpoint_step_100000.pt)" -gt 1000000000

      - name: Patch inference config for isolated EvoWild topology
        run: |
          python3 - <<'PY'
          import json, os
          p = ".unimate-exp/config.json"
          with open(p) as f:
              c = json.load(f)
          c["objaverse"]["path"] = os.path.abspath(".unimate-preflight")
          c["objaverse"]["objects_num"] = -1
          c["objaverse"]["filter_object"] = False
          c["dataset"]["dataset_list"] = ["objaverse"]
          c.setdefault("sampling", {})["device"] = "cpu"
          with open(p, "w") as f:
              json.dump(c, f, indent=2)
          print("max_joints", c["dataset"].get("max_joints"), "max_depth", c["dataset"].get("max_depth"))
          PY
          cat > .unimate-cases.json <<'JSON'
          {
            "evos-steady_run": "An object runs forward at a steady athletic pace with coordinated four-limb locomotion."
          }
          JSON

      - name: Run one-sample CPU smoke generation
        env:
          PYTHONPATH: /tmp/UniMate:/tmp/Motion
          TOKENIZERS_PARALLELISM: "false"
        run: |
          cd /tmp/UniMate
          /usr/bin/time -v python3 -m unimate.inference.sample             --exp_dir="$GITHUB_WORKSPACE/.unimate-exp"             --model_path="$GITHUB_WORKSPACE/.unimate-exp/checkpoints/checkpoint_step_100000.pt"             --test_cases_json="$GITHUB_WORKSPACE/.unimate-cases.json"             --num_repetitions=1             --batch_size=1             --seed=20261004             --output_dir="$GITHUB_WORKSPACE/.unimate-smoke"             --only_save_motion

      - name: Verify generated motion
        run: |
          find .unimate-smoke -maxdepth 4 -type f -printf '%p %s bytes\n'
          test "$(find .unimate-smoke -type f \( -name '*.npy' -o -name '*.npz' \) | wc -l)" -ge 1

      - name: Upload generated smoke motion
        uses: actions/upload-artifact@v4
        with:
          name: unimate-s-cpu-smoke
          path: .unimate-smoke/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
