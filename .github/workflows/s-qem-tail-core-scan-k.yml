name: EvoWild S source-QEM tail root topology scan K
on:
  push:
    branches: [exp/s-qem-tail-core-rebuild-20261011]
    paths:
      - .github/workflows/s-qem-tail-core-scan-k.yml
      - art/s-creature/blender/s_qem_tail_region_scan_k.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-QEM-tail-root-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_tail_region_scan_k.py
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-morph-a-v1/S-QEM-real-tail-morph-a-v1.blend
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-rebuild-k-v1/
            /.github/workflows/s-qem-tail-core-scan-k.yml
      - name: Lock exact authority and source QEM SHA
        run: |
          echo '93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png' | sha256sum --check -
          echo 'e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f  art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb' | sha256sum --check -
      - name: Install real Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Scan genuine QEM original tail base for valid retopology seam
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/experiments/qem-deformation-gate-20261010/tail-morph-a-v1/S-QEM-real-tail-morph-a-v1.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_tail_region_scan_k.py
      - name: Verify audit recorded face-boundary search
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-rebuild-k-v1/REAL_QEM_TAIL_BASE_SECTION_SCAN.json")
          d=json.loads(p.read_text())
          assert d["source_unchanged"] and not d["asset_approved"]
          assert d["original_vertices"]==29948 and d["original_triangles"]==59932
          assert d["candidate_count"]>20
          print("CLEAN_SEAM",d["any_clean_single_root_seam"],"TOP",d["top_candidates"][0])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-actual-QEM-immutable-tail-cut-roots-K
          path: art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-rebuild-k-v1/
          if-no-files-found: warn
      - name: Persist exact real-mesh scan to experimental branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-rebuild-k-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'audit: save QEM source-only tail-region seam topology diagnostic'
            git pull --rebase origin exp/s-qem-tail-core-rebuild-20261011
            git push origin HEAD:exp/s-qem-tail-core-rebuild-20261011
          fi
