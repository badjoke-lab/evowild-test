name: HF TripoSR CPU POC

on:
  push:
    branches:
      - test/hf-triposr-cpu-20260922
    paths:
      - '.github/workflows/hf-triposr-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU dependencies
        run: |
          python -m pip install -q --upgrade pip setuptools wheel
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy<2"
          pip install -q omegaconf==2.3.0 Pillow==10.1.0 einops==0.7.0 transformers==4.35.0 trimesh==4.0.5 huggingface-hub scikit-build-core ninja cmake pybind11 imageio
          pip install -q --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/TripoSR

      - name: Generate EvoWild mesh on CPU
        run: |
          python - <<'PY'
          import os, sys, json, time
          from pathlib import Path
          import numpy as np
          import torch
          from PIL import Image
          from huggingface_hub import login

          if os.environ.get("HF_TOKEN"):
              login(token=os.environ["HF_TOKEN"], add_to_git_credential=False)

          # TripoSR utils imports rembg even though this POC supplies an
          # already-prepared gray-background image and never calls rembg.
          import types
          sys.modules["rembg"] = types.ModuleType("rembg")

          sys.path.insert(0, "/tmp/TripoSR")
          from tsr.system import TSR

          out = Path("hf-poc/output-triposr-cpu")
          out.mkdir(parents=True, exist_ok=True)

          def prepare_canvas(src, crop_left, output_name):
              im = Image.open(src).convert("RGBA")
              w, h = im.size
              if crop_left > 0:
                  im = im.crop((int(w * crop_left), 0, w, h)).copy()
              else:
                  im = im.copy()
              px = im.load()
              for y in range(im.height):
                  for x in range(im.width):
                      r,g,b,a = px[x,y]
                      mn, mx = min(r,g,b), max(r,g,b)
                      if mn >= 245:
                          alpha = 0
                      elif mn >= 225 and mx - mn < 18:
                          alpha = int(max(0, min(255, (245 - mn) / 20 * 255)))
                      else:
                          alpha = 255
                      px[x,y] = (r,g,b,alpha)
              bbox = im.getbbox()
              if not bbox:
                  raise RuntimeError(f"No foreground after input cleanup: {src}")
              im = im.crop(bbox)
              iw, ih = im.size
              side = max(iw, ih)
              fill = 0.82
              scale = (side * fill) / max(iw, ih)
              nw, nh = max(1, int(iw*scale)), max(1, int(ih*scale))
              im = im.resize((nw, nh), Image.Resampling.LANCZOS)
              canvas = Image.new("RGB", (side, side), (128,128,128))
              rgb = Image.new("RGB", im.size, (128,128,128))
              rgb.paste(im.convert("RGB"), mask=im.getchannel("A"))
              canvas.paste(rgb, ((side-nw)//2, (side-nh)//2))
              input_path = out / output_name
              canvas.save(input_path)
              return canvas, input_path

          variants = [
              ("3q", Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg"), 0.30),
              ("side", Path("hf-poc/input/01_SIDE_authority.jpg"), 0.0),
          ]
          prepared = []
          for name, src, crop_left in variants:
              canvas, input_path = prepare_canvas(src, crop_left, f"triposr_input_{name}.png")
              prepared.append((name, src, canvas, input_path))
              print("prepared", name, input_path, canvas.size)

          print("torch", torch.__version__, "cuda", torch.cuda.is_available())

          t0=time.time()
          model = TSR.from_pretrained(
              "stabilityai/TripoSR",
              config_name="config.yaml",
              weight_name="model.ckpt",
          )
          model.renderer.set_chunk_size(512)
          model.to("cpu")
          model_init_seconds = round(time.time()-t0,2)
          print("model_init_seconds", model_init_seconds)

          results = []
          for name, src, canvas, input_path in prepared:
              t1=time.time()
              with torch.no_grad():
                  scene_codes = model([canvas], device="cpu")
              inference_seconds = round(time.time()-t1,2)
              print(name, "inference_seconds", inference_seconds)

              t2=time.time()
              meshes = model.extract_mesh(scene_codes, True, resolution=96)
              mesh_extract_seconds = round(time.time()-t2,2)
              print(name, "mesh_extract_seconds", mesh_extract_seconds)
              mesh = meshes[0]

              glb = out / f"evowild_s_triposr_cpu_{name}.glb"
              mesh.export(glb)
              if not glb.exists() or glb.read_bytes()[:4] != b"glTF":
                  raise RuntimeError(f"TripoSR GLB export failed: {name}")

              result = {
                  "variant": name,
                  "source_image": str(src),
                  "input_path": str(input_path),
                  "vertices": int(len(mesh.vertices)),
                  "faces": int(len(mesh.faces)),
                  "output_bytes": int(glb.stat().st_size),
                  "inference_seconds": inference_seconds,
                  "mesh_extract_seconds": mesh_extract_seconds,
                  "output_glb": str(glb),
              }
              results.append(result)
              print(json.dumps(result, indent=2))

          meta = {
              "model": "stabilityai/TripoSR",
              "license": "MIT",
              "device": "cpu",
              "chunk_size": 512,
              "mc_resolution": 96,
              "model_init_seconds": model_init_seconds,
              "variants": results,
              "total_seconds": round(time.time()-t0,2),
          }
          (out/"triposr_cpu_comparison_metadata.json").write_text(
              json.dumps(meta,indent=2), encoding="utf-8"
          )
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload CPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-triposr-cpu
          path: hf-poc/output-triposr-cpu/
          if-no-files-found: warn
