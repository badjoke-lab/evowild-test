name: build

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'feat/sf3d-game-integration-20260922') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        if: (github.head_ref == 'feat/sf3d-game-integration-20260922' || startsWith(github.ref_name, 'feat/sf3d-game-integration-'))
        with:
          python-version: '3.11'
      - name: Prepare Stable Fast 3D prototype asset
        if: (github.head_ref == 'feat/sf3d-game-integration-20260922' || startsWith(github.ref_name, 'feat/sf3d-game-integration-'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q numpy trimesh pillow
          mkdir -p /tmp/sf3d /tmp/sf3d-corrected /tmp/sf3d-white /tmp/sf3d-side /tmp/triposr-side /tmp/triposr-3q
          gh api repos/${{ github.repository }}/actions/artifacts/10644576625/zip > /tmp/sf3d.zip
          unzip -q /tmp/sf3d.zip -d /tmp/sf3d
          python scripts/prepare-sf3d-asset.py

          gh api repos/${{ github.repository }}/actions/artifacts/10702684118/zip > /tmp/sf3d-corrected.zip
          unzip -q /tmp/sf3d-corrected.zip -d /tmp/sf3d-corrected
          corrected_glb="$(find /tmp/sf3d-corrected -name 'evowild_s_stable_fast_3d_textured.glb' -print -quit)"
          corrected_meta="$(find /tmp/sf3d-corrected -name 'stable_fast_3d_metadata.json' -print -quit)"
          test -n "$corrected_glb"
          test -n "$corrected_meta"
          cp "$corrected_glb" public/models/evowild-s-sf3d-corrected.glb
          cp "$corrected_meta" public/models/evowild-s-sf3d-corrected.json

          gh api repos/${{ github.repository }}/actions/artifacts/10727195815/zip > /tmp/sf3d-white.zip
          unzip -q /tmp/sf3d-white.zip -d /tmp/sf3d-white
          white_glb="$(find /tmp/sf3d-white -name 'evowild_s_stable_fast_3d_textured.glb' -print -quit)"
          white_meta="$(find /tmp/sf3d-white -name 'stable_fast_3d_metadata.json' -print -quit)"
          test -n "$white_glb"
          test -n "$white_meta"
          cp "$white_glb" public/models/evowild-s-sf3d-white.glb
          cp "$white_meta" public/models/evowild-s-sf3d-white.json

          gh api repos/${{ github.repository }}/actions/artifacts/10704141291/zip > /tmp/sf3d-side.zip
          unzip -q /tmp/sf3d-side.zip -d /tmp/sf3d-side
          side_glb="$(find /tmp/sf3d-side -name 'evowild_s_stable_fast_3d_textured.glb' -print -quit)"
          side_meta="$(find /tmp/sf3d-side -name 'stable_fast_3d_metadata.json' -print -quit)"
          test -n "$side_glb"
          test -n "$side_meta"
          cp "$side_glb" public/models/evowild-s-sf3d-side.glb
          cp "$side_meta" public/models/evowild-s-sf3d-side.json

          gh api repos/${{ github.repository }}/actions/artifacts/10728052870/zip > /tmp/triposr-side.zip
          unzip -q /tmp/triposr-side.zip -d /tmp/triposr-side
          triposr_glb="$(find /tmp/triposr-side -name '*.glb' -print -quit)"
          triposr_meta="$(find /tmp/triposr-side -name 'metadata.json' -print -quit)"
          test -n "$triposr_glb"
          test -n "$triposr_meta"
          cp "$triposr_glb" public/models/evowild-s-triposr-side.glb
          cp "$triposr_meta" public/models/evowild-s-triposr-side.json

          gh api repos/${{ github.repository }}/actions/artifacts/10727044686/zip > /tmp/triposr-3q.zip
          unzip -q /tmp/triposr-3q.zip -d /tmp/triposr-3q
          triposr3q_glb="$(find /tmp/triposr-3q -name '*.glb' -print -quit)"
          triposr3q_meta="$(find /tmp/triposr-3q -name 'metadata.json' -print -quit)"
          test -n "$triposr3q_glb"
          test -n "$triposr3q_meta"
          cp "$triposr3q_glb" public/models/evowild-s-triposr-3q.glb
          cp "$triposr3q_meta" public/models/evowild-s-triposr-3q.json

          mkdir -p /tmp/hunyuan2mv
          gh api repos/${{ github.repository }}/actions/artifacts/10786733746/zip > /tmp/hunyuan2mv.zip
          unzip -q /tmp/hunyuan2mv.zip -d /tmp/hunyuan2mv
          hunyuan_glb="$(find /tmp/hunyuan2mv -name '*.glb' -print -quit)"
          hunyuan_meta="$(find /tmp/hunyuan2mv -name 'metadata.json' -print -quit)"
          test -n "$hunyuan_glb"
          test -n "$hunyuan_meta"
          cp "$hunyuan_glb" public/models/evowild-s-hunyuan2mv-raw.glb
          cp "$hunyuan_meta" public/models/evowild-s-hunyuan2mv-raw.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate SF3D LOD candidates
        if: (github.head_ref == 'feat/sf3d-game-integration-20260922' || startsWith(github.ref_name, 'feat/sf3d-game-integration-'))
        run: |
          npx --yes @gltf-transform/cli simplify \
            public/models/evowild-s-sf3d-corrected.glb \
            public/models/evowild-s-sf3d-corrected-lod1.glb \
            --ratio 0.5 --error 0.002
          npx --yes @gltf-transform/cli simplify \
            public/models/evowild-s-sf3d-corrected.glb \
            public/models/evowild-s-sf3d-corrected-lod2.glb \
            --ratio 0.25 --error 0.004
          npx --yes @gltf-transform/cli simplify \
            public/models/evowild-s-sf3d-corrected.glb \
            public/models/evowild-s-sf3d-corrected-lod3.glb \
            --ratio 0.125 --error 0.008

          python scripts/strip-glb-normal-map.py \
            public/models/evowild-s-sf3d-corrected-lod2.glb \
            /tmp/evowild-s-sf3d-corrected-lod2-lite-preprune.glb
          npx --yes @gltf-transform/cli prune \
            /tmp/evowild-s-sf3d-corrected-lod2-lite-preprune.glb \
            public/models/evowild-s-sf3d-corrected-lod2-lite.glb

          python scripts/strip-glb-normal-map.py \
            public/models/evowild-s-sf3d-corrected-lod3.glb \
            /tmp/evowild-s-sf3d-corrected-lod3-lite-preprune.glb
          npx --yes @gltf-transform/cli prune \
            /tmp/evowild-s-sf3d-corrected-lod3-lite-preprune.glb \
            public/models/evowild-s-sf3d-corrected-lod3-lite.glb

          ls -lh public/models/evowild-s-sf3d-corrected*.glb

          python scripts/clean-hunyuan2mv.py \
            public/models/evowild-s-hunyuan2mv-raw.glb \
            public/models/evowild-s-hunyuan2mv-clean.glb \
            public/models/evowild-s-hunyuan2mv-clean.json
          npx --yes @gltf-transform/cli simplify \
            public/models/evowild-s-hunyuan2mv-clean.glb \
            public/models/evowild-s-hunyuan2mv-lod1.glb \
            --ratio 0.20 --error 0.006
          npx --yes @gltf-transform/cli simplify \
            public/models/evowild-s-hunyuan2mv-clean.glb \
            public/models/evowild-s-hunyuan2mv-lod2.glb \
            --ratio 0.08 --error 0.012
          npx --yes @gltf-transform/cli simplify \
            public/models/evowild-s-hunyuan2mv-clean.glb \
            public/models/evowild-s-hunyuan2mv-lod3.glb \
            --ratio 0.04 --error 0.020
          npx --yes @gltf-transform/cli simplify \
            public/models/evowild-s-hunyuan2mv-clean.glb \
            public/models/evowild-s-hunyuan2mv-lod4.glb \
            --ratio 0.02 --error 0.030
          ls -lh public/models/evowild-s-hunyuan2mv-*.glb
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run browser validation
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == *"[targeted-hunyuan-stride-sync]"* ]]; then
            npm run test:e2e -- --workers=1 -g "link Hunyuan stride cadence to live race speed"
          elif [[ "$subject" == *"[targeted-hunyuan-rig-v3-browser]"* ]]; then
            npm run test:e2e -- --workers=1 -g "compare Hunyuan v21 full-v3 and v3 hybrid race rigs"
          elif [[ "$subject" == *"[targeted-hunyuan-gait-v21-browser]"* ]]; then
            npm run test:e2e -- --workers=1 -g "compare Hunyuan gait v1 v2 v21"
          elif [[ "$subject" == *"[targeted-hunyuan-gait-compare]"* ]]; then
            npm run test:e2e -- --workers=1 -g "compare Hunyuan gait v1 v2"
          elif [[ "$subject" == *"[targeted-hunyuan-gait-v2-browser]"* ]]; then
            npm run test:e2e -- --workers=1 -g "validate Hunyuan gait v2"
          elif [[ "$subject" == *"[targeted-hunyuan-rig-browser]"* ]]; then
            npm run test:e2e -- --workers=1 -g "animate rigged Hunyuan skeletal proof"
          elif [[ "$subject" == *"[targeted-hunyuan-pack]"* ]]; then
            npm run test:e2e -- --workers=1 -g "run S-only Hunyuan 18-racer pack"
          elif [[ "$subject" == *"[targeted-hunyuan-mixed]"* ]]; then
            npm run test:e2e -- --workers=1 -g "benchmark moving 18 Hunyuan mixed LOD race"
          elif [[ "$subject" == *"[targeted-hunyuan-final]"* ]]; then
            npm run test:e2e -- --workers=1 -g "capture Hunyuan LOD4 final views"
          elif [[ "$subject" == *"[targeted-hunyuan]"* ]]; then
            npm run test:e2e -- --workers=1 -g "compare raw and simplified Hunyuan multiview shapes|compare Hunyuan raw and LOD2 across four views|benchmark 18 Hunyuan LOD2 instances|benchmark 18 Hunyuan LOD3 and LOD4 instances|compare SF3D TripoSR and semantic Hunyuan across four views"
          elif [[ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" == "feat/sf3d-game-integration-20260922" ]]; then
            npm run test:e2e -- --workers=1
          else
            npm run test:e2e
          fi
      - name: Commit prepared SF3D asset
        if: (github.head_ref == 'feat/sf3d-game-integration-20260922' || startsWith(github.ref_name, 'feat/sf3d-game-integration-')) && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/evowild-s-sf3d-clean.glb \
            public/models/evowild-s-sf3d-clean.json \
            public/models/evowild-s-sf3d-corrected.glb \
            public/models/evowild-s-sf3d-corrected.json \
            public/models/evowild-s-sf3d-white.glb \
            public/models/evowild-s-sf3d-white.json \
            public/models/evowild-s-sf3d-side.glb \
            public/models/evowild-s-sf3d-side.json \
            public/models/evowild-s-triposr-side.glb \
            public/models/evowild-s-triposr-side.json \
            public/models/evowild-s-triposr-3q.glb \
            public/models/evowild-s-triposr-3q.json \
            public/models/evowild-s-hunyuan2mv-raw.glb \
            public/models/evowild-s-hunyuan2mv-raw.json \
            public/models/evowild-s-hunyuan2mv-clean.glb \
            public/models/evowild-s-hunyuan2mv-clean.json \
            public/models/evowild-s-hunyuan2mv-lod1.glb \
            public/models/evowild-s-hunyuan2mv-lod2.glb \
            public/models/evowild-s-hunyuan2mv-lod3.glb \
            public/models/evowild-s-hunyuan2mv-lod4.glb \
            public/models/evowild-s-sf3d-corrected-lod1.glb \
            public/models/evowild-s-sf3d-corrected-lod2.glb \
            public/models/evowild-s-sf3d-corrected-lod3.glb \
            public/models/evowild-s-sf3d-corrected-lod2-lite.glb \
            public/models/evowild-s-sf3d-corrected-lod3-lite.glb
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "test: refresh Stable Fast 3D validation assets"
            git fetch origin ${{ github.head_ref || github.ref_name }}
            git rebase origin/${{ github.head_ref || github.ref_name }}
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Persist rig browser screenshots
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[targeted-hunyuan-rig-browser]')
        run: |
          mkdir -p docs/visuals
          cp test-results/visuals/hunyuan-rigged-lab.png docs/visuals/
          cp test-results/visuals/hunyuan-rigged-race.png docs/visuals/
          cp test-results/visuals/hunyuan-rigged-side-*.png docs/visuals/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visuals/hunyuan-rigged-*.png
          if git diff --cached --quiet; then
            echo "No rig screenshot changes"
          else
            git commit -m "test: persist rig browser screenshots [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Persist Hunyuan pack screenshots
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[targeted-hunyuan-pack]')
        run: |
          mkdir -p docs/visuals
          cp test-results/visuals/hunyuan-s-only-race-pack.png docs/visuals/
          cp test-results/visuals/hunyuan-s-only-follow-pack.png docs/visuals/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visuals/hunyuan-s-only-*.png
          if git diff --cached --quiet; then
            echo "No Hunyuan pack screenshot changes"
          else
            git commit -m "test: persist Hunyuan pack screenshots [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload mobile visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-race-visuals
          path: test-results/visuals/**/*
          if-no-files-found: warn
