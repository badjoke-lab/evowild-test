name: build

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify 2.5D pages are in production build
        run: test -f dist/race-2_5d.html && test -f dist/race-quality.html
      - name: Generate P candidate from existing mf12 motion
        if: ${{ startsWith(github.head_ref, 'feat/2p5d-p-mf12-flow-transfer-') || startsWith(github.ref_name, 'feat/2p5d-p-mf12-flow-transfer-') }}
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
          python3 scripts/build_p_mf12_flow_transfer_v1.py
      - name: Upload P mf12 motion-transfer candidate
        if: ${{ always() && (startsWith(github.head_ref, 'feat/2p5d-p-mf12-flow-transfer-') || startsWith(github.ref_name, 'feat/2p5d-p-mf12-flow-transfer-')) }}
        uses: actions/upload-artifact@v4
        with:
          name: p-mf12-flow-transfer-v1
          path: artifacts/p-mf12-flow-transfer-v1/*
          if-no-files-found: error
      - run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$BRANCH" == feat/simplified-race-entry-stamina-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry Selection Support v1|individual stamina v1"
          elif [[ "$BRANCH" == feat/simplified-race-entry-pace-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry Selection Support v1|Race Agent Selection Support v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-selection-support-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Agent Selection Support v1|Race Entry Selection Support v1"
          elif [[ "$BRANCH" == feat/simplified-race-entry-support-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry Selection Support v1|Race Entry pre-race focus v2"
          elif [[ "$BRANCH" == feat/simplified-race-entry-focus-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry pre-race focus v2"
          elif [[ "$BRANCH" == feat/simplified-race-agent-creature-compat-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Agent-Creature Compatibility v1|Race Agent entity history v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-ownership-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Agent entity history v1|Race Agent Ownership Transfer v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-version-active-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Agent Version Evaluation v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-version-eval-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Agent Version Evolution v1|Agent Version Evaluation v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-version-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry v1|Agent Auto Strategy v1|Race Agent entity history v1|Agent Version Evolution v1|heavy 1200 course v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-history-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry v1|Agent Auto Strategy v1|Race Agent entity history v1|heavy 1200 course v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-auto-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Agent v1|Agent strategy balance v1|Race Entry v1|Agent Auto Strategy v1|heavy 1200 course v1"
          elif [[ "$BRANCH" == feat/simplified-race-entry-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Phase E simplified race|Race Agent v1|Agent strategy balance v1|positioning v1|course selector v1|heavy 1200 course v1|Race Entry v1"
          elif [[ "$BRANCH" == feat/2p5d-p-mf12-flow-transfer-* ]]; then
            echo "P mf12 motion-transfer candidate generation branch; production runtime unchanged"
          elif [[ "$BRANCH" == feat/2p5d-survivor-fair-start-* ]]; then
            npx playwright test tests/2p5d-selection.spec.js tests/race-quality.spec.js \
              --grep "four morph race uses all six-frame|battle readability|traffic sees nearby rivals|lane decision chooses real clearance|default start is logically level" \
              --workers=1
          elif [[ "$BRANCH" == feat/2p5d-survivor-pack-readability-* ]]; then
            npx playwright test tests/race-quality.spec.js \
              --grep "four morph race uses all six-frame|battle readability|dense-pack labels avoid overlap" \
              --workers=1
          elif [[ "$BRANCH" == feat/2p5d-survivor-pea-motion-v2-* ]]; then
            npx playwright test tests/race-quality.spec.js \
              --grep "four morph race uses all six-frame|P E A grounded-stride v2" \
              --workers=1
          elif [[ "$BRANCH" == feat/2p5d-survivor-pea-motion-review-* ]]; then
            npx playwright test tests/race-quality.spec.js \
              --grep "P E A grounded-stride v2" \
              --workers=1
          elif [[ "$BRANCH" == "feat/2p5d-four-morph-quality-integration-20260925" || "$BRANCH" == feat/2p5d-survivor-* ]]; then
            npx playwright test tests/race-quality.spec.js tests/2p5d-selection.spec.js --workers=1
          else
            npm run test:e2e
          fi
      - name: Upload 2.5D survivor visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2p5d-survivor-visuals
          path: artifacts/2p5d-survivor/*.png
          if-no-files-found: warn
      - name: Capture Motion First visuals
        if: ${{ github.head_ref != 'feat/2p5d-four-morph-quality-integration-20260925' && github.ref_name != 'feat/2p5d-four-morph-quality-integration-20260925' && !startsWith(github.head_ref, 'feat/2p5d-survivor-') && !startsWith(github.ref_name, 'feat/2p5d-survivor-') && !startsWith(github.head_ref, 'feat/2p5d-p-mf12-flow-transfer-') && !startsWith(github.ref_name, 'feat/2p5d-p-mf12-flow-transfer-') }}
        env:
          MOTION_FIRST_CAPTURE: "1"
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$BRANCH" == feat/simplified-race-entry-stamina-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry Selection Support v1|individual stamina v1"
          elif [[ "$BRANCH" == feat/simplified-race-entry-pace-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry Selection Support v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-selection-support-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Agent Selection Support v1"
          elif [[ "$BRANCH" == feat/simplified-race-entry-support-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry Selection Support v1"
          elif [[ "$BRANCH" == feat/simplified-race-entry-focus-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry pre-race focus v2"
          elif [[ "$BRANCH" == feat/simplified-race-agent-creature-compat-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Agent-Creature Compatibility v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-ownership-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Agent Ownership Transfer v1"
          elif [[ "$BRANCH" == feat/simplified-race-full-director-review-v* ]]; then
            MOTION_FIRST_FULL_RACE_REVIEW=1 \
              npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Phase F full-race AUTO director review"
          elif [[ "$BRANCH" == feat/simplified-race-gameplay-integration-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "gameplay integration v1"
          elif [[ "$BRANCH" == feat/simplified-race-course-balance-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "balanced 1600 course v1"
          elif [[ "$BRANCH" == feat/simplified-race-course-profiles-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "course profiles v1"
          elif [[ "$BRANCH" == feat/simplified-race-course-ui-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "course selector v1"
          elif [[ "$BRANCH" == feat/simplified-race-heavy-course-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "heavy 1200 course v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-version-active-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Agent Version Evaluation v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-version-eval-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Agent Version Evaluation v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-version-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Agent Version Evolution v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-history-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Agent entity history v1"
          elif [[ "$BRANCH" == feat/simplified-race-agent-auto-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Agent Auto Strategy v1"
          elif [[ "$BRANCH" == feat/simplified-race-entry-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Race Entry v1"
          elif [[ "$BRANCH" == feat/simplified-race-lod-v* || "$BRANCH" == feat/simplified-race-director-v* || "$BRANCH" == feat/simplified-race-speed-v* || "$BRANCH" == feat/simplified-race-side-readability-v* || "$BRANCH" == feat/simplified-race-motion-readability-v* || "$BRANCH" == feat/simplified-race-accel-director-v* || "$BRANCH" == feat/simplified-race-overtake-director-v* || "$BRANCH" == feat/simplified-race-finish-review-v* || "$BRANCH" == feat/simplified-race-environment-v* || "$BRANCH" == feat/simplified-race-results-v* || "$BRANCH" == feat/simplified-race-start-v* || "$BRANCH" == feat/simplified-race-agent-v* || "$BRANCH" == feat/simplified-race-creature-state-v* || "$BRANCH" == feat/simplified-race-agent-feedback-v* || "$BRANCH" == feat/simplified-race-visual-swap-v* || "$BRANCH" == feat/simplified-race-agent-balance-v* || "$BRANCH" == feat/simplified-race-positioning-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Phase E simplified race|Phase F AUTO director|Race Agent v1|Creature State v1|Agent feedback v1|Visual Swap Gate v1|Agent strategy balance v1|positioning v1"
          else
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1
          fi
      - name: Upload Motion First race visuals
        if: ${{ always() && github.head_ref != 'feat/2p5d-four-morph-quality-integration-20260925' && github.ref_name != 'feat/2p5d-four-morph-quality-integration-20260925' && !startsWith(github.head_ref, 'feat/2p5d-survivor-') && !startsWith(github.ref_name, 'feat/2p5d-survivor-') }}
        uses: actions/upload-artifact@v4
        with:
          name: motion-first-race-visuals
          path: test-results/visuals/*
          if-no-files-found: warn

      - name: Capture Sakura NPR camera visuals
        if: ${{ github.head_ref != 'feat/2p5d-four-morph-quality-integration-20260925' && github.ref_name != 'feat/2p5d-four-morph-quality-integration-20260925' && !startsWith(github.head_ref, 'feat/2p5d-survivor-') && !startsWith(github.ref_name, 'feat/2p5d-survivor-') && !startsWith(github.head_ref, 'feat/2p5d-p-mf12-flow-transfer-') && !startsWith(github.ref_name, 'feat/2p5d-p-mf12-flow-transfer-') }}
        env:
          SAKURA_NPR_CAPTURE: "1"
        run: npx playwright test tests/sakura-npr.spec.js --project=desktop-chromium --workers=1
      - name: Upload mobile visual screenshots
        if: ${{ always() && github.head_ref != 'feat/2p5d-four-morph-quality-integration-20260925' && github.ref_name != 'feat/2p5d-four-morph-quality-integration-20260925' && !startsWith(github.head_ref, 'feat/2p5d-survivor-') && !startsWith(github.ref_name, 'feat/2p5d-survivor-') }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-race-visuals
          path: test-results/visuals/*
          if-no-files-found: warn

      - name: Upload S sprite-gen PoC artifacts
        if: ${{ always() && github.head_ref != 'feat/2p5d-four-morph-quality-integration-20260925' && github.ref_name != 'feat/2p5d-four-morph-quality-integration-20260925' && !startsWith(github.head_ref, 'feat/2p5d-survivor-') && !startsWith(github.ref_name, 'feat/2p5d-survivor-') && !startsWith(github.head_ref, 'feat/simplified-race-entry-v') && !startsWith(github.ref_name, 'feat/simplified-race-entry-v') && !startsWith(github.head_ref, 'feat/simplified-race-agent-auto-v') && !startsWith(github.ref_name, 'feat/simplified-race-agent-auto-v') && !startsWith(github.head_ref, 'feat/simplified-race-agent-history-v') && !startsWith(github.ref_name, 'feat/simplified-race-agent-history-v') && !startsWith(github.head_ref, 'feat/simplified-race-agent-ownership-v') && !startsWith(github.ref_name, 'feat/simplified-race-agent-ownership-v') && !startsWith(github.head_ref, 'feat/simplified-race-agent-creature-compat-v') && !startsWith(github.ref_name, 'feat/simplified-race-agent-creature-compat-v') && !startsWith(github.head_ref, 'feat/simplified-race-entry-focus-v') && !startsWith(github.ref_name, 'feat/simplified-race-entry-focus-v') && !startsWith(github.head_ref, 'feat/simplified-race-entry-support-v') && !startsWith(github.ref_name, 'feat/simplified-race-entry-support-v') && !startsWith(github.head_ref, 'feat/simplified-race-agent-selection-support-v') && !startsWith(github.ref_name, 'feat/simplified-race-agent-selection-support-v') && !startsWith(github.head_ref, 'feat/simplified-race-entry-pace-v') && !startsWith(github.ref_name, 'feat/simplified-race-entry-pace-v') && !startsWith(github.head_ref, 'feat/simplified-race-entry-stamina-v') && !startsWith(github.ref_name, 'feat/simplified-race-entry-stamina-v') && !startsWith(github.head_ref, 'feat/simplified-race-agent-version-v') && !startsWith(github.ref_name, 'feat/simplified-race-agent-version-v') && !startsWith(github.head_ref, 'feat/simplified-race-agent-version-eval-v') && !startsWith(github.ref_name, 'feat/simplified-race-agent-version-eval-v') && !startsWith(github.head_ref, 'feat/simplified-race-agent-version-active-v') && !startsWith(github.ref_name, 'feat/simplified-race-agent-version-active-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: spritegen-s-poc
          path: artifacts/spritegen-s/*
          if-no-files-found: error
