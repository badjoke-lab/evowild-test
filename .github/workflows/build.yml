name: build

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify 2.5D page is in production build
        run: test -f dist/race-2_5d.html && test -f dist/race-2_5d-lane4.html && test -f dist/lane4/old-school-racing.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload mobile visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-race-visuals
          path: test-results/visuals/*.png
          if-no-files-found: warn
