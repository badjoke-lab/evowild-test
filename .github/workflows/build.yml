name: build

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        if: startsWith(github.ref_name, 'feat/sf3d-game-integration-')
        with:
          python-version: '3.11'
      - name: Prepare Stable Fast 3D prototype asset
        if: startsWith(github.ref_name, 'feat/sf3d-game-integration-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q numpy trimesh pillow
          mkdir -p /tmp/sf3d
          gh api repos/${{ github.repository }}/actions/artifacts/10644576625/zip > /tmp/sf3d.zip
          unzip -q /tmp/sf3d.zip -d /tmp/sf3d
          python scripts/prepare-sf3d-asset.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit prepared SF3D asset
        if: startsWith(github.ref_name, 'feat/sf3d-game-integration-') && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/evowild-s-sf3d-clean.glb public/models/evowild-s-sf3d-clean.json
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "test: add cleaned Stable Fast 3D game candidate"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload mobile visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-race-visuals
          path: test-results/visuals/*.png
          if-no-files-found: warn
