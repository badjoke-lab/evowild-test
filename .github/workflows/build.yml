name: build

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify 2.5D pages are in production build
        run: test -f dist/race-2_5d.html && test -f dist/race-quality.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload 2.5D survivor visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2p5d-survivor-visuals
          path: artifacts/2p5d-survivor/*.png
          if-no-files-found: warn
      - name: Capture Motion First visuals
        env:
          MOTION_FIRST_CAPTURE: "1"
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$BRANCH" == feat/simplified-race-full-director-review-v* ]]; then
            MOTION_FIRST_FULL_RACE_REVIEW=1 \
              npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Phase F full-race AUTO director review"
          elif [[ "$BRANCH" == feat/simplified-race-lod-v* || "$BRANCH" == feat/simplified-race-director-v* || "$BRANCH" == feat/simplified-race-speed-v* || "$BRANCH" == feat/simplified-race-side-readability-v* || "$BRANCH" == feat/simplified-race-motion-readability-v* || "$BRANCH" == feat/simplified-race-accel-director-v* || "$BRANCH" == feat/simplified-race-overtake-director-v* || "$BRANCH" == feat/simplified-race-finish-review-v* || "$BRANCH" == feat/simplified-race-environment-v* || "$BRANCH" == feat/simplified-race-results-v* || "$BRANCH" == feat/simplified-race-start-v* || "$BRANCH" == feat/simplified-race-agent-v* || "$BRANCH" == feat/simplified-race-creature-state-v* ]]; then
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1 \
              --grep "Phase E simplified race|Phase F AUTO director|Race Agent v1|Creature State v1"
          else
            npx playwright test tests/motion-first.spec.js --project=desktop-chromium --workers=1
          fi
      - name: Upload Motion First race visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-first-race-visuals
          path: test-results/visuals/*
          if-no-files-found: warn

      - name: Capture Sakura NPR camera visuals
        env:
          SAKURA_NPR_CAPTURE: "1"
        run: npx playwright test tests/sakura-npr.spec.js --project=desktop-chromium --workers=1
      - name: Upload mobile visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-race-visuals
          path: test-results/visuals/*
          if-no-files-found: warn

      - name: Upload S sprite-gen PoC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spritegen-s-poc
          path: artifacts/spritegen-s/*
          if-no-files-found: error
