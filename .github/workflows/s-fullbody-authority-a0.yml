name: EvoWild S A0 fullbody morphology build
on:
  push:
    branches:
      - exp/s-fullbody-authority-a0-20261009
    paths:
      - ".github/workflows/s-fullbody-authority-a0.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  a0-fullbody:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/build_fullbody_authority_a0.py
            /art/s-creature/experiments/authority-rebuild-20261009/reference-authority-preview.jpg
            /art/s-creature/experiments/fullbody-authority-a0/
            /.github/workflows/s-fullbody-authority-a0.yml
      - name: Install Blender OS dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Install Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Construct actual from-scratch full-body and render 5 views
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python art/s-creature/blender/build_fullbody_authority_a0.py
      - name: Make five-view proof sheet with reference preserved
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          root=Path('art/s-creature/experiments')
          output=root/'fullbody-authority-a0/review'
          views=['side','front','front34','rear34','back']
          w,h=370,390
          contact=Image.new('RGB',(w*5,h),(246,247,248))
          d=ImageDraw.Draw(contact)
          for i,view in enumerate(views):
            p=output/f'S_fullbody_A0_{view}.png'
            assert p.is_file() and p.stat().st_size>20000,(p,'missing real render')
            im=Image.open(p).convert('RGB')
            im.thumbnail((w-14,h-40))
            contact.paste(im,(i*w+(w-im.width)//2,28+(h-32-im.height)//2))
            d.text((i*w+10,10),f'A0 {view.upper()}',fill=(10,11,13))
          name=output/'S_A0_real_five_view_contact.jpg'
          contact.save(name,quality=90)
          src=root/'authority-rebuild-20261009/reference-authority-preview.jpg'
          assert src.is_file(), 'No authoritative artwork preview to compare'
          ref=Image.open(src).convert('RGB')
          ref.thumbnail((900,720))
          panel=Image.new('RGB',(max(900,w*5),720+h),(242,243,244))
          panel.paste(ref,((panel.width-ref.width)//2,0))
          panel.paste(contact,(0,720))
          dst=output/'S_A0_authority_reference_and_real_views.jpg'
          panel.save(dst,quality=88)
          print('VERIFIED',name,dst)
          PY
      - name: Upload actual BLEND GLB and visual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvoWild-S-A0-actual-fullbody
          path: art/s-creature/experiments/fullbody-authority-a0/
          if-no-files-found: warn
      - name: Commit actual artifacts to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/s-creature/experiments/fullbody-authority-a0
          git commit -m 'exp: persist actual full-body S A0 mesh and five-view evidence'
          git pull --rebase origin exp/s-fullbody-authority-a0-20261009
          git push origin HEAD:exp/s-fullbody-authority-a0-20261009
