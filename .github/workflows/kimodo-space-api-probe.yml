name: Kimodo Official Space API Probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/kimodo-ardy-motion-feasibility-20261004
    paths:
      - ".github/workflows/kimodo-space-api-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/kimodo-ardy-motion-feasibility-20261004

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gradio client
        run: python -m pip install --disable-pip-version-check "gradio_client>=1.3,<2"

      - name: Probe public API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/kimodo-ardy/space-probe
          python - <<'PY'
          import contextlib
          import io
          import json
          import traceback
          from pathlib import Path

          from gradio_client import Client

          out = Path("experiments/kimodo-ardy/space-probe/api.json")
          payload = {
              "space": "nvidia/Kimodo",
              "status": "unknown",
          }
          try:
              client = Client("nvidia/Kimodo", verbose=False)
              try:
                  api = client.view_api(print_info=False, return_format="dict")
              except TypeError:
                  buf = io.StringIO()
                  with contextlib.redirect_stdout(buf):
                      api = client.view_api()
                  api = {"printed": buf.getvalue()}
              payload["status"] = "connected"
              payload["api"] = api
          except Exception as exc:
              payload["status"] = "error"
              payload["error_type"] = type(exc).__name__
              payload["error"] = str(exc)
              payload["traceback"] = traceback.format_exc(limit=6)

          out.write_text(json.dumps(payload, indent=2, default=str) + "\n", encoding="utf-8")
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/kimodo-ardy/space-probe/api.json
          if git diff --cached --quiet; then
            echo "No probe changes."
            exit 0
          fi
          git commit -m "Record official Kimodo Space API probe"
          git push origin HEAD:exp/kimodo-ardy-motion-feasibility-20261004
