name: S Authority TRELLIS v1 (one real 3D candidate)
on:
  push:
    branches:
      - exp/s-authority-shape-20261009
    paths:
      - ".github/workflows/s-authority-trellis-v1.yml"
      - "scripts/s_authority_trellis_single_v1.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  one-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public TRELLIS client and image tools
        run: python -m pip install --quiet --upgrade gradio_client Pillow
      - name: Run exact-authority crop and one public 3D generation attempt
        id: generate
        continue-on-error: true
        run: python scripts/s_authority_trellis_single_v1.py
      - name: Check model generated
        id: model
        run: |
          p=art/s-creature/experiments/authority-rebuild-20261009/S-authority-trellis-v1.glb
          if [ -s "$p" ]; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install Blender system dependencies
        if: steps.model.outputs.exists == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender 4.3.2
        if: steps.model.outputs.exists == 'true'
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Render actual S 3D model in five directions
        if: steps.model.outputs.exists == 'true'
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_authority_trellis_v1.py
      - name: Make 5-view actual render sheet
        if: steps.model.outputs.exists == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          d=Path('art/s-creature/experiments/authority-rebuild-20261009/review')
          names=['side','front','front34','rear34','back']
          out=Image.new('RGB',(1600,350),(248,248,248))
          dr=ImageDraw.Draw(out)
          for i,n in enumerate(names):
            p=d/f'authority_trellis_v1_{n}.png'
            im=Image.open(p).convert('RGB')
            im.thumbnail((310,310))
            out.paste(im,(i*320+(320-im.width)//2,32+(310-im.height)//2))
            dr.text((i*320+8,9),n.upper(),fill=(0,0,0))
          dst=d/'authority_trellis_v1_five_view_contact.jpg'
          out.save(dst,quality=91)
          print(dst,dst.stat().st_size)
          PY
      - name: Upload evidence (including failure reason)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-authority-trellis-v1
          path: |
            art/s-creature/experiments/authority-rebuild-20261009/authority-front34-clean-v1.png
            art/s-creature/experiments/authority-rebuild-20261009/T1_AUTHORITY_GENERATION.json
            art/s-creature/experiments/authority-rebuild-20261009/S-authority-trellis-v1.glb
            art/s-creature/experiments/authority-rebuild-20261009/review/
          if-no-files-found: warn
      - name: Persist model and review evidence in experiment branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/s-creature/experiments/authority-rebuild-20261009/authority-front34-clean-v1.png || true
          git add art/s-creature/experiments/authority-rebuild-20261009/T1_AUTHORITY_GENERATION.json || true
          git add art/s-creature/experiments/authority-rebuild-20261009/S-authority-trellis-v1.glb || true
          git add art/s-creature/experiments/authority-rebuild-20261009/review || true
          if ! git diff --cached --quiet; then
            git commit -m 'exp: persist authority-derived S 3D candidate and five views'
            git pull --rebase origin exp/s-authority-shape-20261009
            git push origin HEAD:exp/s-authority-shape-20261009
          fi
      - name: Declare failure if no 3D result
        if: steps.model.outputs.exists != 'true'
        run: |
          echo 'No S 3D model was produced. See T1_AUTHORITY_GENERATION.json.'
          exit 1
