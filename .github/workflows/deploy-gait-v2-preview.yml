name: deploy-gait-v2-preview

on:
  push:
    branches:
      - feat/hunyuan-gait-v2-20260925

permissions:
  contents: write

jobs:
  publish:
    if: ${{ contains(github.event.head_commit.message, '[deploy-gait-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build isolated gait-v2 preview
        env:
          EVOWILD_BASE: /evowild-test/preview-3d-gait-v2/
        run: |
          npm run build
          find dist/models -maxdepth 1 -type f             ! -name 'evowild-s-hunyuan2mv-lod2.glb'             ! -name 'evowild-s-hunyuan2mv-lod3.glb'             ! -name 'evowild-s-hunyuan2mv-lod4.glb'             ! -name 'evowild-s-hunyuan2mv-rigged.glb'             ! -name 'evowild-s-hunyuan2mv-lod4-rigged.glb'             ! -name 'evowild-s-hunyuan2mv-rigged-v2.glb'             ! -name 'evowild-s-hunyuan2mv-lod4-rigged-v2.glb'             ! -name 'evowild-s-hunyuan2mv-rigged-v21.glb'             ! -name 'evowild-s-hunyuan2mv-lod4-rigged-v21.glb'             ! -name 'evowild-s.obj'             ! -name 'evowild-s.mtl'             -delete
          test -f dist/index.html
          test -f dist/models/evowild-s-hunyuan2mv-lod2.glb
          test -f dist/models/evowild-s-hunyuan2mv-lod4.glb
          test -f dist/models/evowild-s-hunyuan2mv-rigged-v2.glb
          test -f dist/models/evowild-s-hunyuan2mv-lod4-rigged-v2.glb
          test -f dist/models/evowild-s-hunyuan2mv-rigged-v21.glb
          test -f dist/models/evowild-s-hunyuan2mv-lod4-rigged-v21.glb
          du -sh dist
          mkdir -p /tmp/evowild-preview-gait-v2
          cp -a dist/. /tmp/evowild-preview-gait-v2/
      - name: Publish gait-v2 subtree to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin main
          git checkout main
          git pull --rebase origin main
          rm -rf public/preview-3d-gait-v2
          mkdir -p public/preview-3d-gait-v2
          cp -a /tmp/evowild-preview-gait-v2/. public/preview-3d-gait-v2/
          git add public/preview-3d-gait-v2
          if git diff --cached --quiet; then
            echo "No gait-v2 preview changes"
          else
            git commit -m "preview: update isolated Hunyuan gait v2 proof"
            git pull --rebase origin main
            git push origin main
          fi
