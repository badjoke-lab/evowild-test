name: EvoWild S V5 MCP preview and rollback offline smoke test
on:
  push:
    branches: [exp/s-hunyuan-shoulder-sculpt-20261013]
    paths:
      - .github/workflows/s-hunyuan-v5-preview-revert-smoke.yml
      - art/s-creature/blender/s_hunyuan_v5_mcp_preview_recovery.py
      - art/s-creature/blender/s_hunyuan_v5_mcp_revert_preview.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-preview-and-full-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/s-hunyuan-v5-preview-revert-smoke.yml
            /art/s-creature/blender/s_hunyuan_v5_mcp_preview_recovery.py
            /art/s-creature/blender/s_hunyuan_v5_mcp_revert_preview.py
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v4/S_HUNYUAN_SHOULDER_CHEST_SCULPT_V4.blend
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5-proposals/V5_RECOVERY_GEOMETRIC_PROPOSAL.npz
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5-proposals/V5_LOCAL_RECOVERY_CANDIDATE_SEARCH.json
      - name: Install Blender 4.3.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -fL --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender-v5-smoke.tar.xz
          tar -xf /tmp/blender-v5-smoke.tar.xz -C /tmp
      - name: Execute actual BMesh V5 candidate preview, rollback, verify original hash
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/evowild-v5-preview-smoke.py <<'PY'
          import bpy, numpy as np, runpy, hashlib
          from pathlib import Path
          ROOT=Path.cwd()
          base=ROOT/'art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012'
          v4=base/'review-v4/S_HUNYUAN_SHOULDER_CHEST_SCULPT_V4.blend'
          dst=base/'review-v5/S_HUNYUAN_SHOULDER_CHEST_SCULPT_V5_WORKING.blend'
          dst.parent.mkdir(exist_ok=True)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          v4sha=sha(v4)
          bpy.ops.wm.open_mainfile(filepath=str(v4))
          bpy.context.preferences.filepaths.save_version=0
          bpy.ops.wm.save_as_mainfile(filepath=str(dst),compress=True)
          body=next(o for o in bpy.context.scene.objects if o.type=='MESH' and o.data.name=='geometry_0')
          before=np.array([v.co[:] for v in body.data.vertices],dtype=np.float32)
          runpy.run_path(str(ROOT/'art/s-creature/blender/s_hunyuan_v5_mcp_preview_recovery.py'))
          after=np.array([v.co[:] for v in body.data.vertices],dtype=np.float32)
          assert int(np.count_nonzero(np.any(before!=after,axis=1)))==807
          assert (dst.parent/'V5_RECOVERY_PREVIEW_BEFORE.npy').is_file()
          print('SMOKE_ACTUAL_807_VERTEX_PREVIEW_PASS',flush=True)
          runpy.run_path(str(ROOT/'art/s-creature/blender/s_hunyuan_v5_mcp_revert_preview.py'))
          reverted=np.array([v.co[:] for v in body.data.vertices],dtype=np.float32)
          assert np.array_equal(reverted,before)
          assert sha(v4)==v4sha
          assert not (dst.parent/'V5_RECOVERY_PREVIEW_BEFORE.npy').exists()
          print('SMOKE_EXACT_ROLLBACK_AND_PROTECTED_V4_HASH_PASS',flush=True)
          PY
          /tmp/blender-4.3.2-linux-x64/blender -b --factory-startup --threads 4 --python-exit-code 1 --python /tmp/evowild-v5-preview-smoke.py 2>&1 | tee /tmp/evowild-v5-smoke.log
          grep -q SMOKE_ACTUAL_807_VERTEX_PREVIEW_PASS /tmp/evowild-v5-smoke.log
          grep -q SMOKE_EXACT_ROLLBACK_AND_PROTECTED_V4_HASH_PASS /tmp/evowild-v5-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evowild-v5-preview-revert-smoke-log
          path: /tmp/evowild-v5-smoke.log
          retention-days: 14
          if-no-files-found: warn
