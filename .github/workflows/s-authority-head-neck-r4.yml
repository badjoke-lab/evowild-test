name: EvoWild S head-neck integrated R4 real model
on:
  push:
    branches:
      - exp/s-authority-shape-20261009
    paths:
      - ".github/workflows/s-authority-head-neck-r4.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  r4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Build integrated skull-neck and crests with real five-view render
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python art/s-creature/blender/rebuild_s_authority_head_neck_r4.py
      - name: Generate actual Blender R3 vs R4 image comparison
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          base=Path('art/s-creature/experiments/authority-rebuild-20261009')
          outdir=base/'r4-head-neck/review'
          sheet=Image.new('RGB',(2000,960),(244,245,246))
          d=ImageDraw.Draw(sheet)
          views=('side','front','front34','rear34','back')
          for ri,(label,sub,prefix) in enumerate([
              ('BEFORE R3',base/'r3-crest/review','S_authority_crest_r3_'),
              ('AFTER R4',outdir,'S_head_neck_r4_')]):
            for ci,v in enumerate(views):
              src=sub/(prefix+v+'.png')
              assert src.exists() and src.stat().st_size>5000,str(src)
              im=Image.open(src).convert('RGB')
              im.thumbnail((390,435))
              x=ci*400+(400-im.width)//2
              y=ri*480+31+(440-im.height)//2
              sheet.paste(im,(x,y))
              d.text((ci*400+12,ri*480+10),label+' / '+v.upper(),fill=(10,10,12))
          dst=outdir/'R3_vs_R4_real_five_view.jpg'
          sheet.save(dst,quality=91,optimize=True)
          print('VERIFY',dst,dst.stat().st_size)
          PY
      - name: Upload all model and review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-S-head-neck-R4-real-model
          path: art/s-creature/experiments/authority-rebuild-20261009/r4-head-neck/
          if-no-files-found: warn
      - name: Commit isolated R4 experiment evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/s-creature/experiments/authority-rebuild-20261009/r4-head-neck
          git commit -m "exp: persist real S R4 skull neck crest and five views"
          git pull --rebase origin exp/s-authority-shape-20261009
          git push origin HEAD:exp/s-authority-shape-20261009
