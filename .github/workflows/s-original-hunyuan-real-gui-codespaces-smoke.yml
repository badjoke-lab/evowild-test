name: EvoWild S genuine Blender GUI Codespaces smoke (Xvfb + noVNC)
on:
  push:
    branches: [exp/s-hunyuan-shoulder-sculpt-20261013]
    paths:
      - .github/workflows/s-original-hunyuan-real-gui-codespaces-smoke.yml
      - .devcontainer/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-gui-on-ubuntu-not-crypto-VM:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.devcontainer/
            /.github/workflows/s-original-hunyuan-real-gui-codespaces-smoke.yml
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/S_ORIGINAL_HUNYUAN_ART_SCULPT_STATION__UNEDITED_BASE.blend
      - name: Install same GUI stack as the intended web-desktop Codespace
        run: bash .devcontainer/setup-blender-webdesktop.sh
      - name: Start actual interactive Blender GUI, not background Blender or fake image
        run: bash .devcontainer/start-blender-webdesktop.sh
      - name: Check GUI visible, noVNC HTTP, VNC localhost, and source unchanged
        run: |
          set -euo pipefail
          export DISPLAY=:99
          xdotool search --onlyvisible --class Blender
          curl --fail --silent --show-error http://127.0.0.1:6080/vnc.html -o /tmp/evowild-s-gui/noVNC.html
          test -s /tmp/evowild-s-gui/noVNC.html
          test -n "$(pgrep -x blender)"
          echo '93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png' | sha256sum --check -
          scrot /tmp/evowild-s-gui/S_REAL_BLENDER_GUI_SCREENSHOT.png
          file /tmp/evowild-s-gui/S_REAL_BLENDER_GUI_SCREENSHOT.png
          test "$(stat -c%s /tmp/evowild-s-gui/S_REAL_BLENDER_GUI_SCREENSHOT.png)" -gt 20000
          printf 'RESULT: real Xvfb/Blender 4.3 GUI and localhost web desktop launched; no creature sculpt attempted.\n' |
            tee /tmp/evowild-s-gui/GUI_SMOKE_PASS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evowild-s-real-GUI-smoke-proof-only-no-sculpt
          path: /tmp/evowild-s-gui/
          if-no-files-found: warn
