name: S rig source v1
on:
  push:
    branches: [feat/s-creature-model]
    paths: [.github/workflows/s-creature-rig-v1.yml]
permissions: {contents: write}
jobs:
  rig-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/s-creature-model, fetch-depth: 0}
      - run: command -v xvfb-run
      - run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - run: /tmp/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python art/s-creature/blender/build_s_rig_v1.py
      - env: {LIBGL_ALWAYS_SOFTWARE: "1"}
        run: xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-rig-v1.blend --python-exit-code 1 --python art/s-creature/blender/render_s_rig_v1.py
      - run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('art/s-creature'); r=json.loads((root/'output/S-rig-v1.json').read_text())
          assert r['status']=='REVIEW_PENDING' and r['bone_count']>=20
          assert len(r['skinned_meshes'])==5 and len(r['toe_parent_map'])==12
          assert r['base_coordinates_unchanged'] and r['base_topology_unchanged'] and r['materials_unchanged']
          assert r['rendered_views']==['SIDE','FRONT','FRONT34','REAR34','BACK']
          for x in ('side','front','front34','rear34','back'): assert (root/f'output/review/rig-v1/S_rig_{x}.png').stat().st_size>0
          p=root/'CHECKPOINT.md'; s=p.read_text()
          s=re.sub(r'^current_stage:.*$','current_stage: S rig v1 shared-armature source saved and rest-pose views rendered; REVIEW_PENDING / STOPPED',s,count=1,flags=re.M)
          s=re.sub(r'^current_model_file:.*$','current_model_file: output/S-rig-v1.blend',s,count=1,flags=re.M)
          s=re.sub(r'^next_action:.*$','next_action: Review S rig v1 rest pose and validation, then run a controlled deformation pose test. No animation production yet.',s,count=1,flags=re.M)
          s=re.sub(r'^modeling_status:.*$','modeling_status: STOPPED_FOR_RIG_REVIEW',s,count=1,flags=re.M)
          s+='\n\nrig_v1_done: Shared 20-bone armature added to derived rig source; core+four limbs weighted, crest/toes/eyes/Cue Band rigid-parented; five rest-pose views rendered.\nrig_v1_acceptance: REVIEW_PENDING\n'
          p.write_text(s)
          hp=root/'HANDOFF_STATE.json'; h=json.loads(hp.read_text())
          h.update({'stage':'S-rig-v1-review','current_stage':'S rig v1 shared-armature source saved and rest-pose views rendered; REVIEW_PENDING / STOPPED','current_model_file':'output/S-rig-v1.blend','source_model_file':'output/S-gateC-v9.blend','next_action':'Review S rig v1 rest pose and validation, then run a controlled deformation pose test.','modeling_status':'STOPPED_FOR_RIG_REVIEW','rig_status':'REVIEW_PENDING','rig_report':'output/S-rig-v1.json','review_renders':[f'output/review/rig-v1/S_rig_{x}.png' for x in ('side','front','front34','rear34','back')]})
          hp.write_text(json.dumps(h,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-rig-v1
          path: |
            art/s-creature/output/S-rig-v1.blend
            art/s-creature/output/S-rig-v1.json
            art/s-creature/output/review/rig-v1/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-rig-v1.blend art/s-creature/output/S-rig-v1.json art/s-creature/output/review/rig-v1/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save S rig v1 shared armature and stop for review'
          git push origin HEAD:feat/s-creature-model
