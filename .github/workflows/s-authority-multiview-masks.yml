name: EvoWild S authority multi-view masks QA
on:
  push:
    branches:
      - exp/s-authority-visualhull-20261009
    paths:
      - .github/workflows/s-authority-multiview-masks.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  masks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/s_authority_multiview_masks.py
            /art/s-creature/experiments/authority-visualhull/
            /.github/workflows/s-authority-multiview-masks.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible segmentation tools
        run: python -m pip install -q "opencv-python-headless==4.10.0.84" "numpy<2" pillow
      - name: Verify canonical authority and segment all four documented panels
        run: python scripts/s_authority_multiview_masks.py
      - name: Upload actual reference-locked segmentation and visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-S-authority-four-view-QA
          path: art/s-creature/experiments/authority-visualhull/
      - name: Commit all masks and human-auditable QA to separate lane
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/s-creature/experiments/authority-visualhull/
          git commit -m "exp: save reproducible approved-art S masks and QA contact sheet"
          git pull --rebase origin exp/s-authority-visualhull-20261009
          git push origin HEAD:exp/s-authority-visualhull-20261009
