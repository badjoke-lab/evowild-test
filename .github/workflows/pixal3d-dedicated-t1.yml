name: Pixal3D dedicated T1 clean-input

on:
  push:
    branches:
      - exp/trellis2-pixal3d-s-bench-20261004
    paths:
      - ".github/workflows/pixal3d-dedicated-t1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clients
        run: python -m pip install --upgrade gradio_client pillow

      - name: Prepare clean S input
        run: python scripts/prepare_trellis2_pixal3d_inputs.py

      - name: Generate on official Pixal3D dedicated instance
        run: >-
          python scripts/pixal3d_dedicated_generate.py
          --seed 0
          --resolution 1024
          --input art/s-creature/experiments/trellis2-pixal3d/prepared/primary_clean_v1.png

      - name: Upload candidate or failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-pixal3d-dedicated-seed-0000
          path: art/s-creature/experiments/trellis2-pixal3d/raw/pixal3d-dedicated/seed-0000/
          if-no-files-found: error
