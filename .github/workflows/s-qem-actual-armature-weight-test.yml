name: EvoWild S real QEM Blender armature + 16-frame test
on:
  push:
    branches: [exp/s-qem-deformation-gate-20261010]
    paths: [.github/workflows/s-qem-actual-armature-weight-test.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  skin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_armature_animation_test.py
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/experiments/qem-deformation-gate-20261010/S-QEM-pre-rig-source-review.blend
            /art/s-creature/experiments/qem-deformation-gate-20261010/bend-probe-v2/BEND_PROBE_QA.json
            /art/s-creature/experiments/qem-deformation-gate-20261010/armature-test-v1/
            /.github/workflows/s-qem-actual-armature-weight-test.yml
      - name: Install Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Actual Blender skeletal skinning and 16-frame four-leg pose
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/experiments/qem-deformation-gate-20261010/S-QEM-pre-rig-source-review.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_armature_animation_test.py
      - name: Generate actual five-angle proof and animation-keyframe strip
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json
          p=Path("art/s-creature/experiments/qem-deformation-gate-20261010/armature-test-v1")
          r=p/"review"
          o=json.loads((p/"ARMATURE_TEST_QA.json").read_text())
          assert o["source_sha256"]=="e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f"
          assert o["source_GLb_unchanged"] and o["real_armature_modifier"] and o["armature_bones"]==5
          assert o["source_vertices"]==o["rigged_mesh_vertices"]==29948
          assert o["rigged_mesh_faces"]==59932
          assert o["animation_keyframes"]==[1,8,16]
          assert not o["full_limbs_rigged"] and not o["game_asset_approved"]
          assert (p/"S-QEM-armature-weighted-16-frame-test.blend").stat().st_size>50000
          views=["side","front","front34","rear34","back"]
          w,h=430,430
          result=Image.new("RGB",(w*5,h*2),(246,246,248))
          draw=ImageDraw.Draw(result)
          for x,v in enumerate(views):
            for y,(label,name) in enumerate([
              ("QEM ORIGINAL",f"QEM_ARMATURE_source_{v}.png"),
              ("FRAME 8 SKINNING",f"QEM_ARMATURE_pose8_{v}.png")
            ]):
              fn=r/name
              assert fn.stat().st_size>10000,fn
              im=Image.open(fn).convert("RGB")
              im.thumbnail((w-16,h-38))
              result.paste(im,(x*w+(w-im.width)//2,y*h+25+(h-30-im.height)//2))
              draw.text((x*w+10,y*h+8),label+" / "+v.upper(),(13,15,17))
          result.save(r/"QEM_actual_armature_before_after_5view.jpg",quality=92,optimize=True)
          keys=(1,5,8,12,16)
          strip=Image.new("RGB",(w*5,h),(246,246,248))
          txt=ImageDraw.Draw(strip)
          for x,frame in enumerate(keys):
              im=Image.open(r/f"QEM_ARMATURE_animated_frame_{frame:02d}.png").convert("RGB")
              im.thumbnail((w-16,h-38))
              strip.paste(im,(x*w+(w-im.width)//2,25+(h-30-im.height)//2))
              txt.text((x*w+10,8),f"REAL BLENDER F{frame:02d}",(13,15,17))
          strip.save(r/"QEM_armature_5_keyframe_sample.jpg",quality=91,optimize=True)
          print("ACTUAL_QEM_ARMATURE_EVIDENCE",o["gate"],o["triangles_flipped"],o["area_less_than_half"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-S-QEM-actual-armature-animation-test
          path: art/s-creature/experiments/qem-deformation-gate-20261010/armature-test-v1/
          if-no-files-found: warn
      - name: Save animation Blend and all physical render evidence to isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/armature-test-v1/
          git commit -m 'exp: QEM first actual Blender five-bone armature keyed leg deformation'
          git pull --rebase origin exp/s-qem-deformation-gate-20261010
          git push origin HEAD:exp/s-qem-deformation-gate-20261010
