name: S creature Vibe lane Gate B1c v1 local resurface
on:
  push:
    branches: [exp/s-creature-vibe-modeling]
    paths:
      - .github/workflows/s-creature-vibe-b1c-v1.yml
      - art/s-creature/blender/refine_s_vibe_b1c_v1.py
      - art/s-creature/blender/render_s_vibe_b1c_v1.py
permissions:
  contents: write
concurrency:
  group: s-creature-vibe-b1c-v1
  cancel-in-progress: false
jobs:
  vibe-b1c-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/s-creature-vibe-modeling
          fetch-depth: 0
      - name: Verify B1c-v1 source
        run: |
          test -f art/s-creature/output/S-vibe-b0-v025.blend
          test "$(git branch --show-current)" = "exp/s-creature-vibe-modeling"
      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Apply local shoulder-root resurface
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-b0-v025.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/refine_s_vibe_b1c_v1.py
      - name: Render five B1c-v1 views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-b1c-v1.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_vibe_b1c_v1.py
      - name: Verify B1c-v1 hard scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-vibe-b1c-v1-validation.json').read_text())
          assert r['gate']=='B1c-v1-local-shoulder-root-resurface'
          assert r['max_local_displacement'] <= 0.004
          assert all(v <= 0.003 for v in r['whole_body_extent_drift'].values())
          assert r['non_manifold_edge_count']==0
          assert r['render_non_manifold_edge_count']==0
          assert r['outside_support_original_geometry_unchanged']
          assert r['preserved_geometry_unchanged']
          assert r['render_fixed_geometry_unchanged']
          assert r['result_vertex_count'] > r['source_vertex_count']
          for stem in ('side','front','front34','rear34','back'):
              assert (root/f'output/review/vibe-b1c-v1/S_vibe_b1c_v1_{stem}.png').stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-vibe-B1c-v1-review
          path: |
            art/s-creature/output/S-vibe-b1c-v1.blend
            art/s-creature/output/S-vibe-b1c-v1-validation.json
            art/s-creature/output/review/vibe-b1c-v1/
          if-no-files-found: error
      - name: Commit B1c-v1 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-vibe-b1c-v1.blend art/s-creature/output/S-vibe-b1c-v1-validation.json art/s-creature/output/review/vibe-b1c-v1/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save Vibe B1c-v1 local shoulder-root review'
          git push origin HEAD:exp/s-creature-vibe-modeling
