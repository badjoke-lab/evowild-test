name: S creature Vibe lane Gate A1 v10 compact crest
on:
  push:
    branches: [exp/s-creature-vibe-modeling]
    paths:
      - .github/workflows/s-creature-vibe-a1-v10.yml
      - art/s-creature/blender/refine_s_vibe_a1_v10.py
      - art/s-creature/blender/render_s_vibe_a1_v10.py
permissions:
  contents: write
concurrency:
  group: s-creature-vibe-a1-v10
  cancel-in-progress: false
jobs:
  vibe-a1-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/s-creature-vibe-modeling
          fetch-depth: 0
      - name: Verify v10 source
        run: |
          test -f art/s-creature/output/S-vibe-a1-v9.blend
          test "$(git branch --show-current)" = "exp/s-creature-vibe-modeling"
      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Build compact crest only
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-a1-v9.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/refine_s_vibe_a1_v10.py
      - name: Render four A1-v10 views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-a1-v10.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_vibe_a1_v10.py
      - name: Verify crest-only hard scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-vibe-a1-v10-validation.json').read_text())
          assert r['gate']=='A1-v10-compact-crisp-reference-crest'
          assert r['all_noncrest_geometry_unchanged']
          assert r['head_neck_shape_unchanged']
          assert r['topology_change_scope']=='crest object only'
          assert r['render_geometry_unchanged']
          for stem in ('side','front','front34','back'):
              assert (root/f'output/review/vibe-a1-v10/S_vibe_a1_v10_{stem}.png').stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-vibe-A1-v10-review
          path: |
            art/s-creature/output/S-vibe-a1-v10.blend
            art/s-creature/output/S-vibe-a1-v10-validation.json
            art/s-creature/output/review/vibe-a1-v10/
          if-no-files-found: error
      - name: Commit A1-v10 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-vibe-a1-v10.blend art/s-creature/output/S-vibe-a1-v10-validation.json art/s-creature/output/review/vibe-a1-v10/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save compact crest Vibe A1-v10 review'
          git push origin HEAD:exp/s-creature-vibe-modeling
