name: Build rigged S headfix

on:
  push:
    branches:
      - fix/sakura-npr-rigged-head-v2-20260927

permissions:
  contents: write

jobs:
  headfix:
    if: contains(github.event.head_commit.message, '[headfix-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Build repaired rigged S candidate
        run: |
          blender --background --python scripts/build-rigged-s-headfix.py -- \
            public/models/evowild-s/focus-rigged-v5.glb \
            public/models/evowild-s/focus-rigged-v5-headfix-v2.glb \
            public/models/evowild-s/focus-rigged-v5-headfix-v2.json
          ls -lh public/models/evowild-s/focus-rigged-v5-headfix.*
          cat public/models/evowild-s/focus-rigged-v5-headfix-v2.json
      - name: Persist candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/evowild-s/focus-rigged-v5-headfix-v2.glb public/models/evowild-s/focus-rigged-v5-headfix-v2.json
          if git diff --cached --quiet; then
            echo "No headfix changes"
          else
            git commit -m "model: persist rigged S headfix candidate [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
