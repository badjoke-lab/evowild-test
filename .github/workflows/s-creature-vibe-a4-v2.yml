name: S creature Vibe lane Gate A4 v2 tail
on:
  push:
    branches: [exp/s-creature-vibe-modeling]
    paths:
      - .github/workflows/s-creature-vibe-a4-v2.yml
      - art/s-creature/blender/refine_s_vibe_a4_v2.py
      - art/s-creature/blender/render_s_vibe_a4_v2.py
permissions:
  contents: write
concurrency:
  group: s-creature-vibe-a4-v2
  cancel-in-progress: false
jobs:
  vibe-a4-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/s-creature-vibe-modeling
          fetch-depth: 0
      - name: Verify A4-v2 source
        run: |
          test -f art/s-creature/output/S-vibe-a4-v1.blend
          test "$(git branch --show-current)" = "exp/s-creature-vibe-modeling"
      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Apply tail stem tip correction only
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-a4-v1.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/refine_s_vibe_a4_v2.py
      - name: Render four A4-v2 views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-a4-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_vibe_a4_v2.py
      - name: Verify A4-v2 hard scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-vibe-a4-v2-validation.json').read_text())
          assert r['gate']=='A4-v2-tail-stem-tip'
          assert r['fixed_geometry_unchanged']
          assert r['other_meshes_unchanged']
          assert r['topology_unchanged']
          assert r['render_geometry_unchanged']
          for stem in ('side','front','front34','back'):
              assert (root/f'output/review/vibe-a4-v2/S_vibe_a4_v2_{stem}.png').stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-vibe-A4-v2-review
          path: |
            art/s-creature/output/S-vibe-a4-v2.blend
            art/s-creature/output/S-vibe-a4-v2-validation.json
            art/s-creature/output/review/vibe-a4-v2/
          if-no-files-found: error
      - name: Commit A4-v2 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-vibe-a4-v2.blend art/s-creature/output/S-vibe-a4-v2-validation.json art/s-creature/output/review/vibe-a4-v2/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save Vibe A4-v2 tail review'
          git push origin HEAD:exp/s-creature-vibe-modeling
