name: Kimodo Acceleration Mechanics A-B

on:
  workflow_dispatch:
  push:
    branches:
      - exp/kimodo-ardy-motion-feasibility-20261004
    paths:
      - "public/preview-motion-first/main.js"
      - "public/preview-motion-first/kimodo-launch-profile.js"
      - "tests/kimodo-accel-mechanics.spec.js"
      - ".github/workflows/kimodo-accel-mechanics-ab.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/kimodo-ardy-motion-feasibility-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node tests/kimodo-ardy/test_kimodo_launch_profile.mjs
      - run: npx playwright install --with-deps chromium
      - name: Capture acceleration mechanics A-B
        env:
          KIMODO_ACCEL_MECHANICS_AB: "1"
        run: npx playwright test tests/kimodo-accel-mechanics.spec.js --project=desktop-chromium
      - name: Commit mechanics A-B evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/kimodo-ardy/accel-mechanics-ab
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Kimodo acceleration mechanics A-B evidence"
          git push origin HEAD:exp/kimodo-ardy-motion-feasibility-20261004
