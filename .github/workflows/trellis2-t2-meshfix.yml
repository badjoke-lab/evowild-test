name: TRELLIS2 T2 MeshFix bench

on:
  push:
    branches:
      - exp/trellis2-pixal3d-s-bench-20261004
    paths:
      - "art/s-creature/experiments/trellis2-pixal3d/TRIGGER_T2_MESHFIX.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mesh repair dependencies
        run: python -m pip install --quiet trimesh numpy scipy networkx pymeshfix

      - name: Run MeshFix repair and drift audit
        run: python scripts/trellis2_t2_meshfix.py

      - name: Commit T2 repair evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-meshfix
          git commit -m "exp: persist TRELLIS2 T2 MeshFix bench"
          git push origin HEAD:exp/trellis2-pixal3d-s-bench-20261004
