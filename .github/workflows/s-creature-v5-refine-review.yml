name: S creature v5 refine and review

on:
  push:
    branches:
      - feat/s-creature-model
    paths:
      - .github/workflows/s-creature-v5-refine-review.yml

permissions:
  contents: write

jobs:
  refine-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/s-creature-model
          fetch-depth: 0

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6

      - name: Download Blender 4.3.2
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.3.2-linux-x64/blender --version

      - name: Apply one v5 lower-neck correction
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euxo pipefail
          /tmp/blender-4.3.2-linux-x64/blender \
            --background \
            art/s-creature/output/S-blockout-v4.blend \
            --python art/s-creature/blender/refine_s_neck_v5.py

      - name: Render v5 four-view review
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euxo pipefail
          /tmp/blender-4.3.2-linux-x64/blender \
            --background \
            art/s-creature/output/S-blockout-v5.blend \
            --python art/s-creature/blender/render_v5_review.py

      - name: Verify outputs
        run: |
          set -euxo pipefail
          test -s art/s-creature/output/S-blockout-v5.blend
          test -s art/s-creature/output/neck-v5-validation.json
          for f in \
            art/s-creature/output/review/v5/S_blockout_front.png \
            art/s-creature/output/review/v5/S_blockout_side.png \
            art/s-creature/output/review/v5/S_blockout_front34.png \
            art/s-creature/output/review/v5/S_blockout_rear34.png
          do
            test -s "$f"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path("art/s-creature/CHECKPOINT.md")
          s=p.read_text()
          if "review_status_v5:" not in s:
              s += "\nreview_status_v5: v5 review rendered / not accepted\n"
              s += "review_renders_v5:\n"
              s += "- output/review/v5/S_blockout_front.png\n"
              s += "- output/review/v5/S_blockout_side.png\n"
              s += "- output/review/v5/S_blockout_front34.png\n"
              s += "- output/review/v5/S_blockout_rear34.png\n"
          p.write_text(s)
          PY

      - name: Commit v5 model and review
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            art/s-creature/CHECKPOINT.md \
            art/s-creature/HANDOFF_STATE.json \
            art/s-creature/output/S-blockout-v5.blend \
            art/s-creature/output/neck-v5-validation.json \
            art/s-creature/output/review/v5/
          git commit -m "art: refine and render S blockout v5"
          git push origin HEAD:feat/s-creature-model
