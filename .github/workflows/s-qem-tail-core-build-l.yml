name: EvoWild S actual one-piece tail core rebuilt L
on:
  push:
    branches: [exp/s-qem-tail-core-rebuild-20261011]
    paths:
      - .github/workflows/s-qem-tail-core-build-l.yml
      - art/s-creature/blender/s_qem_tail_whole_core_l.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-original-QEM-one-piece-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_tail_whole_core_l.py
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-morph-a-v1/S-QEM-real-tail-morph-a-v1.blend
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-rebuild-l-v1/
            /.github/workflows/s-qem-tail-core-build-l.yml
      - name: Enforce the user's exact S-type canonical image and donor GLB
        run: |
          echo '93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png' | sha256sum --check -
          echo 'e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f  art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb' | sha256sum --check -
      - name: Install real Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Cut actual original 632-face tail and stitch single continuous S-type feather tube
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/experiments/qem-deformation-gate-20261010/tail-morph-a-v1/S-QEM-real-tail-morph-a-v1.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_tail_whole_core_l.py
      - name: Validate source preservation, 3D topology, and assemble same-angle authority comparisons
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json
          p=Path('art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-rebuild-l-v1')
          d=json.loads((p/'REAL_QEM_TAIL_CORE_L_QA.json').read_text())
          assert d['source_untouched'] and not d['production_S_ready']
          assert d['source_verts']==29948 and d['source_triangles']==59932
          assert d['old_tail_faces_replaced']==632
          assert d['single_seam_edge_count']==24
          assert d['feather_ridge_count']==5
          assert d['three_cycle_gait']=='NOT_TESTED_ON_CHANGED_MODEL'
          assert (p/'S-QEM-true-one-piece-tail-core-L-TRIAL.blend').stat().st_size>50000
          ref=Image.open('art/s-creature/references/00_s_type_modeling_image_v1.png').convert('RGB')
          w,h=ref.size
          crop_side=ref.crop((int(w*.018),int(h*.070),int(w*.525),int(h*.476)))
          crop_tail=ref.crop((int(w*.748),int(h*.61),int(w*.993),int(h*.874)))
          crop_side.save(p/'review'/'AUTHORITY_LOCKED_REAL_SIDE.jpg',quality=94)
          crop_tail.save(p/'review'/'AUTHORITY_LOCKED_REAL_TAIL_DETAIL.jpg',quality=94)
          vs=['SIDE','FRONT','FRONT34','REAR34','BACK']
          W,H=410,316
          sheet=Image.new('RGB',(5*W,2*H),(235,238,241))
          pen=ImageDraw.Draw(sheet)
          for i,view in enumerate(vs):
              for j,k in enumerate(('SOURCE','CORE_L')):
                  f=p/'review'/f'REAL_QEM_TAIL_{k}_{view}.png'
                  assert f.stat().st_size>12000,f
                  im=Image.open(f).convert('RGB')
                  im.thumbnail((W-10,H-32))
                  sheet.paste(im,(i*W+(W-im.width)//2,j*H+27+(H-27-im.height)//2))
                  pen.text((i*W+8,j*H+6),f'{k} / {view}',fill=(18,19,22))
          sheet.save(p/'review'/'REAL_QEM_TAIL_CORE_L_FIVE_VIEW_COMPARE.jpg',quality=93,optimize=True)
          CW,CH=620,490
          sheet=Image.new('RGB',(3*CW,CH),(235,238,241))
          pen=ImageDraw.Draw(sheet)
          for i,(title,im) in enumerate([
              ('S-type canonical SIDE',crop_side),
              ('QEM ORIGINAL real Blender',Image.open(p/'review'/'REAL_QEM_TAIL_SOURCE_SIDE.png').convert('RGB')),
              ('REBUILT tail core L real Blender',Image.open(p/'review'/'REAL_QEM_TAIL_CORE_L_SIDE.png').convert('RGB'))]):
              im.thumbnail((CW-10,CH-31))
              sheet.paste(im,(i*CW+(CW-im.width)//2,26+(CH-26-im.height)//2))
              pen.text((i*CW+9,7),title,fill=(15,17,21))
          sheet.save(p/'review'/'CANONICAL_S_VS_ACTUAL_REBUILT_L.jpg',quality=93,optimize=True)
          print('S_REAL_TAIL_L_GATE',d['technical_geometry_gate'],
                'SELF_INTERSECTIONS',d['full_real_tail_3d_self_collision']['self_intersections_without_shared_vertices'],
                'TOPOLOGY',d['watertight_one_component'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-real-QEM-true-single-piece-tail-L
          path: art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-rebuild-l-v1/
          if-no-files-found: warn
      - name: Preserve entire Blender, numerical and five-view evidence in experiment, not main
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-rebuild-l-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'audit: one-piece rebuilt original-QEM feathered tail L, actual manifold and visual QA'
            git pull --rebase origin exp/s-qem-tail-core-rebuild-20261011
            git push origin HEAD:exp/s-qem-tail-core-rebuild-20261011
          fi
