name: EvoWild S protected R1 anatomical sculpt workspace
on:
  push:
    branches:
      - exp/s-authority-r1-a1-trial-20261009
    paths:
      - .github/workflows/s-authority-r1-sculpt-setup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/setup_s_authority_r1_anatomical_sculpt.py
            /art/s-creature/output/S-authority-r0-a5-v2.blend
            /art/s-creature/output/review/authority-r1-sculpt-region/
            /.github/workflows/s-authority-r1-sculpt-setup.yml
      - name: Install exact Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Create editable anatomical sculpt stage while preserving R0
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-authority-r0-a5-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/setup_s_authority_r1_anatomical_sculpt.py
      - name: Verify actual Blender file and five diagnostic renders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path("art/s-creature/output/review/authority-r1-sculpt-region")
          o=json.loads((r/"R1_SCULPT_REGION_SETUP.json").read_text())
          assert o['original_body_exactly_unchanged']
          assert o['candidate_geometry_initially_identical']
          assert not o['geometry_edit_performed']
          assert o['fore_overlay_faces']>20 and o['hind_overlay_faces']>20
          assert Path("art/s-creature/output/S-authority-R1-anatomical-sculpt-setup.blend").stat().st_size>50000
          for name in o["rendered_views"]:
            assert (r/f"S_R1_SCULPT_regions_{name}.png").stat().st_size>12000
          print("ALL FIVE ANATOMICAL SCULPT REGIONS READY",o["fore_overlay_faces"],o["hind_overlay_faces"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-S-protected-R1-sculpt-workspace
          path: |
            art/s-creature/output/S-authority-R1-anatomical-sculpt-setup.blend
            art/s-creature/output/review/authority-r1-sculpt-region/
          if-no-files-found: warn
      - name: Commit full editable sculpt scene, not an artistically approved creature
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/output/S-authority-R1-anatomical-sculpt-setup.blend art/s-creature/output/review/authority-r1-sculpt-region/
          git commit -m 'art: add S R1 anatomical sculpt workspace with visible shoulder and hip editing zones'
          git pull --rebase origin exp/s-authority-r1-a1-trial-20261009
          git push origin HEAD:exp/s-authority-r1-a1-trial-20261009
