name: UniMate S Mini Bench

on:
  push:
    branches:
      - exp/unimate-s-motion-bench-20261001
    paths:
      - ".github/workflows/unimate-s-mini-bench.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  UNIMATE_COMMIT: 2c5b384715aa63d8639b1ed7eb74bfe614570c7a
  BENCH_OBJECT: evos

jobs:
  mini-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: exp/unimate-s-motion-bench-20261001
          fetch-depth: 0

      - name: Install Blender and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg python3-pip
          python3 -m pip install --break-system-packages --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python3 -m pip install --break-system-packages             numpy==2.2.6 transformers==5.16.1 sentencepiece==0.2.1             torch-geometric==2.7.0 torchdiffeq==0.2.5 einops==0.8.2             accelerate==1.14.0 tyro==1.0.12 rich==14.3.3 loguru==0.7.3 tqdm==4.67.3             matplotlib==3.10.8 imageio==2.37.3 imageio-ffmpeg==0.6.0

      - name: Checkout pinned UniMate and Motion
        run: |
          git clone https://github.com/Friedrich-M/UniMate.git /tmp/UniMate
          git -C /tmp/UniMate checkout "$UNIMATE_COMMIT"
          git clone https://github.com/inbar-2344/Motion.git /tmp/Motion

      - name: Preprocess S once for mini bench
        env:
          PYTHONPATH: /tmp/UniMate:/tmp/Motion:/home/runner/.local/lib/python3.12/site-packages:/usr/local/lib/python3.12/site-packages:/usr/lib/python3/dist-packages
        run: |
          rm -rf .unimate-mini
          mkdir -p .unimate-mini/input .unimate-mini/pre .unimate-mini/exp/checkpoints .unimate-mini/samples .unimate-mini/animated .unimate-mini/review
          cp public/models/evowild-s/focus-rigged-v5.glb ".unimate-mini/input/${BENCH_OBJECT}.glb"
          cd /tmp/UniMate
          blender -b -P data_process/mesh_animation/preprocess_char.py --             --char_path="$GITHUB_WORKSPACE/.unimate-mini/input/${BENCH_OBJECT}.glb"             --output_dir="$GITHUB_WORKSPACE/.unimate-mini/pre"             --face_r=hind_R_upper             --face_l=hind_L_upper             --formats=glb             --keep_intermediate

      - name: Download released v2 checkpoint
        run: |
          curl -L --fail --retry 5 -o .unimate-mini/exp/config.json             https://huggingface.co/Linzhan/UniMate/resolve/main/unimate_uniml3d_f60_v2/config.json
          curl -L --fail --retry 5 -o .unimate-mini/exp/dataset_stats.npy             https://huggingface.co/Linzhan/UniMate/resolve/main/unimate_uniml3d_f60_v2/dataset_stats.npy
          curl -L --fail --retry 5 -o .unimate-mini/exp/checkpoints/checkpoint_step_100000.pt             https://huggingface.co/Linzhan/UniMate/resolve/main/unimate_uniml3d_f60_v2/checkpoints/checkpoint_step_100000.pt
          test "$(stat -c%s .unimate-mini/exp/checkpoints/checkpoint_step_100000.pt)" -gt 1000000000

      - name: Configure four-case mini bench
        run: |
          python3 - <<'PY'
          import json, os
          p = ".unimate-mini/exp/config.json"
          with open(p) as f:
              c = json.load(f)
          c["objaverse"]["path"] = os.path.abspath(".unimate-mini/pre")
          c["objaverse"]["objects_num"] = -1
          c["objaverse"]["filter_object"] = False
          c["dataset"]["dataset_list"] = ["objaverse"]
          c.setdefault("sampling", {})["device"] = "cpu"
          with open(p, "w") as f:
              json.dump(c, f, indent=2)
          PY
          cat > .unimate-mini/cases.json <<'JSON'
          {
            "evos-steady_run": "An object runs forward at a steady athletic pace with coordinated limb motion and strong propulsion.",
            "evos-fast_gallop": "An object performs a fast powerful gallop or bounding run with strong cyclic propulsion.",
            "evos-max_sprint": "An object sprints forward at maximum effort with rapid forceful strides and full-body drive.",
            "evos-launch": "An object lowers its body, launches explosively, and accelerates forward into a fast run."
          }
          JSON

      - name: Generate four real UniMate motions on CPU
        env:
          PYTHONPATH: /tmp/UniMate:/tmp/Motion
          TOKENIZERS_PARALLELISM: "false"
        run: |
          cd /tmp/UniMate
          /usr/bin/time -v python3 -m unimate.inference.sample             --exp_dir="$GITHUB_WORKSPACE/.unimate-mini/exp"             --model_path="$GITHUB_WORKSPACE/.unimate-mini/exp/checkpoints/checkpoint_step_100000.pt"             --test_cases_json="$GITHUB_WORKSPACE/.unimate-mini/cases.json"             --num_repetitions=1             --batch_size=4             --seed=20261007             --output_dir="$GITHUB_WORKSPACE/.unimate-mini/samples"             --only_save_motion
          test "$(find "$GITHUB_WORKSPACE/.unimate-mini/samples/motions" -name '*.npy' | wc -l)" -eq 4

      - name: Export all generated motions back onto S rig
        env:
          PYTHONPATH: /tmp/UniMate:/tmp/Motion:/home/runner/.local/lib/python3.12/site-packages:/usr/local/lib/python3.12/site-packages:/usr/lib/python3/dist-packages
        run: |
          CHAR="$(find "$GITHUB_WORKSPACE/.unimate-mini/pre" -maxdepth 2 -name '*_canonical.glb' -print -quit)"
          COND="$GITHUB_WORKSPACE/.unimate-mini/pre/cond.npy"
          test -n "$CHAR"
          for MOTION in "$GITHUB_WORKSPACE"/.unimate-mini/samples/motions/*.npy; do
            cd /tmp/UniMate
            blender -b -P data_process/mesh_animation/animate_motion.py --               --dataset_type=objaverse               --char_path="$CHAR"               --cond_path="$COND"               --anim_path="$MOTION"               --output_dir="$GITHUB_WORKSPACE/.unimate-mini/animated"               --anim_mode=fk               --extra_bones_strategy=keep
          done
          test "$(find "$GITHUB_WORKSPACE/.unimate-mini/animated" -name '*.glb' | wc -l)" -eq 4

      - name: Build metrics and visual contact sheets
        env:
          PYTHONPATH: /tmp/UniMate:/tmp/Motion
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import numpy as np
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import sys
          sys.path.insert(0, "/tmp/UniMate")
          sys.path.insert(0, "/tmp/Motion")
          from unimate.utils.motion_utils import recover_unimate_joint_pos_from_rot

          root = Path(".unimate-mini")
          cond = np.load(root/"pre/cond.npy", allow_pickle=True).item()["evos"]
          parents = np.asarray(cond["parents"], dtype=int)
          offsets = np.asarray(cond["tpos_offsets"], dtype=float)
          names = [str(n) for n in cond["joint_names"]]
          idx = {n:i for i,n in enumerate(names)}
          feet = ["fore_L_foot","fore_R_foot","hind_L_foot","hind_R_foot"]
          all_metrics = {}

          for motion_path in sorted((root/"samples/motions").glob("*.npy")):
              x = np.load(motion_path)
              pos = recover_unimate_joint_pos_from_rot(x, parents, offsets)
              r = pos[:,0]
              root_step = np.linalg.norm(np.diff(r[:,[0,2]], axis=0), axis=1)
              fm = {}
              for n in feet:
                  p = pos[:,idx[n]]
                  h = p[:,1]
                  v = np.linalg.norm(np.diff(p, axis=0), axis=1) * 30.0
                  span = float(np.ptp(h))
                  low = h <= h.min() + max(1e-6, 0.10*span)
                  moving = np.r_[v, v[-1] if len(v) else 0.0]
                  fm[n] = {
                      "vertical_span": span,
                      "low_frames": int(low.sum()),
                      "mean_speed_when_low": float(moving[low].mean()) if low.any() else None,
                      "max_speed_when_low": float(moving[low].max()) if low.any() else None,
                  }
              case = motion_path.name.split("-rep_")[0]
              all_metrics[case] = {
                  "file": motion_path.name,
                  "frames": int(x.shape[0]),
                  "root_xz_net_travel": float(np.linalg.norm(r[-1,[0,2]]-r[0,[0,2]])),
                  "root_xz_path_length": float(root_step.sum()),
                  "root_vertical_span": float(np.ptp(r[:,1])),
                  "feet": fm,
              }

              centered = pos-r[:,None,:]
              mins=centered.min(axis=(0,1)); maxs=centered.max(axis=(0,1))
              center=(mins+maxs)/2; radius=max(float(np.max(maxs-mins))/2*1.25, 0.1)
              frames=[0,10,20,30,40,50,59]
              fig=plt.figure(figsize=(21,3.2))
              for k,f in enumerate(frames,1):
                  ax=fig.add_subplot(1,7,k,projection="3d")
                  q=centered[f]
                  for j,p in enumerate(parents):
                      if p>=0:
                          ax.plot([q[p,0],q[j,0]],[q[p,2],q[j,2]],[q[p,1],q[j,1]],lw=2)
                  ax.scatter(q[:,0],q[:,2],q[:,1],s=10)
                  ax.set_xlim(center[0]-radius,center[0]+radius)
                  ax.set_ylim(center[2]-radius,center[2]+radius)
                  ax.set_zlim(center[1]-radius,center[1]+radius)
                  ax.view_init(elev=14,azim=-72)
                  ax.set_title(f"{case} f{f}")
                  ax.set_xticks([]); ax.set_yticks([]); ax.set_zticks([])
              plt.tight_layout()
              fig.savefig(root/f"review/{case}-contact.png",dpi=150)
              plt.close(fig)

          (root/"review/metrics.json").write_text(json.dumps(all_metrics, indent=2))
          print(json.dumps(all_metrics, indent=2))
          PY

      - name: Stage mini-bench outputs
        run: |
          rm -rf public/unimate-bench/mini
          mkdir -p public/unimate-bench/mini/motions public/unimate-bench/mini/animated public/unimate-bench/mini/review
          cp .unimate-mini/samples/motions/*.npy public/unimate-bench/mini/motions/
          cp .unimate-mini/animated/*.glb public/unimate-bench/mini/animated/
          cp .unimate-mini/review/* public/unimate-bench/mini/review/
          cp .unimate-mini/cases.json public/unimate-bench/mini/cases.json
          find public/unimate-bench/mini -type f -printf '%p %s bytes\n'

      - name: Upload mini-bench bundle
        uses: actions/upload-artifact@v4
        with:
          name: unimate-s-mini-bench
          path: public/unimate-bench/mini/
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated mini-bench to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/unimate-bench/mini
          git commit -m "test: add UniMate S four-case mini bench"
          git push origin HEAD:exp/unimate-s-motion-bench-20261001
