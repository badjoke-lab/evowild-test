name: HF Pixal3D Fast Studio POC

on:
  push:
    branches:
      - test/hf-pixal3d-20260923
    paths:
      - '.github/workflows/hf-pixal3d-fast-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install client
        run: pip install -q gradio_client pillow httpx
      - name: Generate Pixal3D fast-final GLB
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, uuid
          from pathlib import Path
          from urllib.parse import urljoin
          import httpx
          from PIL import Image
          from gradio_client import Client, handle_file

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("HF_TOKEN is missing")
          print("HF_AUTH: token present")

          src = Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          runtime = Path("hf-poc/runtime-pixal3d-fast")
          output = Path("hf-poc/output-pixal3d-fast")
          runtime.mkdir(parents=True, exist_ok=True)
          output.mkdir(parents=True, exist_ok=True)

          im = Image.open(src).convert("RGBA")
          w, h = im.size
          im = im.crop((int(w * 0.30), 0, w, h)).copy()
          arr = im.load()
          xs, ys = [], []
          for y in range(im.height):
              for x in range(im.width):
                  r, g, b, a = arr[x, y]
                  if a and max(r, g, b) < 247:
                      xs.append(x); ys.append(y)
                  else:
                      arr[x, y] = (r, g, b, 0)
          if not xs:
              raise RuntimeError("No foreground pixels after cleanup")
          subject = im.crop((min(xs), min(ys), max(xs)+1, max(ys)+1))
          side = max(subject.size)
          canvas = Image.new("RGBA", (side, side), (255,255,255,0))
          canvas.alpha_composite(subject, ((side-subject.width)//2, (side-subject.height)//2))
          clean = runtime / "evowild_3q_clean.png"
          canvas.save(clean)
          print("INPUT:", clean, canvas.size)

          client = Client(
              "victor/pixal3d-studio",
              token=token,
              download_files=False,
          )
          print("PIXAL_FAST_BEGIN")
          result = client.predict(
              handle_file(str(clean)),
              "EvoWild S-Type quadruped validation asset",
              42,
              1024,
              "balanced",
              -1.0,
              False,
              api_name="/generate_fast",
          )
          print("PIXAL_FAST_RESULT:", repr(result))

          if isinstance(result, str):
              payload = json.loads(result)
          elif isinstance(result, dict):
              payload = result
          else:
              raise RuntimeError(f"Unexpected fast result type: {type(result)!r}")

          if not payload.get("ok"):
              raise RuntimeError(f"Pixal3D fast-final failed: {payload.get('error')}")
          asset = payload.get("asset") or {}
          model_url = asset.get("model_url")
          if not model_url:
              raise RuntimeError(f"model_url missing: {asset}")

          if model_url.startswith("/"):
              model_url = urljoin("https://victor-pixal3d-studio.hf.space", model_url)

          print("MODEL_URL:", model_url)
          headers = {"User-Agent": "evowild-test/1.0"}
          if "huggingface.co" in model_url:
              headers["Authorization"] = f"Bearer {token}"
          with httpx.Client(timeout=180, follow_redirects=True, headers=headers) as http:
              response = http.get(model_url)
              response.raise_for_status()
              glb_bytes = response.content

          if glb_bytes[:4] != b"glTF":
              raise RuntimeError(f"Downloaded asset is not GLB: {glb_bytes[:16]!r}")

          target = output / "evowild_s_pixal3d_fast_balanced.glb"
          target.write_bytes(glb_bytes)
          metadata = {
              "space": "victor/pixal3d-studio",
              "upstream_model": "TencentARC/Pixal3D",
              "endpoint": "/generate_fast",
              "source_image": str(src),
              "prepared_image": str(clean),
              "seed": 42,
              "resolution": 1024,
              "quality": "balanced",
              "share_to_community": False,
              "asset": asset,
              "timings": payload.get("timings"),
              "mode": payload.get("mode"),
              "output_bytes": len(glb_bytes),
          }
          (output / "pixal3d_fast_metadata.json").write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8",
          )
          print("SAVED:", target, len(glb_bytes))
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-pixal3d-fast-balanced
          path: hf-poc/output-pixal3d-fast/
          if-no-files-found: warn
