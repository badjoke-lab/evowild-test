name: EvoWild S R0 shoulder hip faceting diagnosis
on:
  push:
    branches: [exp/s-authority-r1-a1-trial-20261009]
    paths:
      - .github/workflows/s-r0-faceting-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/audit_s_r0_surface_shading.py
            /art/s-creature/output/S-authority-r0-a5-v2.blend
            /art/s-creature/output/review/authority-r1-a1-trial/R0_FACETING_DIAGNOSTIC/
            /.github/workflows/s-r0-faceting-diagnostic.yml
      - name: Install Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Audit surface angle and render unchanged geometry with corrected shading normals
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-authority-r0-a5-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/audit_s_r0_surface_shading.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-S-R0-faceting-diagnosis
          path: art/s-creature/output/review/authority-r1-a1-trial/R0_FACETING_DIAGNOSTIC/
          if-no-files-found: warn
      - name: Commit diagnostic only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/output/review/authority-r1-a1-trial/R0_FACETING_DIAGNOSTIC/
          git commit -m "audit: preserve unchanged-mesh S R0 faceting test and edge-angle diagnostics"
          git pull --rebase origin exp/s-authority-r1-a1-trial-20261009
          git push origin HEAD:exp/s-authority-r1-a1-trial-20261009
