name: TRELLIS2 Pixal3D T1 generation smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        engine: [pixal3d, trellis2]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gradio client
        run: python -m pip install --upgrade gradio_client

      - name: Generate one 1024 candidate
        run: python scripts/trellis2_pixal3d_generate.py --engine ${{ matrix.engine }} --seed 0 --resolution 1024

      - name: Upload candidate or failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-${{ matrix.engine }}-seed-0000
          path: art/s-creature/experiments/trellis2-pixal3d/raw/${{ matrix.engine }}/seed-0000/
          if-no-files-found: error
