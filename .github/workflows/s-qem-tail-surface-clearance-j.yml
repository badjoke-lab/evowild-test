name: EvoWild S real QEM tail-source clearance J
on:
  push:
    branches: [exp/s-qem-tail-surface-clearance-j-20261011]
    paths:
      - .github/workflows/s-qem-tail-surface-clearance-j.yml
      - art/s-creature/blender/s_qem_tail_surface_clearance_j.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-qem-tail-j:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_tail_surface_clearance_j.py
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-authority-blades-h-v1/S-QEM-real-connected-tail-blades-H-TRIAL.blend
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-surface-clearance-j-v1/
            /.github/workflows/s-qem-tail-surface-clearance-j.yml
      - name: Enforce the exact original S reference and QEM donor
        run: |
          echo '93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png' | sha256sum --check -
          echo 'e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f  art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb' | sha256sum --check -
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Search true non-intersection geometry on actual H-derived QEM mesh
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/experiments/qem-deformation-gate-20261010/tail-authority-blades-h-v1/S-QEM-real-connected-tail-blades-H-TRIAL.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_tail_surface_clearance_j.py
      - name: Package original H and changed J actual Blender comparative images
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw
          p=Path("art/s-creature/experiments/qem-deformation-gate-20261010/tail-surface-clearance-j-v1")
          d=json.loads((p/"QEM_J_SURFACE_CLEARANCE_QA.json").read_text())
          assert d["source_QEM_unchanged"] and d["source_H_variant_unchanged"]
          assert d["H_real_mesh_vertices"]==d["J_real_mesh_vertices"]==30540
          assert d["H_real_mesh_triangles"]==d["J_real_mesh_triangles"]==61116
          assert d["H_new_tail_intersections_at_start"]==824
          assert not d["game_production"]=="APPROVED"
          assert (p/"S-QEM-real-surface-clearance-J-TRIAL.blend").stat().st_size>50000
          views=["SIDE","FRONT","FRONT34","REAR34","BACK"]
          W,H=400,308
          sheet=Image.new("RGB",(5*W,2*H),(238,240,242))
          draw=ImageDraw.Draw(sheet)
          for i,v in enumerate(views):
              for row,k in enumerate(("BEFORE_H","CLEARANCE_J")):
                  fn=p/"review"/f"REAL_QEM_TAIL_{k}_{v}.png"
                  assert fn.stat().st_size>10000
                  im=Image.open(fn).convert("RGB")
                  im.thumbnail((W-12,H-32))
                  sheet.paste(im,(W*i+(W-im.width)//2,H*row+28+(H-28-im.height)//2))
                  draw.text((W*i+7,H*row+6),f"{k} / {v}",(18,20,22))
          sheet.save(p/"review"/"REAL_QEM_TAIL_J_FIVE_VIEW_COMPARE.jpg",quality=92,optimize=True)
          W,H=680,515
          sheet=Image.new("RGB",(2*W,2*H),(238,240,242))
          draw=ImageDraw.Draw(sheet)
          for i,v in enumerate(("SIDE","REAR34")):
              for row,k in enumerate(("BEFORE_H","CLEARANCE_J")):
                  fn=p/"review"/f"REAL_QEM_TAIL_DETAIL_{k}_{v}.png"
                  assert fn.stat().st_size>10000
                  im=Image.open(fn).convert("RGB")
                  im.thumbnail((W-12,H-31))
                  sheet.paste(im,(W*i+(W-im.width)//2,H*row+26+(H-26-im.height)//2))
                  draw.text((W*i+7,H*row+7),f"{k} real {v} tail",(18,20,22))
          sheet.save(p/"review"/"REAL_QEM_TAIL_J_DETAIL_COMPARE.jpg",quality=92,optimize=True)
          print("J_SELECTED",d["selected"]["up"],d["selected"]["outward_spread"],
                "collisions",d["selected"]["replayed_real_intersections"],
                "geometry",d["numeric_technical_clearance_gate"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-real-H-to-J-QEM-intersection-clearing
          path: art/s-creature/experiments/qem-deformation-gate-20261010/tail-surface-clearance-j-v1/
          if-no-files-found: warn
      - name: Persist real test source and ALL candidates on isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/tail-surface-clearance-j-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'audit: real QEM tail J source-collision avoidance study and rendered mesh'
            git pull --rebase origin exp/s-qem-tail-surface-clearance-j-20261011
            git push origin HEAD:exp/s-qem-tail-surface-clearance-j-20261011
          fi
