name: Analyze S mesh components
on:
  push:
    branches: [feat/s-hunyuan-shape-refine-v2-20260926]
permissions:
  contents: read
jobs:
  analyze:
    if: contains(github.event.head_commit.message, '[targeted-components]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - run: |
          blender --background --python scripts/analyze-s-components.py --             public/models/evowild-s/source-lod2.glb             /tmp/s-components.json
          cat /tmp/s-components.json
