name: deploy-pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'feat/2p5d-animated-s-proof-20260922' ||
        github.event.workflow_run.head_branch == 'feat/2p5d-four-morph-race-v1' ||
        github.event.workflow_run.head_branch == 'feat/2p5d-race-quality-floor-v2' ||
        github.event.workflow_run.head_branch == 'feat/2p5d-s-only-v3-20260924'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout existing 2.5D preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/2p5d-animated-s-proof-20260922
          path: _preview

      - name: Checkout four-morph 2.5D preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/2p5d-four-morph-race-v1
          path: _preview_four

      - name: Checkout 2.5D quality preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/2p5d-race-quality-floor-v2
          path: _preview_quality

      - name: Checkout S-only V3 2.5D preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/2p5d-s-only-v3-20260924
          path: _preview_s_v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build main site
        run: |
          npm install
          npm run build

      - name: Build existing 2.5D preview
        working-directory: _preview
        run: |
          node -e 'const fs=require("fs");const p="vite.config.js";let s=fs.readFileSync(p,"utf8");s=s.replace(`base: "/evowild-test/"`,`base: "/evowild-test/preview-2p5d/"`);fs.writeFileSync(p,s)'
          npm install
          npm run build

      - name: Build four-morph 2.5D preview
        working-directory: _preview_four
        run: |
          node -e 'const fs=require("fs");const p="vite.config.js";let s=fs.readFileSync(p,"utf8");s=s.replace(`base: "/evowild-test/"`,`base: "/evowild-test/preview-2p5d-four-morph/"`);fs.writeFileSync(p,s)'
          npm install
          npm run build

      - name: Build 2.5D quality preview
        working-directory: _preview_quality
        run: |
          node -e 'const fs=require("fs");const p="vite.config.js";let s=fs.readFileSync(p,"utf8");s=s.replace(`base: "/evowild-test/"`,`base: "/evowild-test/preview-2p5d-quality/"`);fs.writeFileSync(p,s)'
          npm install
          npm run build

      - name: Build S-only V3 2.5D preview
        working-directory: _preview_s_v3
        run: |
          node -e 'const fs=require("fs");const p="vite.config.js";let s=fs.readFileSync(p,"utf8");s=s.replace(`base: "/evowild-test/"`,`base: "/evowild-test/preview-2p5d-s-only-v3/"`);fs.writeFileSync(p,s)'
          npm install
          npm run build

      - name: Add previews under dedicated paths
        run: |
          mkdir -p dist/preview-2p5d
          cp -R _preview/dist/. dist/preview-2p5d/
          mkdir -p dist/preview-2p5d-four-morph
          cp -R _preview_four/dist/. dist/preview-2p5d-four-morph/
          mkdir -p dist/preview-2p5d-quality
          cp -R _preview_quality/dist/. dist/preview-2p5d-quality/
          mkdir -p dist/preview-2p5d-s-only-v3
          cp -R _preview_s_v3/dist/. dist/preview-2p5d-s-only-v3/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
