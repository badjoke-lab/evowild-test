name: EvoWild S true QEM sewn-leaf collision clearance P
on:
  push:
    branches: [exp/s-qem-lamina-clearance-p-20261011]
    paths:
      - .github/workflows/s-qem-sewn-armor-clearance-p.yml
      - art/s-creature/blender/s_qem_sewn_armor_clearance_p.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-3D-feather-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_sewn_armor_clearance_p.py
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-integrated-lamina-o-v1/S-QEM-original-connected-armor-laminae-O-TRIAL.blend
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-lamina-clearance-p-v1/
            /.github/workflows/s-qem-sewn-armor-clearance-p.yml
      - name: Validate user-authorized original S-reference and QEM
        run: |
          echo '93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png' | sha256sum --check -
          echo 'e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f  art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb' | sha256sum --check -
      - name: Install real Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Actual evaluated O new-body collisions and 15 candidate P mesh projections
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/experiments/qem-deformation-gate-20261010/tail-integrated-lamina-o-v1/S-QEM-original-connected-armor-laminae-O-TRIAL.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_sewn_armor_clearance_p.py
      - name: Package factual five-view and exact source/variant evidence
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import json
          p=Path("art/s-creature/experiments/qem-deformation-gate-20261010/tail-lamina-clearance-p-v1")
          d=json.loads((p/"REAL_QEM_P_CLEARANCE_QA.json").read_text())
          assert d["all_sources_preserved"] and not d["production_game_ready"]
          assert d["input_O_counts"]==d["output_P_counts"]==[32600,65236]
          assert d["O_baseline_nonshared_collision_pairs"]==185
          assert sum(d["baseline_collision_classification"].values())==185
          assert 3<=len(d["tested_candidates"])<=15
          assert (p/"S-QEM-real-sewn-leaf-clearance-P-TRIAL.blend").stat().st_size>50000
          views=["SIDE","FRONT","FRONT34","REAR34","BACK"]
          W,H=390,310
          sheet=Image.new("RGB",(5*W,2*H),(236,239,242))
          pen=ImageDraw.Draw(sheet)
          for i,v in enumerate(views):
              for j,k in enumerate(("O_BASE","P_CLEARANCE")):
                  f=p/"review"/f"REAL_QEM_{k}_{v}.png"
                  assert f.stat().st_size>10000,f
                  im=Image.open(f).convert("RGB")
                  im.thumbnail((W-12,H-30))
                  sheet.paste(im,(W*i+(W-im.width)//2,H*j+27+(H-27-im.height)//2))
                  pen.text((W*i+8,H*j+5),f"{k} / {v}",(18,20,22))
          sheet.save(p/"review"/"REAL_QEM_O_P_FIVE_VIEW_COMPARE.jpg",quality=93,optimize=True)
          W,H=660,490
          sheet=Image.new("RGB",(W*2,H*2),(236,239,242))
          pen=ImageDraw.Draw(sheet)
          for i,v in enumerate(("SIDE","FRONT34")):
              for j,k in enumerate(("O_BASE","P_CLEARANCE")):
                  f=p/"review"/f"REAL_QEM_CLOSE_{k}_{v}.png"
                  assert f.stat().st_size>10000,f
                  im=Image.open(f).convert("RGB")
                  im.thumbnail((W-12,H-30))
                  sheet.paste(im,(W*i+(W-im.width)//2,H*j+27+(H-27-im.height)//2))
                  pen.text((W*i+8,H*j+5),f"{k} / {v}",(18,20,22))
          sheet.save(p/"review"/"REAL_QEM_O_P_TAIL_DETAIL.jpg",quality=93,optimize=True)
          ref=Image.open("art/s-creature/references/00_s_type_modeling_image_v1.png").convert("RGB")
          w,h=ref.size
          ref=ref.crop((int(w*.018),int(h*.070),int(w*.525),int(h*.476)))
          ref.save(p/"review"/"LOCKED_S_SIDE_REFERENCE.jpg",quality=93)
          print("O_P_REAL_COLLISION_GATE",d["geometry_gate"],
                d["selected"]["replay_intersections"],
                d["baseline_collision_classification"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-original-QEM-feather-O-to-P-collision-audit
          path: art/s-creature/experiments/qem-deformation-gate-20261010/tail-lamina-clearance-p-v1/
          if-no-files-found: warn
      - name: Commit actual Blender source and failed/successful QA on experiment branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/tail-lamina-clearance-p-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'audit: true QEM sewn-tail P 3D collision type map and preserved 15 candidate tests'
            git pull --rebase origin exp/s-qem-lamina-clearance-p-20261011
            git push origin HEAD:exp/s-qem-lamina-clearance-p-20261011
          fi
