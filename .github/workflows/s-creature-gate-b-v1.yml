name: S creature Gate B v1 limb-root massing

on:
  push:
    branches:
      - feat/s-creature-model
    paths:
      - .github/workflows/s-creature-gate-b-v1.yml

permissions:
  contents: write

concurrency:
  group: s-creature-gate-b-v1
  cancel-in-progress: false

jobs:
  gate-b-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s-creature-model
          fetch-depth: 0
      - name: Verify Xvfb
        run: command -v xvfb-run
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Execute Gate B v1
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python art/s-creature/blender/gate_b_v1_limb_root_massing.py
      - name: Render five Gate B v1 views
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-gateB-v1.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_gate_b_v1.py
      - name: Verify scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-gateB-v1.json').read_text())
          assert r['gate']=='B' and r['pass']=='v1'
          assert r['all_nonlimb_meshes_unchanged']
          assert r['distal_limb_rings_unchanged']
          assert r['topology_preserved']
          assert r['rendered_views']==['SIDE','FRONT','FRONT34','REAR34','BACK']
          assert r['geometry_unchanged_during_render']
          for stem in ('side','front','front34','rear34','back'):
              assert (root/f'output/review/gate-b-v1/S_gateB_{stem}.png').stat().st_size>0
          PY
      - name: Update checkpoint and handoff
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('art/s-creature'); r=json.loads((root/'output/S-gateB-v1.json').read_text())
          p=root/'CHECKPOINT.md'; s=p.read_text()
          s=re.sub(r'^current_stage:.*$', 'current_stage: S Gate B v1 limb-root massing saved and five views rendered; REVIEW_PENDING / STOPPED', s, count=1, flags=re.M)
          s=re.sub(r'^current_model_file:.*$', 'current_model_file: output/S-gateB-v1.blend', s, count=1, flags=re.M)
          s=re.sub(r'^next_action:.*$', 'next_action: Review Gate B v1 limb-root massing only. Do not proceed to Gate B v2 before decision.', s, count=1, flags=re.M)
          s=re.sub(r'^modeling_status:.*$', 'modeling_status: STOPPED', s, count=1, flags=re.M)
          if 'gate_b_v1_done:' not in s:
              s+='\n\ngate_b_v1_done: Proximal six rings of all four limbs remassed; core/crest/toes/distal limbs locked; five views rendered.\n'
              s+='gate_b_v1_acceptance: REVIEW_PENDING\n'
              s+='gate_b_v1_geometry_sha256: '+r['geometry_sha256']+'\n'
          p.write_text(s)
          hp=root/'HANDOFF_STATE.json'; h=json.loads(hp.read_text())
          h['stage']='S-gate-B-v1-review'
          h['current_stage']='S Gate B v1 limb-root massing saved and five views rendered; REVIEW_PENDING / STOPPED'
          h['current_model_file']='output/S-gateB-v1.blend'; h['source_model_file']='output/S-rebuild-v14.blend'
          h['next_action']='Review Gate B v1 only. Do not proceed to v2 before decision.'
          h['gate_a_status']='PASS'; h['gate_b_status']='REVIEW_PENDING'; h['modeling_status']='STOPPED'
          h['geometry_sha256']=r['geometry_sha256']
          h['review_renders']=[f'output/review/gate-b-v1/S_gateB_{x}.png' for x in ('side','front','front34','rear34','back')]
          h['quality_issues']=['Gate B v1 limb-root massing acceptance pending review']
          hp.write_text(json.dumps(h,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-Gate-B-v1
          path: |
            art/s-creature/output/S-gateB-v1.blend
            art/s-creature/output/S-gateB-v1.json
            art/s-creature/output/review/gate-b-v1/
          if-no-files-found: error
      - name: Commit and push Gate B v1 checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-gateB-v1.blend art/s-creature/output/S-gateB-v1.json art/s-creature/output/review/gate-b-v1/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save S Gate B v1 limb-root massing and stop for review'
          git push origin HEAD:feat/s-creature-model
