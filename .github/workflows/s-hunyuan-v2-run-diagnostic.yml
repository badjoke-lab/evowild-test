name: EvoWild S V2 run status evidence
on:
  push:
    branches: [exp/s-hunyuan-shoulder-sculpt-20261013]
    paths:
      - .github/workflows/s-hunyuan-v2-run-diagnostic.yml
      - art/s-creature/blender/s_hunyuan_shoulder_chest_sculpt_v2.py
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  write-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/s-hunyuan-v2-run-diagnostic.yml
      - name: Read actual V2 Actions run and job states using GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v2
          python3 - <<'PY'
          import json,os,urllib.request,datetime,time
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflow='s-hunyuan-shoulder-chest-sculpt-v2.yml'
          base=f'https://api.github.com/repos/{repo}'
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=40) as f: return json.load(f)
          try:
              data={}
              for attempt in range(24):
                  data=get(f'{base}/actions/workflows/{workflow}/runs?branch=exp%2Fs-hunyuan-shoulder-sculpt-20261013&per_page=10')
                  latest=data.get('workflow_runs',[])
                  if latest and latest[0].get('status')=='completed' and latest[0].get('head_sha')=='a5f3467a91480e8dd8d968a88324166cfed115c0':
                      break
                  time.sleep(15)
              runs=[]
              for r in data.get('workflow_runs',[])[:10]:
                  d={k:r.get(k) for k in ('id','run_number','created_at','updated_at','status','conclusion','event','head_sha','html_url')}
                  d['jobs']=[]
                  for j in get(f"{base}/actions/runs/{r['id']}/jobs?per_page=25").get('jobs',[]):
                      d['jobs'].append(dict(id=j.get('id'),name=j.get('name'),status=j.get('status'),conclusion=j.get('conclusion'),html_url=j.get('html_url'),steps=[dict(name=s.get('name'),status=s.get('status'),conclusion=s.get('conclusion')) for s in j.get('steps',[])]))
                  runs.append(d)
              output=dict(result='GITHUB_API_OK',utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),total_count=data.get('total_count'),v2_runs=runs)
          except Exception as e:
              output=dict(result='GITHUB_API_FAILED',error=repr(e))
          output_path='art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v2/ACTIONS_V2_RUN_DIAGNOSTIC.json'
          with open(output_path,'w') as f:json.dump(output,f,indent=2,ensure_ascii=False)
          print(json.dumps(output,ensure_ascii=False))
          PY
      - name: Commit diagnostic only, do not alter original or approved files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v2/ACTIONS_V2_RUN_DIAGNOSTIC.json
          git diff --cached --quiet && exit 0
          git commit -m 'ci(s): record actual GitHub Actions V2 status for review'
          git pull --rebase origin exp/s-hunyuan-shoulder-sculpt-20261013
          git push origin HEAD:exp/s-hunyuan-shoulder-sculpt-20261013
