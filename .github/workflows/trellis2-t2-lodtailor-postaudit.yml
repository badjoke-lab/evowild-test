name: TRELLIS2 T2 LODTailor post-audit

on:
  push:
    branches:
      - exp/trellis2-pixal3d-s-bench-20261004
    paths:
      - "art/s-creature/experiments/trellis2-pixal3d/TRIGGER_T2_LODTAILOR_POSTAUDIT.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/trellis2-pixal3d-s-bench-20261004
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --quiet trimesh numpy scipy networkx

      - name: Verify persisted LOD output
        run: test -s art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-lodtailor60k/S-trellis2-clean-seed0000-maincomponent-meshfix-lod60k.glb

      - name: Re-audit exported GLB after exact seam weld
        run: python scripts/trellis2_t2_lodtailor60k_audit.py

      - name: Upload corrected audit
        uses: actions/upload-artifact@v4
        with:
          name: trellis2-t2-lodtailor60k-postaudit
          path: |
            art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-lodtailor60k/T2_LODTAILOR60K_AUDIT.json
            art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-lodtailor60k/T2_LODTAILOR60K_RESULT.md
          if-no-files-found: error

      - name: Commit corrected audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-lodtailor60k/T2_LODTAILOR60K_AUDIT.json
          git add art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-lodtailor60k/T2_LODTAILOR60K_RESULT.md
          git commit -m "exp: correct LODTailor GLB topology audit"
          git pull --rebase origin exp/trellis2-pixal3d-s-bench-20261004
          git push origin HEAD:exp/trellis2-pixal3d-s-bench-20261004
