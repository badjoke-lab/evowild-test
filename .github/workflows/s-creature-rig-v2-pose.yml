name: S rig v2 deformation pose test
on:
  push:
    branches: [feat/s-creature-model]
    paths: [.github/workflows/s-creature-rig-v2-pose.yml]
permissions: {contents: write}
jobs:
  pose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/s-creature-model, fetch-depth: 0}
      - run: command -v xvfb-run
      - run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - run: /tmp/blender-4.3.2-linux-x64/blender -b --python-exit-code 1 --python art/s-creature/blender/pose_s_rig_v2.py
      - env: {LIBGL_ALWAYS_SOFTWARE: "1"}
        run: xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-rig-v2-pose.blend --python-exit-code 1 --python art/s-creature/blender/render_s_rig_v2_pose.py
      - run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('art/s-creature'); r=json.loads((root/'output/S-rig-v2-pose.json').read_text())
          assert r['action_count']==0 and not r['keyframes_created']
          assert len(r['pose_spec_degrees'])>=12
          assert r['rendered_views']==['SIDE','FRONT','FRONT34','REAR34','BACK']
          for x in ('side','front','front34','rear34','back'): assert (root/f'output/review/rig-v2-pose/S_rig_pose_{x}.png').stat().st_size>0
          p=root/'CHECKPOINT.md'; s=p.read_text()
          s=re.sub(r'^current_stage:.*$','current_stage: S rig v2 controlled deformation pose rendered; REVIEW_PENDING / STOPPED',s,count=1,flags=re.M)
          s=re.sub(r'^current_model_file:.*$','current_model_file: output/S-rig-v2-pose.blend',s,count=1,flags=re.M)
          s=re.sub(r'^next_action:.*$','next_action: Review S rig v2 deformation pose for root seams, collapsing joints, toe/detail follow and tail/head behavior. No animation clip before decision.',s,count=1,flags=re.M)
          s=re.sub(r'^modeling_status:.*$','modeling_status: STOPPED_FOR_RIG_POSE_REVIEW',s,count=1,flags=re.M)
          s+='\n\nrig_v2_pose_done: Moderate asymmetric deformation pose applied with no Action/keyframes; five views rendered.\nrig_v2_pose_acceptance: REVIEW_PENDING\n'
          p.write_text(s)
          hp=root/'HANDOFF_STATE.json'; h=json.loads(hp.read_text())
          h.update({'stage':'S-rig-v2-pose-review','current_stage':'S rig v2 controlled deformation pose rendered; REVIEW_PENDING / STOPPED','current_model_file':'output/S-rig-v2-pose.blend','source_model_file':'output/S-rig-v1.blend','next_action':'Review deformation pose; no animation clip before decision.','modeling_status':'STOPPED_FOR_RIG_POSE_REVIEW','rig_status':'POSE_REVIEW_PENDING','rig_pose_report':'output/S-rig-v2-pose.json','review_renders':[f'output/review/rig-v2-pose/S_rig_pose_{x}.png' for x in ('side','front','front34','rear34','back')]})
          hp.write_text(json.dumps(h,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-rig-v2-pose
          path: |
            art/s-creature/output/S-rig-v2-pose.blend
            art/s-creature/output/S-rig-v2-pose.json
            art/s-creature/output/review/rig-v2-pose/
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-rig-v2-pose.blend art/s-creature/output/S-rig-v2-pose.json art/s-creature/output/review/rig-v2-pose/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save S rig v2 deformation pose test and stop for review'
          git push origin HEAD:feat/s-creature-model
