name: Hunyuan rig proof

on:
  push:
    branches:
      - feat/sf3d-game-integration-20260922
      - feat/hunyuan-gait-v2-20260925
      - feat/hunyuan-rig-v3-20260925
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rig:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[targeted-hunyuan-rig]') || contains(github.event.head_commit.message, '[targeted-hunyuan-gait-v2]') || contains(github.event.head_commit.message, '[targeted-hunyuan-gait-v21]') || contains(github.event.head_commit.message, '[targeted-hunyuan-rig-v3]') || contains(github.event.head_commit.message, '[targeted-hunyuan-rig-v31]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build Hunyuan rig proof
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == *"[targeted-hunyuan-rig-v31]"* ]]; then
            blender --background --python scripts/rig-hunyuan-blender-v31.py --               public/models/evowild-s-hunyuan2mv-lod2.glb               public/models/evowild-s-hunyuan2mv-rigged-v31.glb               public/models/evowild-s-hunyuan2mv-rigged-v31.json
            blender --background --python scripts/rig-hunyuan-blender-v31.py --               public/models/evowild-s-hunyuan2mv-lod4.glb               public/models/evowild-s-hunyuan2mv-lod4-rigged-v31.glb               public/models/evowild-s-hunyuan2mv-lod4-rigged-v31.json
            ls -lh public/models/evowild-s-hunyuan2mv-*rigged-v31*
            cat public/models/evowild-s-hunyuan2mv-rigged-v31.json
            cat public/models/evowild-s-hunyuan2mv-lod4-rigged-v31.json
          elif [[ "$subject" == *"[targeted-hunyuan-rig-v3]"* ]]; then
            blender --background --python scripts/rig-hunyuan-blender-v3.py --               public/models/evowild-s-hunyuan2mv-lod2.glb               public/models/evowild-s-hunyuan2mv-rigged-v3.glb               public/models/evowild-s-hunyuan2mv-rigged-v3.json
            blender --background --python scripts/rig-hunyuan-blender-v3.py --               public/models/evowild-s-hunyuan2mv-lod4.glb               public/models/evowild-s-hunyuan2mv-lod4-rigged-v3.glb               public/models/evowild-s-hunyuan2mv-lod4-rigged-v3.json
            ls -lh public/models/evowild-s-hunyuan2mv-*rigged-v3*
            cat public/models/evowild-s-hunyuan2mv-rigged-v3.json
            cat public/models/evowild-s-hunyuan2mv-lod4-rigged-v3.json
          elif [[ "$subject" == *"[targeted-hunyuan-gait-v21]"* ]]; then
            blender --background --python scripts/rig-hunyuan-blender-v21.py --               public/models/evowild-s-hunyuan2mv-lod2.glb               public/models/evowild-s-hunyuan2mv-rigged-v21.glb               public/models/evowild-s-hunyuan2mv-rigged-v21.json
            blender --background --python scripts/rig-hunyuan-blender-v21.py --               public/models/evowild-s-hunyuan2mv-lod4.glb               public/models/evowild-s-hunyuan2mv-lod4-rigged-v21.glb               public/models/evowild-s-hunyuan2mv-lod4-rigged-v21.json
          elif [[ "${GITHUB_REF_NAME}" == "feat/hunyuan-gait-v2-20260925" ]]; then
            blender --background --python scripts/rig-hunyuan-blender.py --               public/models/evowild-s-hunyuan2mv-lod2.glb               public/models/evowild-s-hunyuan2mv-rigged-v2.glb               public/models/evowild-s-hunyuan2mv-rigged-v2.json
            blender --background --python scripts/rig-hunyuan-blender.py --               public/models/evowild-s-hunyuan2mv-lod4.glb               public/models/evowild-s-hunyuan2mv-lod4-rigged-v2.glb               public/models/evowild-s-hunyuan2mv-lod4-rigged-v2.json
          else
            blender --background --python scripts/rig-hunyuan-blender.py --               public/models/evowild-s-hunyuan2mv-lod2.glb               public/models/evowild-s-hunyuan2mv-rigged.glb               public/models/evowild-s-hunyuan2mv-rigged.json
          fi
      - name: Persist rig proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == *"[targeted-hunyuan-rig-v31]"* ]]; then
            git add public/models/evowild-s-hunyuan2mv-rigged-v31.* public/models/evowild-s-hunyuan2mv-lod4-rigged-v31.*
          elif [[ "$subject" == *"[targeted-hunyuan-rig-v3]"* ]]; then
            git add public/models/evowild-s-hunyuan2mv-rigged-v3.* public/models/evowild-s-hunyuan2mv-lod4-rigged-v3.*
          elif [[ "$subject" == *"[targeted-hunyuan-gait-v21]"* ]]; then
            git add public/models/evowild-s-hunyuan2mv-rigged-v21.* public/models/evowild-s-hunyuan2mv-lod4-rigged-v21.*
          elif [[ "${GITHUB_REF_NAME}" == "feat/hunyuan-gait-v2-20260925" ]]; then
            git add public/models/evowild-s-hunyuan2mv-rigged-v2.* public/models/evowild-s-hunyuan2mv-lod4-rigged-v2.*
          else
            git add public/models/evowild-s-hunyuan2mv-rigged.*
          fi
          if git diff --cached --quiet; then
            echo "No rig asset changes"
          else
            git commit -m "test: persist Hunyuan rig proof [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hunyuan-rig-proof
          path: |
            public/models/*hunyuan2mv*rigged*.glb
            public/models/*hunyuan2mv*rigged*.json
