name: Hunyuan rig proof

on:
  push:
    branches:
      - feat/sf3d-game-integration-20260922
      - feat/hunyuan-rig-race-bench-20260925
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rig:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[targeted-hunyuan-rig]') || contains(github.event.head_commit.message, '[targeted-hunyuan-rig-lod4]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build heuristic S-Type armature proof
        run: |
          if [[ "${GITHUB_REF_NAME}" == "feat/hunyuan-rig-race-bench-20260925" && "${{ github.event.head_commit.message }}" == *"[targeted-hunyuan-rig-lod4]"* ]]; then
            input="public/models/evowild-s-hunyuan2mv-lod4.glb"
            output="public/models/evowild-s-hunyuan2mv-lod4-rigged.glb"
            meta="public/models/evowild-s-hunyuan2mv-lod4-rigged.json"
          else
            input="public/models/evowild-s-hunyuan2mv-lod2.glb"
            output="public/models/evowild-s-hunyuan2mv-rigged.glb"
            meta="public/models/evowild-s-hunyuan2mv-rigged.json"
          fi
          blender --background --python scripts/rig-hunyuan-blender.py -- "$input" "$output" "$meta"
          ls -lh "$output" "$meta"
          cat "$meta"
      - name: Persist rig proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/*hunyuan2mv*rigged*
          if git diff --cached --quiet; then
            echo "No rig asset changes"
          else
            git commit -m "test: persist Hunyuan rig proof [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hunyuan-rig-proof
          path: |
            public/models/*hunyuan2mv*rigged*.glb
            public/models/*hunyuan2mv*rigged*.json
