name: S rebuild v11 Gate A crest topology reset
on:
  push:
    branches: [feat/s-creature-model]
    paths: [.github/workflows/s-creature-rebuild-v11-gate-a.yml]
permissions: {contents: write}
concurrency:
  group: s-creature-rebuild-v11-gate-a
  cancel-in-progress: false
jobs:
  gate-a-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/s-creature-model, fetch-depth: 0}
      - run: command -v xvfb-run
      - name: Download Blender
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Build v11
        env: {LIBGL_ALWAYS_SOFTWARE: "1"}
        run: /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python art/s-creature/blender/edit_s_rebuild_v11.py
      - name: Render v11
        env: {LIBGL_ALWAYS_SOFTWARE: "1"}
        run: xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-rebuild-v11.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_rebuild_v11.py
      - name: Verify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature');r=json.loads((root/'output/S-rebuild-v11-gate-A.json').read_text())
          assert r['paired_crest_removed'] and r['body_coordinates_unchanged'] and r['all_noncrest_meshes_unchanged']
          assert r['rendered_views']==['SIDE','FRONT','FRONT34','REAR34','BACK'] and r['geometry_unchanged_during_render']
          for x in ('side','front','front34','rear34','back'): assert (root/f'output/review/rebuild-v11/S_rebuild_{x}.png').stat().st_size>0
          PY
      - name: Update checkpoint
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('art/s-creature');r=json.loads((root/'output/S-rebuild-v11-gate-A.json').read_text())
          p=root/'CHECKPOINT.md';s=p.read_text()
          s=re.sub(r'^current_stage:.*$','current_stage: S-rebuild-v11 Gate A saved and five views rendered; REVIEW_PENDING / STOPPED',s,count=1,flags=re.M)
          s=re.sub(r'^current_model_file:.*$','current_model_file: output/S-rebuild-v11.blend',s,count=1,flags=re.M)
          s=re.sub(r'^next_action:.*$','next_action: Review S-rebuild-v11 Gate A only; await decision. Do not proceed to Gate B.',s,count=1,flags=re.M)
          s=re.sub(r'^gate_a_status:.*$','gate_a_status: REVIEW_PENDING',s,count=1,flags=re.M)
          s=re.sub(r'^modeling_status:.*$','modeling_status: STOPPED',s,count=1,flags=re.M)
          s+='\n\ngate_a_v11_done: Bilateral paired crest topology removed and replaced with a narrow central overlapping crest group; body/limbs/toes/tail coordinates preserved; five views rendered.\n'
          s+='gate_a_v11_acceptance: REVIEW_PENDING; no PASS claimed\n'
          p.write_text(s)
          hp=root/'HANDOFF_STATE.json';h=json.loads(hp.read_text())
          h.update({'stage':'S-rebuild-gate-A-v11-review','current_stage':'S-rebuild-v11 Gate A saved and five views rendered; REVIEW_PENDING / STOPPED','current_model_file':'output/S-rebuild-v11.blend','source_model_file':'output/S-rebuild-v10.blend','next_action':'Review S-rebuild-v11 Gate A only. Do not proceed to Gate B.','gate_a_status':'REVIEW_PENDING','modeling_status':'STOPPED','accepted':False,'geometry_sha256':r['geometry_sha256']})
          h['review_renders']=[f'output/review/rebuild-v11/S_rebuild_{x}.png' for x in ('side','front','front34','rear34','back')]
          hp.write_text(json.dumps(h,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-rebuild-v11-Gate-A
          path: |
            art/s-creature/output/S-rebuild-v11.blend
            art/s-creature/output/S-rebuild-v11-gate-A.json
            art/s-creature/output/review/rebuild-v11/
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-rebuild-v11.blend art/s-creature/output/S-rebuild-v11-gate-A.json art/s-creature/output/review/rebuild-v11/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save S rebuild v11 crest topology and stop for Gate A review'
          git push origin HEAD:feat/s-creature-model
