name: S authority R0-A2 v2
on:
  push:
    branches: [exp/s-creature-vibe-modeling]
    paths:
      - .github/workflows/s-authority-r0-a2-v2.yml
      - art/s-creature/S_AUTHORITY_R0_A2_V2_PLAN.md
      - art/s-creature/blender/refine_s_authority_r0_a2_v2.py
      - art/s-creature/blender/render_s_authority_r0_a2_v2.py
permissions:
  contents: write
concurrency:
  group: s-authority-r0-a2-v2
  cancel-in-progress: true
jobs:
  r0-a2-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/s-creature-vibe-modeling
          fetch-depth: 1
      - name: Verify authority and accepted R0-A1 source
        run: |
          test -f art/s-creature/references/00_s_type_modeling_image_v1.png
          test -f art/s-creature/output/S-authority-r0-v2.blend
          test -f art/s-creature/output/S-authority-r0-v2-validation.json
          echo "93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png" | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('art/s-creature/output/S-authority-r0-v2-validation.json'))
          assert r['status']=='ACCEPTED_R0_A1'
          assert r['decision']=='KEEP'
          PY
      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Execute R0-A2 body mass reset
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-authority-r0-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/refine_s_authority_r0_a2_v2.py
      - name: Render required five views and stop
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-authority-r0-a2-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_authority_r0_a2_v2.py
      - name: Verify R0-A2 hard scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-authority-r0-a2-v2-validation.json').read_text())
          assert r['gate']=='R0-A2-v2-authority-body-mass'
          assert r['authority_sha256']=='93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6'
          assert r['a1_geometry_unchanged']
          assert r['crest_geometry_unchanged']
          assert r['other_meshes_unchanged']
          assert r['body_topology_unchanged']
          assert r['body_nonmanifold_edge_count']==0
          assert r['camera_transforms_unchanged']
          assert r['max_displacement']<=0.16
          assert 1.12<=r['shoulder_width_ratio']<=1.34
          assert 0.78<=r['waist_width_ratio']<=0.94
          assert 1.10<=r['pelvis_width_ratio']<=1.32
          assert r['outer_root_max_displacement']<=0.065
          assert r['rendered_views']==['side','front','front34','rear34','back']
          assert r['status']=='REVIEW_PENDING'
          for stem in r['rendered_views']:
              p=root/f'output/review/authority-r0-a2-v2/S_authority_r0_a2_v2_{stem}.png'
              assert p.stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-authority-R0-A2-v2-review
          path: |
            art/s-creature/output/S-authority-r0-a2-v2.blend
            art/s-creature/output/S-authority-r0-a2-v2-validation.json
            art/s-creature/output/review/authority-r0-a2-v2/
          if-no-files-found: error
      - name: Commit R0-A2 review result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-authority-r0-a2-v2.blend art/s-creature/output/S-authority-r0-a2-v2-validation.json art/s-creature/output/review/authority-r0-a2-v2/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save authority R0-A2 v2 review'
          git push origin HEAD:exp/s-creature-vibe-modeling
