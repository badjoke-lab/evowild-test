name: HF Pixal3D Input Prep

on:
  push:
    branches:
      - test/hf-pixal3d-20260923
    paths:
      - '.github/workflows/hf-pixal3d-poc.yml'
      - 'scripts/prepare-3d-input.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - name: Prepare high-resolution single-creature input
        run: |
          mkdir -p hf-poc/prepared-input
          python scripts/prepare-3d-input.py \
            hf-poc/input/04_3Q_FRONT_shape_support.jpg \
            hf-poc/prepared-input/evowild_s_3q_edge_clean_1024.png \
            --left-crop-ratio 0.30 \
            --canvas-size 1024 \
            --fill-ratio 0.90 \
            --threshold 242 \
            --metadata hf-poc/prepared-input/evowild_s_3q_edge_clean_1024.json
      - name: Upload prepared input
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-3d-prepared-input
          path: hf-poc/prepared-input/
          if-no-files-found: error
