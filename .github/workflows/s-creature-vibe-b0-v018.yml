name: S creature Vibe lane Gate B0 v018 continuity
on:
  push:
    branches: [exp/s-creature-vibe-modeling]
    paths:
      - .github/workflows/s-creature-vibe-b0-v018.yml
      - art/s-creature/blender/build_s_vibe_b0_v018.py
      - art/s-creature/blender/render_s_vibe_b0_v018.py
permissions:
  contents: write
concurrency:
  group: s-creature-vibe-b0-v018
  cancel-in-progress: false
jobs:
  vibe-b0-v018:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/s-creature-vibe-modeling
          fetch-depth: 0
      - name: Verify B0 source
        run: |
          test -f art/s-creature/output/S-vibe-a4-v2.blend
          test "$(git branch --show-current)" = "exp/s-creature-vibe-modeling"
      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Build B0 continuity candidate
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-a4-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/build_s_vibe_b0_v018.py
      - name: Render B0 five views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-b0-v018.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_vibe_b0_v018.py
      - name: Verify B0 candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-vibe-b0-v018-validation.json').read_text())
          assert r['gate']=='B0-v018-continuity-feasibility'
          assert r['gate_a_source_overwritten'] is False
          assert r['preserved_geometry_unchanged']
          assert r['render_preserved_geometry_unchanged']
          assert r['body_vertex_count']>0 and r['body_polygon_count']>0
          for stem in ('side','front','front34','rear34','back'):
              assert (root/f'output/review/vibe-b0-v018/S_vibe_b0_v018_{stem}.png').stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-vibe-B0-v018-review
          path: |
            art/s-creature/output/S-vibe-b0-v018.blend
            art/s-creature/output/S-vibe-b0-v018-validation.json
            art/s-creature/output/review/vibe-b0-v018/
          if-no-files-found: error
      - name: Commit B0 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-vibe-b0-v018.blend art/s-creature/output/S-vibe-b0-v018-validation.json art/s-creature/output/review/vibe-b0-v018/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save Vibe B0-v018 continuity review'
          git push origin HEAD:exp/s-creature-vibe-modeling
