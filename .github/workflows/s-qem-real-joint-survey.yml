name: EvoWild S QEM actual mesh anatomical landmark survey
on:
  push:
    branches: [exp/s-qem-deformation-gate-20261010]
    paths: [.github/workflows/s-qem-real-joint-survey.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-geometry-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_joint_coordinate_survey.py
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/experiments/qem-deformation-gate-20261010/
            /.github/workflows/s-qem-real-joint-survey.yml
      - name: Install Blender for headless orthographic reviews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Audit real GLB vertex coordinate slices and make five unaltered renders
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_joint_coordinate_survey.py
      - name: Generate overview and verify hard source fingerprint
        run: |
          python3 -m pip install -q Pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import json
          p=Path('art/s-creature/experiments/qem-deformation-gate-20261010')
          o=json.loads((p/'JOINT_LANDMARK_SURVEY.json').read_text())
          assert o['source_sha256']=='e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f'
          assert o['mesh_vertices']==29948 and o['mesh_faces']==59932 and o['nonmanifold_edges']==0
          cols=['side','front','front34','rear34','back']
          sheet=Image.new('RGB',(425*5,440),(242,244,246))
          d=ImageDraw.Draw(sheet)
          for i,name in enumerate(cols):
            f=p/'landmark-survey'/f'S_QEM_survey_{name}.png'
            assert f.stat().st_size>10000,f
            pic=Image.open(f).convert('RGB')
            pic.thumbnail((413,408))
            sheet.paste(pic,(i*425+(425-pic.width)//2,25+(411-pic.height)//2))
            d.text((i*425+10,8),'QEM ORIGINAL / '+name.upper(),fill=(15,16,18))
          sheet.save(p/'landmark-survey/S_QEM_joint_survey_fiveview.jpg',quality=90,optimize=True)
          assert (p/'S-QEM-pre-rig-source-review.blend').stat().st_size>50000
          print('REAL_JOINT_SURVEY_ARCHIVED',o['normalized_bounds'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evowild-QEM-unaltered-landmark-mesh-survey
          path: art/s-creature/experiments/qem-deformation-gate-20261010/
          if-no-files-found: warn
      - name: Commit on isolated source-donor-gate branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/
          git commit -m 'exp: QEM actual geometry joint locator survey and unmodified five-view source'
          git pull --rebase origin exp/s-qem-deformation-gate-20261010
          git push origin HEAD:exp/s-qem-deformation-gate-20261010
