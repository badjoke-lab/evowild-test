name: Prepare TRELLIS2 Pixal3D inputs

on:
  push:
    branches:
      - exp/trellis2-pixal3d-s-bench-20261004
    paths:
      - ".github/workflows/trellis2-pixal3d-prepare-inputs.yml"
      - "scripts/prepare_trellis2_pixal3d_inputs.py"
      - "art/s-creature/references/01_s_body_primary.png"
      - "art/s-creature/references/02_s_silhouette.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - run: python scripts/prepare_trellis2_pixal3d_inputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: trellis2-pixal3d-prepared-inputs
          path: art/s-creature/experiments/trellis2-pixal3d/prepared/
          if-no-files-found: error
