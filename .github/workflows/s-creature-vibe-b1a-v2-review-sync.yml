name: S creature B1a v2 review sync
on:
  push:
    branches: [exp/s-creature-vibe-modeling]
    paths:
      - .github/workflows/s-creature-vibe-b1a-v2-review-sync.yml
permissions:
  contents: write
jobs:
  sync-review-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/s-creature-vibe-modeling
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build three-version five-view comparison
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          root=Path('art/s-creature/output/review')
          versions=[
            ('B0-v025', root/'vibe-b0-v025', 'S_vibe_b0_v025_'),
            ('B1a-v1', root/'vibe-b1a-v1', 'S_vibe_b1a_v1_'),
            ('B1a-v2', root/'vibe-b1a-v2', 'S_vibe_b1a_v2_'),
          ]
          views=['side','front','front34','rear34','back']

          rows=[]
          for label,d,prefix in versions:
            row=[]
            for v in views:
              p=d/f'{prefix}{v}.png'
              assert p.exists(), p
              row.append(Image.open(p).convert('RGB'))
            rows.append(row)

          cell_w=max(im.width for row in rows for im in row)
          cell_h=max(im.height for row in rows for im in row)
          left=150; top=70; gap=8
          canvas=Image.new('RGB',(left+5*cell_w+4*gap,top+3*cell_h+2*gap),'white')
          draw=ImageDraw.Draw(canvas)
          try:
            font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',24)
          except:
            font=ImageFont.load_default()

          for j,v in enumerate(views):
            x=left+j*(cell_w+gap)+cell_w//2
            txt=v.upper()
            box=draw.textbbox((0,0),txt,font=font)
            draw.text((x-(box[2]-box[0])//2,18),txt,fill='black',font=font)

          for i,(label,_,_) in enumerate(versions):
            y=top+i*(cell_h+gap)+cell_h//2
            box=draw.textbbox((0,0),label,font=font)
            draw.text((15,y-(box[3]-box[1])//2),label,fill='black',font=font)
            for j,img in enumerate(rows[i]):
              x=left+j*(cell_w+gap)
              yy=top+i*(cell_h+gap)
              canvas.paste(img,(x,yy))

          out=root/'vibe-b1a-v2'/'B1a-v2-three-version-five-view-comparison.png'
          canvas.save(out,optimize=True)
          print(out)
          PY
      - name: Commit comparison
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/review/vibe-b1a-v2/B1a-v2-three-version-five-view-comparison.png
          git commit -m 'review: add B1a-v2 three-version comparison'
          git push origin HEAD:exp/s-creature-vibe-modeling
