name: EvoWild S R1-A1 v2 anatomical topology patch
on:
  push:
    branches: [exp/s-authority-r1-a1-trial-20261009]
    paths: [.github/workflows/s-authority-r1-a1-v2-patch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  local-retopology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/sculpt_s_authority_r1_a1_v2_patch.py
            /art/s-creature/output/S-authority-r0-a5-v2.blend
            /art/s-creature/output/review/authority-r0-a6/
            /art/s-creature/output/review/authority-r1-a1-v2-topology/
            /.github/workflows/s-authority-r1-a1-v2-patch.yml
      - name: Install Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Real local quad patch reconstruction and five old-locked cameras
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-authority-r0-a5-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/sculpt_s_authority_r1_a1_v2_patch.py
      - name: Validate retopology invariants and make R0 / new actual five-view comparison
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json
          root=Path('art/s-creature/output')
          o=json.loads((root/'S-authority-r1-a1-v2-patch-validation.json').read_text())
          assert o['nonmanifold_edge_count']==0
          assert o['outside_support_old_vertices_unchanged'] and o['separate_crest_tail_foot_meshes_bit_exact'] and o['cameras_exact']
          assert o['new_vertex_count']>=100 and o['new_face_count']>o['original_face_count']
          assert o['repaired_angles']['gt_90']<=o['original_angles']['gt_90']*1.3+3
          views=['side','front','front34','rear34','back']
          sheet=Image.new('RGB',(410*5,450*2),(246,247,249))
          draw=ImageDraw.Draw(sheet)
          for row,(label,folder,prefix) in enumerate([
            ('R0 AUTHORISED BLOCKOUT',root/'review/authority-r0-a6','S_authority_r0_a6_'),
            ('R1-A1 v2 MESH PATCH',root/'review/authority-r1-a1-v2-topology','S_R1_A1_v2_')
          ]):
            for col,v in enumerate(views):
              p=folder/(prefix+v+'.png')
              assert p.is_file() and p.stat().st_size>10000,p
              im=Image.open(p).convert('RGB')
              im.thumbnail((395,410))
              sheet.paste(im,(col*410+(410-im.width)//2,row*450+28+(415-im.height)//2))
              draw.text((col*410+8,row*450+7),f'{label} / {v.upper()}',fill=(14,16,19))
          dest=root/'review/authority-r1-a1-v2-topology/R0_vs_R1A1_v2_fiveview.jpg'
          sheet.save(dest,quality=91,optimize=True)
          print("R1_A1_V2_MESH_GEOMETRY_VERIFIED",o['new_vertex_count'],o['modified_original_vertices'],o['original_angles'],o['repaired_angles'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-S-R1-A1-v2-actual-topology-and-renders
          path: |
            art/s-creature/output/S-authority-r1-a1-v2-patch.blend
            art/s-creature/output/S-authority-r1-a1-v2-patch-validation.json
            art/s-creature/output/review/authority-r1-a1-v2-topology/
          if-no-files-found: warn
      - name: Save actual v2 evidence only to isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/output/S-authority-r1-a1-v2-patch.blend art/s-creature/output/S-authority-r1-a1-v2-patch-validation.json art/s-creature/output/review/authority-r1-a1-v2-topology/
          git commit -m 'exp: R1-A1 v2 local topology repair and real 5-view model comparison'
          git pull --rebase origin exp/s-authority-r1-a1-trial-20261009
          git push origin HEAD:exp/s-authority-r1-a1-trial-20261009
