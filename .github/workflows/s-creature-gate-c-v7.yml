name: S creature Gate C v7 Cue Band

on:
  push:
    branches: [feat/s-creature-model]
    paths: [.github/workflows/s-creature-gate-c-v7.yml]

permissions:
  contents: write

concurrency:
  group: s-creature-gate-c-v7
  cancel-in-progress: false

jobs:
  gate-c-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s-creature-model
          fetch-depth: 0
      - name: Verify Xvfb
        run: command -v xvfb-run
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Execute Gate C v7
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python art/s-creature/blender/gate_c_v7_cue_band.py
      - name: Render five Gate C v7 views
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-gateC-v7.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_gate_c_v7.py
      - name: Verify scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature'); r=json.loads((root/'output/S-gateC-v7.json').read_text())
          assert r['gate']=='C' and r['pass']=='v7'
          assert r['existing_coordinates_unchanged'] and r['existing_topology_unchanged']
          assert r['existing_modifiers_unchanged'] and r['existing_material_assignments_unchanged']
          assert r['eye_transforms_unchanged']
          assert len(r['cue_band_objects'])==8
          assert r['no_pattern']
          assert r['rendered_views']==['SIDE','FRONT','FRONT34','REAR34','BACK']
          assert r['base_geometry_unchanged_during_render']
          for stem in ('side','front','front34','rear34','back'):
              assert (root/f'output/review/gate-c-v7/S_gateC_{stem}.png').stat().st_size>0
          PY
      - name: Update checkpoint and handoff
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('art/s-creature'); r=json.loads((root/'output/S-gateC-v7.json').read_text())
          p=root/'CHECKPOINT.md'; s=p.read_text()
          s=re.sub(r'^current_stage:.*$', 'current_stage: S Gate C v7 Cue Band preview saved and five views rendered; REVIEW_PENDING / STOPPED', s, count=1, flags=re.M)
          s=re.sub(r'^current_model_file:.*$', 'current_model_file: output/S-gateC-v7.blend', s, count=1, flags=re.M)
          s=re.sub(r'^next_action:.*$', 'next_action: Review Gate C v7 Cue Band only. Do not add body pattern before decision.', s, count=1, flags=re.M)
          s=re.sub(r'^modeling_status:.*$', 'modeling_status: STOPPED', s, count=1, flags=re.M)
          if 'gate_c_v7_done:' not in s:
              s+='\n\ngate_c_v7_done: Compact Cue Band preview added as new detail objects; all existing geometry/modifiers/material assignments and v6 eye transforms locked; five views rendered.\n'
              s+='gate_c_v7_acceptance: REVIEW_PENDING\n'
              s+='gate_c_v7_base_geometry_sha256: '+r['base_geometry_sha256']+'\n'
          p.write_text(s)
          hp=root/'HANDOFF_STATE.json'; h=json.loads(hp.read_text())
          h['stage']='S-gate-C-v7-review'
          h['current_stage']='S Gate C v7 Cue Band preview saved and five views rendered; REVIEW_PENDING / STOPPED'
          h['current_model_file']='output/S-gateC-v7.blend'; h['source_model_file']='output/S-gateC-v6.blend'
          h['next_action']='Review Gate C v7 Cue Band only. Do not add body pattern before decision.'
          h['gate_c_status']='REVIEW_PENDING'; h['modeling_status']='STOPPED'
          h['geometry_sha256']=r['base_geometry_sha256']
          h['review_renders']=[f'output/review/gate-c-v7/S_gateC_{x}.png' for x in ('side','front','front34','rear34','back')]
          h['quality_issues']=['Gate C v7 Cue Band acceptance pending review']
          hp.write_text(json.dumps(h,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-Gate-C-v7
          path: |
            art/s-creature/output/S-gateC-v7.blend
            art/s-creature/output/S-gateC-v7.json
            art/s-creature/output/review/gate-c-v7/
          if-no-files-found: error
      - name: Commit and push Gate C v7 checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-gateC-v7.blend art/s-creature/output/S-gateC-v7.json art/s-creature/output/review/gate-c-v7/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save S Gate C v7 Cue Band and stop for review'
          git push origin HEAD:feat/s-creature-model
