name: S creature Gate B v2 crest-root integration

on:
  push:
    branches:
      - feat/s-creature-model
    paths:
      - .github/workflows/s-creature-gate-b-v2.yml

permissions:
  contents: write

concurrency:
  group: s-creature-gate-b-v2
  cancel-in-progress: false

jobs:
  gate-b-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s-creature-model
          fetch-depth: 0
      - name: Verify Xvfb
        run: command -v xvfb-run
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Execute Gate B v2
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: /tmp/blender-4.3.2-linux-x64/blender -b -t 4 --python-exit-code 1 --python art/s-creature/blender/gate_b_v2_crest_root.py
      - name: Render five Gate B v2 views
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-gateB-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_gate_b_v2.py
      - name: Verify scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-gateB-v2.json').read_text())
          assert r['gate']=='B' and r['pass']=='v2'
          assert r['all_existing_coordinates_unchanged']
          assert r['all_noncrest_meshes_unchanged']
          assert r['added_saddle_vertices']==12
          assert r['rendered_views']==['SIDE','FRONT','FRONT34','REAR34','BACK']
          assert r['geometry_unchanged_during_render']
          for stem in ('side','front','front34','rear34','back'):
              assert (root/f'output/review/gate-b-v2/S_gateB_{stem}.png').stat().st_size>0
          PY
      - name: Update checkpoint and handoff
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('art/s-creature'); r=json.loads((root/'output/S-gateB-v2.json').read_text())
          p=root/'CHECKPOINT.md'; s=p.read_text()
          s=re.sub(r'^current_stage:.*$', 'current_stage: S Gate B v2 crest-root integration saved and five views rendered; REVIEW_PENDING / STOPPED', s, count=1, flags=re.M)
          s=re.sub(r'^current_model_file:.*$', 'current_model_file: output/S-gateB-v2.blend', s, count=1, flags=re.M)
          s=re.sub(r'^next_action:.*$', 'next_action: Review Gate B v2 crest-root integration only. Do not proceed to Gate B v3 before decision.', s, count=1, flags=re.M)
          s=re.sub(r'^modeling_status:.*$', 'modeling_status: STOPPED', s, count=1, flags=re.M)
          if 'gate_b_v2_done:' not in s:
              s+='\n\ngate_b_v2_done: Shared crest saddle appended; every pre-existing coordinate and every non-crest mesh preserved; five views rendered.\n'
              s+='gate_b_v2_acceptance: REVIEW_PENDING\n'
              s+='gate_b_v2_geometry_sha256: '+r['geometry_sha256']+'\n'
          p.write_text(s)
          hp=root/'HANDOFF_STATE.json'; h=json.loads(hp.read_text())
          h['stage']='S-gate-B-v2-review'
          h['current_stage']='S Gate B v2 crest-root integration saved and five views rendered; REVIEW_PENDING / STOPPED'
          h['current_model_file']='output/S-gateB-v2.blend'; h['source_model_file']='output/S-gateB-v1.blend'
          h['next_action']='Review Gate B v2 only. Do not proceed to v3 before decision.'
          h['gate_b_status']='REVIEW_PENDING'; h['modeling_status']='STOPPED'
          h['geometry_sha256']=r['geometry_sha256']
          h['review_renders']=[f'output/review/gate-b-v2/S_gateB_{x}.png' for x in ('side','front','front34','rear34','back')]
          h['quality_issues']=['Gate B v2 crest-root integration acceptance pending review']
          hp.write_text(json.dumps(h,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-Gate-B-v2
          path: |
            art/s-creature/output/S-gateB-v2.blend
            art/s-creature/output/S-gateB-v2.json
            art/s-creature/output/review/gate-b-v2/
          if-no-files-found: error
      - name: Commit and push Gate B v2 checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-gateB-v2.blend art/s-creature/output/S-gateB-v2.json art/s-creature/output/review/gate-b-v2/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save S Gate B v2 crest-root integration and stop for review'
          git push origin HEAD:feat/s-creature-model
