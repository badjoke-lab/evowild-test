name: HF TripoSG generation

on:
  push:
    branches:
      - test/hf-sf3d-retry-20260921
    paths:
      - ".github/workflows/hf-triposg-generate.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client
        run: pip install --quiet "gradio_client>=1.10,<2" pillow

      - name: Generate EvoWild S with TripoSG
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import inspect, json, os, shutil
          from pathlib import Path
          from PIL import Image
          from gradio_client import Client, handle_file

          out = Path("hf-poc/output-triposg")
          out.mkdir(parents=True, exist_ok=True)
          runtime = Path("hf-poc/runtime-triposg")
          runtime.mkdir(parents=True, exist_ok=True)

          src = Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          if not src.exists():
              raise FileNotFoundError(src)

          im = Image.open(src).convert("RGB")
          w, h = im.size
          erase_x = int(w * 0.30)
          im.paste((255, 255, 255), (0, 0, erase_x, h))
          cleaned = runtime / "04_3Q_FRONT_cleanleft30.jpg"
          im.save(cleaned, quality=96)

          token = os.environ.get("HF_TOKEN")
          params = inspect.signature(Client).parameters
          auth_kw = {"token": token} if "token" in params else {"hf_token": token}
          client = Client("VAST-AI/TripoSG", **auth_kw)

          segmented = client.predict(
              handle_file(str(cleaned)),
              api_name="/run_segmentation",
          )
          print("SEGMENTATION:", repr(segmented))

          seg_path = segmented.get("path") if isinstance(segmented, dict) else str(segmented)
          if not seg_path or not Path(seg_path).exists():
              raise RuntimeError(f"Segmentation file unavailable: {segmented!r}")

          seg_copy = out / Path(seg_path).name
          shutil.copy2(seg_path, seg_copy)

          mesh = client.predict(
              handle_file(seg_path),
              1234,
              50,
              7.0,
              True,
              30000,
              api_name="/image_to_3d",
          )
          print("MESH:", repr(mesh))

          mesh_path = mesh.get("path") if isinstance(mesh, dict) else str(mesh)
          if not mesh_path or not Path(mesh_path).exists():
              raise RuntimeError(f"Mesh file unavailable: {mesh!r}")

          target = out / "evowild_s_triposg_shape.glb"
          shutil.copy2(mesh_path, target)

          meta = {
              "space": "VAST-AI/TripoSG",
              "endpoint": "/image_to_3d",
              "source": str(src),
              "preprocess": "erase left 30 percent contamination then Space segmentation",
              "seed": 1234,
              "num_inference_steps": 50,
              "guidance_scale": 7.0,
              "simplify": True,
              "target_face_num": 30000,
              "output_bytes": target.stat().st_size,
              "magic_hex": target.read_bytes()[:4].hex(),
          }
          (out / "metadata.json").write_text(json.dumps(meta, indent=2), encoding="utf-8")
          print("SAVED:", target, target.stat().st_size, target.read_bytes()[:4])
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-triposg-shape
          path: hf-poc/output-triposg/
          if-no-files-found: error
