name: EvoWild original QEM actual H tail collision localization I
on:
  push:
    branches: [exp/s-qem-tail-intersection-audit-i-20261011]
    paths:
      - .github/workflows/s-qem-tail-h-collision-audit-i.yml
      - art/s-creature/blender/s_qem_tail_collision_audit_i.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-qem-tail-h-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_tail_collision_audit_i.py
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-authority-blades-h-v1/S-QEM-real-connected-tail-blades-H-TRIAL.blend
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-intersection-audit-i-v1/
            /.github/workflows/s-qem-tail-h-collision-audit-i.yml
      - name: Verify locked source
        run: |
          echo '93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png' | sha256sum --check -
          echo 'e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f  art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb' | sha256sum --check -
      - name: Install Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Compute real original-A baseline versus H intersection triangles
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/experiments/qem-deformation-gate-20261010/tail-authority-blades-h-v1/S-QEM-real-connected-tail-blades-H-TRIAL.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_tail_collision_audit_i.py
      - name: Confirm numerical audit records true source and does not promote model
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("art/s-creature/experiments/qem-deformation-gate-20261010/tail-intersection-audit-i-v1/QEM_H_TAIL_COLLISION_LOCATION_QA.json")
          j=json.loads(p.read_text())
          assert j["source_preserved"]
          assert j["donor_source_vertices"]==j["A_existing_original_QEM_vertices"]==29948
          assert j["H_derived_connected_QEM_vertices"]==30540
          assert j["H_total_self_intersections"]>0
          assert sum(j["H_intersection_type_counts"].values())==j["H_total_self_intersections"]
          assert not j["is_H_visual_S_approved"] and not j["production_approved"]
          print("A baseline",j["A_baseline_self_intersections"],"H collisions",j["H_intersection_type_counts"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-real-QEM-H-collision-map-I
          path: art/s-creature/experiments/qem-deformation-gate-20261010/tail-intersection-audit-i-v1/
          if-no-files-found: warn
      - name: Commit actionable 3D face locations only to experimental branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/tail-intersection-audit-i-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'audit: actual tail H collision triangles and original A baseline'
            git pull --rebase origin exp/s-qem-tail-intersection-audit-i-20261011
            git push origin HEAD:exp/s-qem-tail-intersection-audit-i-20261011
          fi
