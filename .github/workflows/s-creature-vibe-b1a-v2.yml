name: S creature Vibe lane Gate B1a v2 shoulder chest cleanup
on:
  push:
    branches: [exp/s-creature-vibe-modeling]
    paths:
      - .github/workflows/s-creature-vibe-b1a-v2.yml
      - art/s-creature/blender/refine_s_vibe_b1a_v1.py
      - art/s-creature/blender/render_s_vibe_b1a_v1.py
permissions:
  contents: write
concurrency:
  group: s-creature-vibe-b1a-v2
  cancel-in-progress: false
jobs:
  vibe-b1a-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/s-creature-vibe-modeling
          fetch-depth: 0
      - name: Verify B1a source
        run: |
          test -f art/s-creature/output/S-vibe-b0-v025.blend
          test "$(git branch --show-current)" = "exp/s-creature-vibe-modeling"
      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Download Blender 4.3.2
        run: |
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Apply local shoulder chest cleanup
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-b0-v025.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/refine_s_vibe_b1a_v1.py
      - name: Render five B1a views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/output/S-vibe-b1a-v2.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/render_s_vibe_b1a_v1.py
      - name: Verify B1a hard scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('art/s-creature')
          r=json.loads((root/'output/S-vibe-b1a-v2-validation.json').read_text())
          assert r['gate']=='B1a-v1-local-shoulder-chest-relax'
          assert r['fixed_geometry_unchanged']
          assert r['preserved_geometry_unchanged']
          assert r['topology_unchanged']
          assert r['render_fixed_geometry_unchanged']
          assert r['editable_vertex_count']>0
          assert r['max_displacement']>=0
          for stem in ('side','front','front34','rear34','back'):
              assert (root/f'output/review/vibe-b1a-v2/S_vibe_b1a_v1_{stem}.png').stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S-vibe-B1a-v1-review
          path: |
            art/s-creature/output/S-vibe-b1a-v2.blend
            art/s-creature/output/S-vibe-b1a-v2-validation.json
            art/s-creature/output/review/vibe-b1a-v2/
          if-no-files-found: error
      - name: Commit B1a result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/s-creature/output/S-vibe-b1a-v2.blend art/s-creature/output/S-vibe-b1a-v2-validation.json art/s-creature/output/review/vibe-b1a-v2/ art/s-creature/CHECKPOINT.md art/s-creature/HANDOFF_STATE.json
          git commit -m 'art: save Vibe B1a-v1 shoulder chest cleanup review'
          git push origin HEAD:exp/s-creature-vibe-modeling
