name: Hunyuan S shape refine v27

on:
  push:
    branches:
      - feat/s-hunyuan-shape-refine-v2-20260926
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shape:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[targeted-shape-v27]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry tools
        run: pip install numpy trimesh scipy networkx
      - name: Generate conservative v27
        run: |
          python scripts/refine-hunyuan-shape-v27.py --             public/models/evowild-s/source-lod2.glb             public/models/evowild-s/source-lod2-shape-v27.glb             public/models/evowild-s/source-lod2-shape-v27.json
          cat public/models/evowild-s/source-lod2-shape-v27.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies with retry
        run: |
          for attempt in 1 2 3; do
            npm install && exit 0
            sleep 10
          done
          exit 1
      - run: npx playwright install --with-deps chromium
      - name: Render browser comparison
        run: npm run test:e2e -- --workers=1 -g "render S baseline v27 conservative comparison"
      - name: Persist candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             public/models/evowild-s/source-lod2-shape-v27.glb             public/models/evowild-s/source-lod2-shape-v27.json
          if ! git diff --cached --quiet; then
            git commit -m "model: persist S shape-v27 candidate [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: s-shape-v27-review
          path: |
            test-results/shape-v27-browser/*.png
            public/models/evowild-s/source-lod2-shape-v27.json
