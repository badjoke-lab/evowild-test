name: Hunyuan S shape refine v2

on:
  push:
    branches:
      - feat/s-hunyuan-shape-refine-v2-20260926
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shape:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[targeted-shape-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Generate refined S candidate and renders
        run: |
          mkdir -p test-results/shape-v2
          blender --background --python scripts/refine-hunyuan-shape-v2.py --             public/models/evowild-s/source-lod2.glb             public/models/evowild-s/source-lod2-shape-v2.glb             public/models/evowild-s/source-lod2-shape-v2.json             test-results/shape-v2
          ls -lh public/models/evowild-s/source-lod2-shape-v2.*
          cat public/models/evowild-s/source-lod2-shape-v2.json
          ls -lh test-results/shape-v2
      - name: Persist candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/evowild-s/source-lod2-shape-v2.glb public/models/evowild-s/source-lod2-shape-v2.json
          if git diff --cached --quiet; then
            echo "No shape changes"
          else
            git commit -m "model: persist S shape-v2 candidate [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: s-shape-v2-review
          path: |
            test-results/shape-v2/*.png
            public/models/evowild-s/source-lod2-shape-v2.json
