name: Hunyuan S shape refine v24

on:
  push:
    branches:
      - feat/s-hunyuan-shape-refine-v2-20260926
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shape:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[targeted-shape-v24]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry tools
        run: pip install numpy trimesh scipy networkx
      - name: Generate v22 and v24 candidates
        run: |
          python scripts/refine-hunyuan-shape-v22.py --             public/models/evowild-s/source-lod2.glb             public/models/evowild-s/source-lod2-shape-v22.glb             public/models/evowild-s/source-lod2-shape-v22.json
          python scripts/refine-hunyuan-shape-v24.py --             public/models/evowild-s/source-lod2.glb             public/models/evowild-s/source-lod2-shape-v24.glb             public/models/evowild-s/source-lod2-shape-v24.json
          ls -lh public/models/evowild-s/source-lod2-shape-v22.* public/models/evowild-s/source-lod2-shape-v24.*
          cat public/models/evowild-s/source-lod2-shape-v24.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Render browser comparison
        run: npm run test:e2e -- --workers=1 -g "render S v22 v24 comparison"
      - name: Persist candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             public/models/evowild-s/source-lod2-shape-v22.glb             public/models/evowild-s/source-lod2-shape-v22.json             public/models/evowild-s/source-lod2-shape-v24.glb             public/models/evowild-s/source-lod2-shape-v24.json
          if git diff --cached --quiet; then
            echo "No shape changes"
          else
            git commit -m "model: persist S shape-v24 candidate [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: s-shape-v24-review
          path: |
            test-results/shape-v24-browser/*.png
            public/models/evowild-s/source-lod2-shape-v22.json
            public/models/evowild-s/source-lod2-shape-v24.json
