name: EvoWild original QEM morphology tail trial A
on:
  push:
    branches: [exp/s-qem-tail-morph-a-20261010]
    paths:
      - .github/workflows/s-qem-tail-morph-a.yml
      - art/s-creature/blender/s_qem_tail_morph_a_trial.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evowild-s-qem-tail-morph-a
  cancel-in-progress: false
jobs:
  actual-qem-tail-morphology:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_tail_morph_a_trial.py
            /art/s-creature/experiments/qem-deformation-gate-20261010/S-QEM-pre-rig-source-review.blend
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-morph-a-v1/
            /.github/workflows/s-qem-tail-morph-a.yml
      - name: Exact SHA of locked S reference and original QEM
        run: |
          echo '93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png' | sha256sum --check -
          echo 'e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f  art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb' | sha256sum --check -
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Real QEM isolated vertex morph trial and 10 genuine five-view renders
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/experiments/qem-deformation-gate-20261010/S-QEM-pre-rig-source-review.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_tail_morph_a_trial.py
      - name: Validate source count and prepare original before-after contact sheet
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image, ImageDraw
          p=Path("art/s-creature/experiments/qem-deformation-gate-20261010/tail-morph-a-v1")
          d=json.loads((p/"TAIL_MORPH_A_GEOMETRY_QA.json").read_text())
          assert d["source_unchanged"]
          assert d["original_mesh_vertex_count"]==d["variant_mesh_vertex_count"]==29948
          assert d["original_triangles"]==d["variant_triangles"]==59932
          assert not d["full_tail_segmented"] and not d["game_production_approved"]
          assert d["reference_shape_gate"]=="NOT_APPROVED_VISUAL_REVIEW_PENDING"
          assert (p/"S-QEM-real-tail-morph-a-v1.blend").stat().st_size>50000
          views=["SIDE","FRONT","FRONT34","REAR34","BACK"]
          W,H=390,335
          sheet=Image.new("RGB",(W*5,H*2),(238,239,242))
          draw=ImageDraw.Draw(sheet)
          for i,v in enumerate(views):
              for j,k in enumerate(("SOURCE","TAIL_TRIAL")):
                  q=p/"review"/f"REAL_QEM_A_{k}_{v}.png"
                  assert q.stat().st_size>10000,q
                  img=Image.open(q).convert("RGB")
                  img.thumbnail((W-12,H-30))
                  sheet.paste(img,(i*W+(W-img.width)//2,j*H+25+(H-25-img.height)//2))
                  draw.text((i*W+8,j*H+5),f"{k} / {v}",(16,18,21))
          sheet.save(p/"review"/"REAL_QEM_TAIL_A_FIVE_VIEW_COMPARE.jpg",quality=92,optimize=True)
          ref=Image.open("art/s-creature/references/00_s_type_modeling_image_v1.png").convert("RGB")
          ref.thumbnail((1400,1000))
          ref.save(p/"review"/"LOCKED_S_AUTHORITY_THUMB.jpg",quality=90)
          print("REAL_QEM_TAIL_A",d["selected"],d["geometry_gate"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-original-QEM-tail-shape-key-review-A
          path: art/s-creature/experiments/qem-deformation-gate-20261010/tail-morph-a-v1/
          if-no-files-found: warn
      - name: Persist real Blender, images, numerical geometry even if morphological gate FAIL
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/tail-morph-a-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'audit: preserve QEM tail shape-key A with true five-view source comparison'
            git pull --rebase origin exp/s-qem-tail-morph-a-20261010
            git push origin HEAD:exp/s-qem-tail-morph-a-20261010
          fi
