name: Sakura NPR review

on:
  push:
    branches:
      - fix/sakura-npr-rigged-head-v2-20260927
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Capture Sakura NPR views
        env:
          SAKURA_NPR_CAPTURE: "1"
        run: npx playwright test tests/sakura-npr.spec.js --project=desktop-chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sakura-npr-review
          path: test-results/visuals/sakura-npr-*.png
          if-no-files-found: warn
