name: Sakura World review

on:
  push:
    branches:
      - feat/sakura-world-lane-20260928
      - test/sakura-world-v31-native-20260929
      - fix/sakura-world-direction-20260928
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Capture Sakura World views
        env:
          SAKURA_WORLD_CAPTURE: "1"
        run: npx playwright test tests/sakura-world.spec.js --project=desktop-chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sakura-world-review
          path: test-results/visuals/sakura-world-*.png
          if-no-files-found: warn
