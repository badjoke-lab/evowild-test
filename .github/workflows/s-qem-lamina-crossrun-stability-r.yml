name: EvoWild S original-QEM sewn lamina reproducibility R
on:
  push:
    branches: [exp/s-qem-lamina-stability-r-20261011]
    paths:
      - .github/workflows/s-qem-lamina-crossrun-stability-r.yml
      - art/s-creature/blender/s_qem_tail_reproducibility_r.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evowild-original-qem-lamina-crossrun-r
  cancel-in-progress: false
jobs:
  actual-original-QEM-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_tail_reproducibility_r.py
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-regularized-m-v1/S-QEM-true-one-piece-tail-core-M-TRIAL.blend
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-panel-isolation-q-proximal_right/REAL_QEM_Q_SINGLE_ARMOR_PANEL_QA.json
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/qem-deformation-gate-20261010/tail-panel-isolation-r-proximal-verified/
            /.github/workflows/s-qem-lamina-crossrun-stability-r.yml
      - name: Verify user S reference & source immutable
        run: |
          echo '93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6  art/s-creature/references/00_s_type_modeling_image_v1.png' | sha256sum --check -
          echo 'e440263d0204fcf33a4cc6fc5c84b5390d766d6ffb570abd4ac614cbc7cdc92f  art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb' | sha256sum --check -
      - name: Install Blender 4.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Rebuild same original QEM root feather from untouched base in another Action
        run: |
          /tmp/blender-4.3.2-linux-x64/blender -b art/s-creature/experiments/qem-deformation-gate-20261010/tail-core-regularized-m-v1/S-QEM-true-one-piece-tail-core-M-TRIAL.blend -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_tail_reproducibility_r.py
      - name: Independently assert reproducible vertex digest and true BVH collision count
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("art/s-creature/experiments/qem-deformation-gate-20261010")
          old=json.loads((p/"tail-panel-isolation-q-proximal_right/REAL_QEM_Q_SINGLE_ARMOR_PANEL_QA.json").read_text())
          new=json.loads((p/"tail-panel-isolation-r-proximal-verified/REAL_QEM_Q_SINGLE_ARMOR_PANEL_QA.json").read_text())
          o=old["actual_geometry_SHA256_rounded_6dp"]
          n=new["actual_geometry_SHA256_rounded_6dp"]
          oc=old["tail_roi_self_intersection"]["nonshared_polygon_intersections"]
          nc=new["tail_roi_self_intersection"]["nonshared_polygon_intersections"]
          valid=(o==n and oc==nc and new["original_QEM_untouched"] and new["original_M_untouched"])
          check={
              "original_SHA256_rounded_6dp":o,"fresh_SHA256_rounded_6dp":n,
              "hash_equal":o==n,
              "original_BVH_intersections":oc,"fresh_BVH_intersections":nc,
              "intersection_count_equal":oc==nc,
              "both_original_sources_unchanged":new["original_QEM_untouched"] and new["original_M_untouched"],
              "reproducible_shape_and_collision":valid,
              "technical_blade_gate":new["geometry_gate"],
              "visual_S_canonical_approved":False,
              "game_ready":False
          }
          output=p/"tail-panel-isolation-r-proximal-verified/CROSS_RUN_REPRODUCIBILITY_GATE.json"
          output.write_text(json.dumps(check,indent=2)+"\n")
          print("ACTUAL_3D_CROSS_RUN_REPRO",check)
          assert valid,("S-tail reproducibility gate FAILED",check)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EvoWild-S-QEM-crossrun-deterministic-proximal-tail-R
          path: art/s-creature/experiments/qem-deformation-gate-20261010/tail-panel-isolation-r-proximal-verified/
          if-no-files-found: warn
      - name: Commit unique R trial and proof without editing original Q evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-gate-20261010/tail-panel-isolation-r-proximal-verified/
          if ! git diff --cached --quiet; then
            git commit -m 'audit: independently reproduce identical actual QEM 3D lamina vertex digest and self-collision count'
            git pull --rebase origin exp/s-qem-lamina-stability-r-20261011
            git push origin HEAD:exp/s-qem-lamina-stability-r-20261011
          fi
