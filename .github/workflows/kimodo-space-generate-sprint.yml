name: Kimodo Official Space Sprint Generation

on:
  workflow_dispatch:
  push:
    branches:
      - exp/kimodo-ardy-motion-feasibility-20261004
    paths:
      - ".github/workflows/kimodo-space-generate-sprint.yml"

permissions:
  contents: write

jobs:
  generate-sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/kimodo-ardy-motion-feasibility-20261004

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser and analysis dependencies
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check numpy

      - name: Generate clean sprint in official NVIDIA Kimodo Space
        shell: bash
        run: |
          set -euo pipefail
          OUT="experiments/kimodo-ardy/space-generated/sprint-v1"
          mkdir -p "$OUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';

          const outDir = 'experiments/kimodo-ardy/space-generated/sprint-v1';
          const prompt = 'A person sprints forward quickly at a steady pace.';
          const debug = {
            space: 'https://nvidia-kimodo.hf.space',
            prompt,
            requested_model: 'Kimodo-SOMA-RP-v1',
            status: 'starting',
            canvas_boxes: []
          };

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'en-US',
            acceptDownloads: true,
            viewport: { width: 1440, height: 1100 }
          });
          const page = await context.newPage();
          const consoleLines = [];
          page.on('console', msg => consoleLines.push({ type: msg.type(), text: msg.text() }));
          page.on('pageerror', err => consoleLines.push({ type: 'pageerror', text: String(err) }));

          try {
            const response = await page.goto(debug.space, { waitUntil: 'domcontentloaded', timeout: 90000 });
            debug.http_status = response?.status() ?? null;
            await page.waitForTimeout(12000);

            const start = page.getByRole('button', { name: 'Start Demo', exact: true });
            if (!(await start.count())) throw new Error('Start Demo button not found');
            await start.click();
            await page.waitForTimeout(10000);

            const gotIt = page.getByRole('button', { name: "Got it (don't remind me again)", exact: true });
            if (await gotIt.count()) {
              await gotIt.click();
              await page.waitForTimeout(1000);
            }

            const canvasLoc = page.locator('canvas');
            const canvasCount = await canvasLoc.count();
            let timelineIndex = -1;
            let timelineBox = null;
            for (let i = 0; i < canvasCount; i++) {
              const box = await canvasLoc.nth(i).boundingBox();
              if (!box) continue;
              debug.canvas_boxes.push({ i, ...box });
              if (box.y > 750 && box.height >= 120 && box.height <= 350) {
                if (!timelineBox || box.y > timelineBox.y) {
                  timelineIndex = i;
                  timelineBox = box;
                }
              }
            }
            if (timelineIndex < 0) throw new Error('Timeline canvas not found');
            const timeline = canvasLoc.nth(timelineIndex);
            debug.timeline_index = timelineIndex;
            debug.timeline_box = timelineBox;

            let editor = null;
            for (const x of [260, 420, 650, 900, 1150]) {
              await timeline.dblclick({ position: { x, y: 55 } });
              await page.waitForTimeout(500);
              const candidate = page.locator('[contenteditable="true"]');
              if (await candidate.count()) {
                editor = candidate.first();
                debug.edit_x = x;
                break;
              }
            }
            if (!editor) throw new Error('Timeline prompt editor did not open');
            debug.original_prompt = await editor.textContent();
            await editor.fill(prompt);
            await editor.press('Enter');
            await page.waitForTimeout(1200);

            await timeline.dblclick({ position: { x: debug.edit_x, y: 55 } });
            await page.waitForTimeout(500);
            const verifyEditor = page.locator('[contenteditable="true"]').first();
            if (!(await verifyEditor.count())) throw new Error('Could not re-open prompt for verification');
            debug.verified_prompt = await verifyEditor.textContent();
            if (debug.verified_prompt !== prompt) {
              throw new Error('Prompt verification mismatch: ' + debug.verified_prompt);
            }
            await verifyEditor.press('Enter');
            await page.waitForTimeout(800);

            const generateButtons = page.getByRole('button', { name: 'Generate', exact: true });
            const generateCount = await generateButtons.count();
            const candidates = [];
            for (let i = 0; i < generateCount; i++) {
              const box = await generateButtons.nth(i).boundingBox();
              const disabled = await generateButtons.nth(i).isDisabled().catch(() => true);
              if (box) candidates.push({ i, box, disabled });
            }
            debug.generate_candidates = candidates;
            const usable = candidates.filter(x => !x.disabled).sort((a,b) => b.box.y - a.box.y);
            if (!usable.length) throw new Error('No enabled Generate button found');
            const generate = generateButtons.nth(usable[0].i);
            await generate.click();
            debug.status = 'generation_requested';

            await page.waitForFunction(() => {
              const text = document.body.innerText;
              return text.includes('Motion generation finished!') || text.includes('Generation failed!');
            }, null, { timeout: 210000 });
            const afterGenerateText = await page.locator('body').innerText();
            debug.after_generate_tail = afterGenerateText.slice(-12000);
            if (afterGenerateText.includes('Generation failed!')) {
              throw new Error('Kimodo reported generation failure');
            }
            debug.status = 'generated';

            const exportsText = page.getByText('Exports', { exact: true });
            if (await exportsText.count()) {
              await exportsText.first().click().catch(() => {});
              await page.waitForTimeout(700);
            }

            const nameInput = page.locator('input[value="output"]');
            if (await nameInput.count()) {
              await nameInput.first().fill('evowild-kimodo-sprint-v1');
            }

            const downloadButton = page.getByRole('button', { name: 'Download', exact: true });
            if (!(await downloadButton.count())) throw new Error('Download button not found');
            const dlPromise = page.waitForEvent('download', { timeout: 60000 });
            await downloadButton.first().click();
            const download = await dlPromise;
            debug.download_filename = download.suggestedFilename();
            await download.saveAs(outDir + '/motion.npz');
            debug.status = 'downloaded';

            await page.screenshot({ path: outDir + '/space-after-generation.png', fullPage: true });
          } catch (e) {
            debug.status = 'error';
            debug.error = String(e);
            debug.body_tail = (await page.locator('body').innerText().catch(() => '')).slice(-20000);
            try { await page.screenshot({ path: outDir + '/space-error.png', fullPage: true }); } catch {}
            throw e;
          } finally {
            debug.console = consoleLines.slice(-300);
            fs.writeFileSync(outDir + '/browser-debug.json', JSON.stringify(debug, null, 2) + '\n');
            await browser.close();
          }
          NODE

      - name: Analyze generated sprint
        shell: bash
        run: |
          set -euo pipefail
          OUT="experiments/kimodo-ardy/space-generated/sprint-v1"
          cat > "$OUT/meta.json" <<'JSON'
          {
            "text": "A person sprints forward quickly at a steady pace.",
            "duration": 6.0,
            "model": "Kimodo-SOMA-RP-v1",
            "source": "NVIDIA official public Kimodo Hugging Face Space",
            "space": "https://nvidia-kimodo.hf.space",
            "model_license": "NVIDIA Open Model License",
            "generation_mode": "text-only",
            "seed": 42
          }
          JSON

          python scripts/kimodo-ardy/extract_motion_signals.py "$OUT/motion.npz" --fps 30 --summary "$OUT/summary.json" --timeseries "$OUT/timeseries.csv"
          python scripts/kimodo-ardy/build_transfer_profile.py --summary "$OUT/summary.json" --meta "$OUT/meta.json" --timeseries "$OUT/timeseries.csv" --output "$OUT/transfer-profile.json"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out = Path("experiments/kimodo-ardy/space-generated/sprint-v1")
          motion = out / "motion.npz"
          payload = {
              "motion_sha256": hashlib.sha256(motion.read_bytes()).hexdigest(),
              "motion_bytes": motion.stat().st_size,
              "generated_via": "https://nvidia-kimodo.hf.space",
              "checkpoint_display": "Kimodo-SOMA-RP-v1",
              "prompt": "A person sprints forward quickly at a steady pace.",
              "note": "Generated in NVIDIA official public Kimodo demo; isolated feasibility artifact, not production EvoWild motion."
          }
          (out / "provenance.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload generated motion artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimodo-official-space-sprint-v1
          path: experiments/kimodo-ardy/space-generated/sprint-v1/
          retention-days: 14

      - name: Commit isolated generated baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/kimodo-ardy/space-generated/sprint-v1
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Record official Kimodo Space sprint baseline"
          git push origin HEAD:exp/kimodo-ardy-motion-feasibility-20261004
