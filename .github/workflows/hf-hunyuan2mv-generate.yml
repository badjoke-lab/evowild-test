name: HF Hunyuan3D 2mv Turbo generation

on:
  push:
    branches:
      - test/hf-sf3d-retry-20260921
    paths:
      - ".github/workflows/hf-hunyuan2mv-generate.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client
        run: pip install --quiet "gradio_client>=1.10,<2" pillow

      - name: Generate EvoWild S with Hunyuan3D 2mv Turbo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import inspect, json, os, shutil
          from pathlib import Path
          from PIL import Image
          from gradio_client import Client, handle_file

          out = Path("hf-poc/output-hunyuan2mv-turbo")
          out.mkdir(parents=True, exist_ok=True)

          runtime = Path("hf-poc/runtime-hunyuan2mv")
          runtime.mkdir(parents=True, exist_ok=True)

          side_source = Path("hf-poc/input/01_SIDE_authority.jpg")
          front_source = Path("hf-poc/input/02_FRONT_width_reference.jpg")
          back_source = Path("hf-poc/input/03_BACK_rear_reference.jpg")
          for path in [side_source, front_source, back_source]:
              if not path.exists():
                  raise FileNotFoundError(path)

          # MV_MODE ignores the generic image input and consumes semantic
          # front/back/left/right views only. Build the missing opposite side
          # strictly as a horizontal mirror of the authority SIDE image.
          side_im = Image.open(side_source).convert("RGB")
          right_source = runtime / "01_SIDE_authority_mirrored_right.jpg"
          side_im.transpose(Image.Transpose.FLIP_LEFT_RIGHT).save(right_source, quality=96)

          images = {
              "front": front_source,
              "back": back_source,
              "left": side_source,
              "right": right_source,
          }

          token = os.environ.get("HF_TOKEN")
          params = inspect.signature(Client).parameters
          auth_kw = {"token": token} if "token" in params else {"hf_token": token}
          print("HF_AUTH:", "token present" if token else "token missing")
          print("GRADIO_AUTH_ARG:", next(iter(auth_kw)))

          client = Client("tencent/Hunyuan3D-2mv", **auth_kw)

          caption = (
              "slim futuristic quadruped racing creature, four clearly separated long legs, "
              "long narrow head, two upright horn-ear structures, backward crest blades, "
              "blade-like fin tail, head-mounted Cue Band device on both sides, "
              "silver white body with cool blue and cyan accents"
          )

          results_meta = []
          for seed in [1234, 2026, 7777]:
              print("SEED:", seed)
              result = client.predict(
                  caption,
                  None,
                  handle_file(str(images["front"])),
                  handle_file(str(images["back"])),
                  handle_file(str(images["left"])),
                  handle_file(str(images["right"])),
                  5,
                  5.0,
                  seed,
                  256,
                  True,
                  8000,
                  False,
                  api_name="/shape_generation",
              )
              print("RESULT:", seed, repr(result))

              items = list(result) if isinstance(result, (tuple, list)) else [result]
              first = items[0]
              if isinstance(first, dict):
                  src = first.get("path") or first.get("value")
              else:
                  src = str(first)
              if not src:
                  raise RuntimeError(f"No model file in result for seed {seed}: {result!r}")

              src_path = Path(src)
              if not src_path.exists():
                  raise RuntimeError(f"Returned model file does not exist locally for seed {seed}: {src}")

              suffix = src_path.suffix.lower() or ".glb"
              target = out / f"evowild_s_hunyuan2mv_turbo_seed{seed}{suffix}"
              shutil.copy2(src_path, target)

              magic = target.read_bytes()[:4]
              stats = items[2] if len(items) > 2 else None
              returned_seed = items[3] if len(items) > 3 else None
              results_meta.append({
                  "seed_requested": seed,
                  "seed_returned": returned_seed,
                  "output_file": target.name,
                  "output_bytes": target.stat().st_size,
                  "magic_hex": magic.hex(),
                  "mesh_stats": stats,
              })
              print("SAVED:", seed, target, target.stat().st_size, "MAGIC:", magic)
              print("MESH_STATS:", seed, stats)

          meta = {
              "space": "tencent/Hunyuan3D-2mv",
              "endpoint": "/shape_generation",
              "caption": caption,
              "inputs": {k: str(v) for k,v in images.items()},
              "right_view": str(images["right"]),
              "variant": "semantic_mv_front_back_left_mirrored_right_multiseed",
              "steps": 5,
              "guidance_scale": 5.0,
              "octree_resolution": 256,
              "remove_background": True,
              "num_chunks": 8000,
              "randomize_seed": False,
              "results": results_meta,
          }
          (out / "metadata.json").write_text(json.dumps(meta, indent=2, default=str), encoding="utf-8")
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-hunyuan2mv-turbo
          path: hf-poc/output-hunyuan2mv-turbo/
          if-no-files-found: error
