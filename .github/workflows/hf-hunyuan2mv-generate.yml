name: HF Hunyuan3D 2mv Turbo generation

on:
  push:
    branches:
      - test/hf-sf3d-retry-20260921
    paths:
      - ".github/workflows/hf-hunyuan2mv-generate.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client
        run: pip install --quiet "gradio_client>=1.10,<2" pillow

      - name: Generate EvoWild S with Hunyuan3D 2mv Turbo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import inspect, json, os, shutil
          from pathlib import Path
          from PIL import Image
          from gradio_client import Client, handle_file

          out = Path("hf-poc/output-hunyuan2mv-turbo")
          out.mkdir(parents=True, exist_ok=True)

          raw_main = Path("hf-poc/input/04_3Q_FRONT_shape_support.jpg")
          if not raw_main.exists():
              raise FileNotFoundError(raw_main)

          runtime = Path("hf-poc/runtime-hunyuan2mv")
          runtime.mkdir(parents=True, exist_ok=True)

          # Remove only the unwanted partial second creature at the far-left edge.
          # Keep the authority subject in its original position/scale.
          im = Image.open(raw_main).convert("RGB")
          w, h = im.size
          erase_x = int(w * 0.30)
          im.paste((255, 255, 255), (0, 0, erase_x, h))
          clean_main = runtime / "04_3Q_FRONT_cleanleft30.jpg"
          im.save(clean_main, quality=96)

          images = {
              "main_3q": clean_main,
              "front": Path("hf-poc/input/02_FRONT_width_reference.jpg"),
              "back": Path("hf-poc/input/03_BACK_rear_reference.jpg"),
              "left": Path("hf-poc/input/01_SIDE_authority.jpg"),
          }
          for name, path in images.items():
              if not path.exists():
                  raise FileNotFoundError(f"{name}: {path}")

          token = os.environ.get("HF_TOKEN")
          params = inspect.signature(Client).parameters
          auth_kw = {"token": token} if "token" in params else {"hf_token": token}
          print("HF_AUTH:", "token present" if token else "token missing")
          print("GRADIO_AUTH_ARG:", next(iter(auth_kw)))

          client = Client("tencent/Hunyuan3D-2mv", **auth_kw)

          caption = (
              "slim futuristic quadruped racing creature, four clearly separated long legs, "
              "long narrow head, two upright horn-ear structures, backward crest blades, "
              "blade-like fin tail, head-mounted Cue Band device on both sides, "
              "silver white body with cool blue and cyan accents"
          )

          result = client.predict(
              caption,
              handle_file(str(images["main_3q"])),
              handle_file(str(images["front"])),
              handle_file(str(images["back"])),
              handle_file(str(images["left"])),
              None,
              5,
              5.0,
              1234,
              256,
              True,
              8000,
              False,
              api_name="/shape_generation",
          )
          print("RESULT:", repr(result))

          items = list(result) if isinstance(result, (tuple, list)) else [result]
          first = items[0]
          if isinstance(first, dict):
              src = first.get("path") or first.get("value")
          else:
              src = str(first)
          if not src:
              raise RuntimeError(f"No model file in result: {result!r}")

          src_path = Path(src)
          if not src_path.exists():
              raise RuntimeError(f"Returned model file does not exist locally: {src}")

          suffix = src_path.suffix.lower() or ".glb"
          target = out / f"evowild_s_hunyuan2mv_turbo{suffix}"
          shutil.copy2(src_path, target)

          magic = target.read_bytes()[:4]
          stats = items[2] if len(items) > 2 else None
          returned_seed = items[3] if len(items) > 3 else None
          meta = {
              "space": "tencent/Hunyuan3D-2mv",
              "endpoint": "/shape_generation",
              "caption": caption,
              "inputs": {k: str(v) for k,v in images.items()},
              "right_view": None,
              "variant": "clean_3q_left30_same_seed",
              "steps": 5,
              "guidance_scale": 5.0,
              "seed_requested": 1234,
              "seed_returned": returned_seed,
              "octree_resolution": 256,
              "remove_background": True,
              "num_chunks": 8000,
              "randomize_seed": False,
              "output_file": target.name,
              "output_bytes": target.stat().st_size,
              "magic_hex": magic.hex(),
              "mesh_stats": stats,
          }
          (out / "metadata.json").write_text(json.dumps(meta, indent=2, default=str), encoding="utf-8")
          print("SAVED:", target, target.stat().st_size, "MAGIC:", magic)
          print("MESH_STATS:", stats)
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: evowild-s-hunyuan2mv-turbo
          path: hf-poc/output-hunyuan2mv-turbo/
          if-no-files-found: error
