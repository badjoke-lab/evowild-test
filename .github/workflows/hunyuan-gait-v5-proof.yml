name: Hunyuan gait v5 proof

on:
  push:
    branches:
      - feat/hunyuan-gait-v5-20260925

permissions:
  contents: write

jobs:
  rig:
    if: contains(github.event.head_commit.message, '[targeted-hunyuan-gait-v5]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build v5 LOD2 and LOD4 rig assets
        run: |
          blender --background --python scripts/rig-hunyuan-blender-v5.py --             public/models/evowild-s-hunyuan2mv-lod2.glb             public/models/evowild-s-hunyuan2mv-rigged-v5.glb             public/models/evowild-s-hunyuan2mv-rigged-v5.json
          blender --background --python scripts/rig-hunyuan-blender-v5.py --             public/models/evowild-s-hunyuan2mv-lod4.glb             public/models/evowild-s-hunyuan2mv-lod4-rigged-v5.glb             public/models/evowild-s-hunyuan2mv-lod4-rigged-v5.json
          ls -lh public/models/*rigged-v5*
          cat public/models/evowild-s-hunyuan2mv-rigged-v5.json
          cat public/models/evowild-s-hunyuan2mv-lod4-rigged-v5.json
      - name: Persist v5 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/*rigged-v5*
          if git diff --cached --quiet; then
            echo "No v5 asset changes"
          else
            git commit -m "test: persist Hunyuan gait v5 proof [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hunyuan-gait-v5-proof
          path: |
            public/models/*rigged-v5.glb
            public/models/*rigged-v5.json
