name: P canonical v4 modeling evidence

on:
  push:
    branches:
      - fix/3d-p-canonical-model-20261011
    paths:
      - scripts/modeling/build-canonical-p-v4.py
      - .github/workflows/p-canonical-v4.yml

permissions:
  contents: write

concurrency:
  group: p-canonical-v4-model-review
  cancel-in-progress: true

jobs:
  model-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node -e "const { chromium }=require('@playwright/test');require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_PATH='+chromium.executablePath()+'\n')"
      - name: Fetch pinned Blender 4.3.2
        run: |
          curl -fL --retry 4 --retry-delay 5 \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender-4.3.2.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender-4.3.2.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENDER_EXECUTABLE=$RUNNER_TEMP/blender-4.3.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Generate a NEW P v4 GLB, keeping v1 unchanged
        run: |
          "$BLENDER_EXECUTABLE" -b -t 4 --python scripts/modeling/build-canonical-p-v4.py -- --no-render \
            > "$RUNNER_TEMP/pv4-blender.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/pv4-blender.log"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/pv4-blender.log"
          node scripts/modeling/finalize-p-v4.mjs
          test -s public/models/evowild-p/p-canonical-v4.glb
          node -e "const a=require('fs').statSync('public/models/evowild-p/p-canonical-v4.glb');if(a.size<250000)process.exit(1);console.log('GLB bytes',a.size)"
      - name: Build and capture real v4 model renders
        run: |
          npm run build
          npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/pv4-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pv4-server.pid"
          curl -f --retry 25 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:4173/evowild-test/p-canonical-review.html > /dev/null
          node scripts/modeling/capture-p-review-v4.mjs
          node scripts/modeling/package-p-evidence-v4.mjs
          test -s docs/evidence/p-canonical-3d-v4-20261011/SIDE.png
          test -s docs/evidence/p-canonical-3d-v4-20261011/FRONT.png
          test -s docs/evidence/p-canonical-3d-v4-20261011/FRONT34.png
          test -s docs/evidence/p-canonical-3d-v4-20261011/REAR34.png
          test -s docs/evidence/p-canonical-3d-v4-20261011/BACK.png
          test -s docs/evidence/p-canonical-3d-v4-20261011/running-review.mp4
      - name: Commit real GLB and reproducible evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/evowild-p/p-canonical-v4.glb \
            public/models/evowild-p/manifest-v4.json \
            docs/evidence/p-canonical-3d-v4-20261011
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "model(p): capture canonical v4 GLB and five-view evidence [review pending]"
            git push origin HEAD:fix/3d-p-canonical-model-20261011
          fi
      - name: Upload v4 evidence even if commit is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p-canonical-v4-model-and-renders
          path: |
            public/models/evowild-p/p-canonical-v4.glb
            public/models/evowild-p/manifest-v4.json
            docs/evidence/p-canonical-3d-v4-20261011/*
          if-no-files-found: warn
