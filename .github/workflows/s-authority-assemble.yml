name: finalize-s-authority-image

on:
  push:
    branches:
      - exp/s-creature-vibe-modeling
    paths:
      - art/s-creature/references/.s-authority-ready

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decode and verify exact approved source bytes
        shell: bash
        run: |
          set -euo pipefail
          PARTS="art/s-creature/references/.s-authority-parts"
          OUT="art/s-creature/references/00_s_type_modeling_image_v1.png"
          cat "$PARTS"/part-*.b64 | base64 --decode > "$OUT"
          EXPECTED="93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6"
          ACTUAL="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "S authority sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit canonical authority image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/s-creature/references/00_s_type_modeling_image_v1.png
          git rm -r art/s-creature/references/.s-authority-parts
          git rm art/s-creature/references/.s-authority-ready
          git commit -m "art: lock exact approved S modeling image v1"
          git push origin HEAD:"${GITHUB_REF_NAME}"
