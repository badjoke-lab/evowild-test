name: EvoWild S V5 Stage2 bounded real mesh + matched 3-view gate
on:
  push:
    branches: [exp/s-hunyuan-shoulder-sculpt-20261013]
    paths:
      - .github/workflows/s-hunyuan-v5-stage2-bounded.yml
      - art/s-creature/blender/s_hunyuan_v5_stage2_bounded_candidates.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evowild-s-hunyuan-v5-stage2-bounded
  cancel-in-progress: false
jobs:
  trial-on-accepted-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/s-hunyuan-v5-stage2-bounded.yml
            /art/s-creature/blender/s_hunyuan_v5_stage2_bounded_candidates.py
            /art/s-creature/blender/s_hunyuan_v5_stage1_render.py
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v3/S_HUNYUAN_SHOULDER_CHEST_SCULPT_V3.blend
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v4/S_HUNYUAN_SHOULDER_CHEST_SCULPT_V4.blend
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v4/V3_BASE_COORDS.npy
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v4/V4_DETAIL_SIDE.png
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v4/V4_DETAIL_FRONT.png
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v4/V4_DETAIL_FRONT34.png
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5/S_HUNYUAN_SHOULDER_CHEST_SCULPT_V5_STAGE1.blend
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5/STAGE2_REJECTED_PROPOSAL.npz
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5/STAGE2_REJECTED_PREFLIGHT.json
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5/V5_STAGE1_DETAIL_SIDE.png
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5/V5_STAGE1_DETAIL_FRONT.png
            /art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5/V5_STAGE1_DETAIL_FRONT34.png
      - name: Install actual Blender 4.3.2 and PIL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 python3-pil
          curl -fL --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/evowild-s-stage2-blender.tar.xz
          tar -xf /tmp/evowild-s-stage2-blender.tar.xz -C /tmp
      - name: Exhaustively validate scaled oblique/pectoral candidates; render only safe
        shell: bash
        run: |
          set -euo pipefail
          /tmp/blender-4.3.2-linux-x64/blender -b --factory-startup --threads 4 --python-exit-code 1 --python art/s-creature/blender/s_hunyuan_v5_stage2_bounded_candidates.py 2>&1 | tee /tmp/evowild-s-stage2-search.log
          grep -q S_V5_STAGE2_BOUNDED_SEARCH_COMPLETE /tmp/evowild-s-stage2-search.log
      - name: Make real-image comparison with SHA-locked canonical crop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json,hashlib
          st=Path('art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012')
          out=st/'review-v5-stage2-candidate'
          state=json.loads((out/'STAGE2_BOUNDED_SEARCH_AND_VERIFICATION.json').read_text())
          if state['outcome']!='REAL_SAVED_UNAPPROVED_VISUAL_CANDIDATE':
              print('NO_SAFE_STAGE2_CANDIDATE_NO_COMPARE_TO_GENERATE');raise SystemExit(0)
          ref=Path('art/s-creature/references/00_s_type_modeling_image_v1.png')
          assert hashlib.sha256(ref.read_bytes()).hexdigest()=='93befcfdbe8863abd3140ec6b92d9f06ca2dcbf70bb551334eb063831b9831f6'
          tags=['SIDE','FRONT','FRONT34']
          boxes={'SIDE':(233,210,424,384),'FRONT':(803,238,916,375),'FRONT34':(1192,225,1313,384)}
          srcs=[]
          with Image.open(ref) as ref_im:
              for tag in tags:
                  srcs.append([('CANONICAL '+tag,ref_im.crop(boxes[tag]).copy()),('V4 '+tag,st/'review-v4'/('V4_DETAIL_'+tag+'.png')),('STAGE1 '+tag,st/'review-v5'/('V5_STAGE1_DETAIL_'+tag+'.png')),('STAGE2 UNAPPROVED '+tag,out/('V5_STAGE2_CANDIDATE_DETAIL_'+tag+'.png'))])
          W,H=530,405
          sheet=Image.new('RGB',(W*3,(H+40)*4+54),(237,240,243))
          dr=ImageDraw.Draw(sheet)
          dr.text((10,10),'Original canonical / V4 / retained Stage1 / Stage2 candidate; art NOT approved',fill=(9,22,38))
          for j,tag in enumerate(tags):
              for i,(label,item) in enumerate(srcs[j]):
                  im=(Image.open(item) if isinstance(item,Path) else item).convert('RGB')
                  im.thumbnail((W-12,H-16))
                  x=j*W+(W-im.width)//2;y=54+i*(H+40)+40+(H-im.height)//2
                  sheet.paste(im,(x,y))
                  dr.text((j*W+12,54+i*(H+40)+7),label,fill=(10,10,10))
          sheet.save(out/'CANONICAL_V4_STAGE1_STAGE2_DETAIL.jpg',quality=89,optimize=True)
          print('REAL_STAGE2_DETAIL_COMPARISON_CREATED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evowild-s-v5-stage2-bounded-real-blender-art-unapproved
          path: |
            art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5-stage2-candidate/
            /tmp/evowild-s-stage2-search.log
          retention-days: 14
          if-no-files-found: warn
      - name: Push only unapproved experiment and comparison evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          p='art/s-creature/experiments/canonical-cleanroom-fullbody-20261011/original-hunyuan-authority-sculpt-station-20261012/review-v5-stage2-candidate'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse "$p"
          if ! git diff --cached --quiet; then
            git commit -m 'sculpt(s): bounded stage2 real Blender candidate and canonical review, unapproved'
            git pull --rebase origin exp/s-hunyuan-shoulder-sculpt-20261013
            git push origin HEAD:exp/s-hunyuan-shoulder-sculpt-20261013
          fi
