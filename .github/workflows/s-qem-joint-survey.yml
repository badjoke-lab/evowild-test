name: EvoWild S QEM genuine mesh joint-region scout
on:
  push:
    branches:
      - exp/s-qem-joint-survey-20261010
    paths:
      - art/s-creature/blender/s_qem_joint_survey.py
      - .github/workflows/s-qem-joint-survey.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evowild-s-qem-joint-survey
  cancel-in-progress: false
jobs:
  scan-real-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /art/s-creature/blender/s_qem_joint_survey.py
            /art/s-creature/references/00_s_type_modeling_image_v1.png
            /art/s-creature/experiments/trellis2-pixal3d/candidates/trellis2-seed0000/t2-qem-repair/S-trellis2-qem-repair-best.glb
            /.github/workflows/s-qem-joint-survey.yml
      - name: Install Blender 4.3.2 CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
          curl -L --fail --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Compute source-locked geometry zones and actual five-view displays
        run: |
          python3 -m py_compile art/s-creature/blender/s_qem_joint_survey.py
          /tmp/blender-4.3.2-linux-x64/blender --background -t 4 --python-exit-code 1 --python art/s-creature/blender/s_qem_joint_survey.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('art/s-creature/experiments/qem-deformation-feasibility-20261010/gate0-landmark-survey')
          info=json.loads((p/'QEM_JOINT_SURVEY.json').read_text())
          assert info['source_mesh_unchanged'] and not info['deformation_proven'] and not info['morphology_approved']
          assert info['vertices']==29948 and info['triangles']==59932
          assert len(info['probe_landmarks'])==4
          for v in ('side','front','front34','rear34','back'):
              f=p/f'S_QEM_joint_zones_{v}.png'
              assert f.stat().st_size>15000,f
          assert (p/'S_QEM_joint_survey_UNRIGGED.blend').stat().st_size>25000
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evowild-qem-actual-joint-region-survey
          path: art/s-creature/experiments/qem-deformation-feasibility-20261010/gate0-landmark-survey/
          if-no-files-found: warn
      - name: Archive actual mesh scout on isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse art/s-creature/experiments/qem-deformation-feasibility-20261010/gate0-landmark-survey/
          git diff --cached --quiet && exit 0
          git commit -m 'review: archive original QEM joint-zone diagnostic and 5-view Blender source'
          git push origin HEAD:exp/s-qem-joint-survey-20261010
