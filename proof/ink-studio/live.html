<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvoWild Run — live splats</title><style>
*{box-sizing:border-box}body{margin:0;background:#142321;color:#e8ebd7;font:14px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}h1{font-size:22px;letter-spacing:3px;margin:0}small{color:#a9bba6}canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;touch-action:none;background:#102127;border:1px solid #3a5650}button{background:#2a4038;color:#f0eed6;border:1px solid #66816b;padding:10px 13px;border-radius:5px;font:inherit;touch-action:manipulation}button.active{background:#637c51}section{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}#hud{display:flex;gap:12px;flex-wrap:wrap;color:#cdd9bf;font-variant-numeric:tabular-nums}#err{white-space:pre-wrap;color:#f1b8a4}#rank{font-weight:bold}p{color:#a6bba8;line-height:1.5}#energy{height:8px;width:100px;accent-color:#95c478}</style>
<main><header><div><h1>EVOWILD RUN</h1><small>INK STUDIO · LIVE 3D SPLATS / S D3-C v3</small></div><span id="status">LOADING</span></header><canvas id="view" width="384" height="216"></canvas><section><button id="start">START / RESET</button><button id="boost">BOOST</button><button id="pause">PAUSE</button><button data-camera="side">SIDE</button><button data-camera="chase">CHASE</button><button data-camera="front">FRONT</button><button data-camera="overhead">HIGH</button><button id="zin">＋</button><button id="zout">－</button></section><div id="hud"><span id="rank">—</span><span>BOOST <progress id="energy" max="1" value="1"></progress></span><span id="perf">—</span></div><p>ドラッグで任意の角度へ。走行中もカメラを変更できます。Ink Studioでベイクした三次元Gaussian splatをWebGL2で毎フレーム投影。四足走行は既存GLBの24姿勢。描画負荷軽減のため低密度ベイクを使用。固定画像・スプライトは使用していません。試作レースであり既存レースとは未統合です。</p><div id="err"></div></main>
<script>
(async()=>{
const data=/*__LIVE__*/null;
const $=id=>document.getElementById(id), canvas=$('view'),gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:false});
if(!gl)throw Error('WebGL2 unavailable');
if(!data)throw Error('Missing baked splat data');
const compressed=Uint8Array.from(atob(data.gzip),c=>c.charCodeAt(0));
const buf=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
if(buf.byteLength!==data.bytes)throw Error('Data length mismatch');
const all=new Float32Array(buf),chunks=[];let off=0;
for(const n of data.counts){chunks.push(all.subarray(off,off+n*11));off+=n*11}
const ground=chunks[0],poses=chunks.slice(1),nFrames=poses.length;
const VS=`#version 300 es
precision highp float;
layout(location=0) in vec2 corner;
layout(location=1) in vec4 p;
layout(location=2) in vec4 ca;
layout(location=3) in vec3 cb;
uniform vec3 rightV,upV,target;
uniform vec2 res;
uniform float pixels;
out vec2 delta;
flat out vec3 invCov;
flat out vec4 ink;
void main(){
 vec3 d=p.xyz-target;
 vec2 center=vec2(dot(d,rightV),dot(d,upV))*pixels;
 mat3 C=mat3(ca.x,ca.y,ca.z,ca.y,cb.x,cb.y,ca.z,cb.y,cb.z);
 float A=dot(rightV,C*rightV)*pixels*pixels+.15;
 float B=dot(rightV,C*upV)*pixels*pixels;
 float D=dot(upV,C*upV)*pixels*pixels+.15;
 float det=max(1e-8,A*D-B*B);
 invCov=vec3(D,-B,A)/det;
 delta=corner*min(vec2(128.),3.*sqrt(max(vec2(.15),vec2(A,D))));
 gl_Position=vec4((center+delta)*2./res,0.,1.);
 float pk=ca.w;
 ink=vec4(mod(pk,256.),mod(floor(pk/256.),256.),floor(pk/65536.),p.w);
 ink.rgb/=255.;
}`;
const FS=`#version 300 es
precision highp float;
in vec2 delta;
flat in vec3 invCov;
flat in vec4 ink;
out vec4 color;
void main(){
 float pw=-.5*(invCov.x*delta.x*delta.x+2.*invCov.y*delta.x*delta.y+invCov.z*delta.y*delta.y);
 if(pw < -4.5) discard;
 float g=ink.a*exp(pw);
 float a=ink.a>=1.? .99*smoothstep(.38,.62,g):min(.99,g);
 if(a<.004)discard;
 color=vec4(ink.rgb,a);
}`;
function shader(type,s){const o=gl.createShader(type);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
const q=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,q);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const instance=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,instance);
for(const [id,n,offset] of [[1,4,0],[2,4,16],[3,3,32]]){gl.enableVertexAttribArray(id);gl.vertexAttribPointer(id,n,gl.FLOAT,false,44,offset);gl.vertexAttribDivisor(id,1)}
const un=Object.fromEntries(['rightV','upV','target','res','pixels'].map(k=>[k,gl.getUniformLocation(program,k)]));
gl.disable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
const max=ground.length/11+4*Math.max(...data.counts.slice(1)),work=new Float32Array(max*11),sorted=new Float32Array(max*11),keys=new Uint8Array(max),hist=new Int32Array(256),cursor=new Int32Array(256);
let yaw=Math.PI/2,pitch=.37,scale=1,follow=true,mode='ready',resumeMode='ready',elapsed=0,last=0,held=false,runners=[],finish=[],cam='side',frameN=0,perfAt=performance.now(),frameTimes=[];
const presets={side:[-1.14,.62,1.22],chase:[Math.PI,.55,1.5],front:[0,.55,1.5],overhead:[-Math.PI/2,1.08,.85]};
function camera(k){cam=k;[yaw,pitch,scale]=presets[k];document.querySelectorAll('[data-camera]').forEach(b=>b.classList.toggle('active',b.dataset.camera===k))}
function setup(){elapsed=0;finish=[];runners=Array.from({length:4},(_,i)=>({i,z:-10,phase:i*.18,energy:1,done:false}));}
setup();camera('side');$('start').onclick=()=>{setup();mode='race'};$('pause').onclick=()=>{if(mode==='paused'){mode=resumeMode;$('pause').textContent='PAUSE'}else if(mode==='race'){resumeMode=mode;mode='paused';$('pause').textContent='RESUME'}};
document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>camera(b.dataset.camera));
$('zin').onclick=()=>scale=Math.min(2.3,scale*1.15);$('zout').onclick=()=>scale=Math.max(.55,scale/1.15);
$('boost').onpointerdown=e=>{held=true;$('boost').setPointerCapture(e.pointerId)};$('boost').onpointerup=$('boost').onpointercancel=()=>held=false;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();held=true}});addEventListener('keyup',e=>{if(e.code==='Space')held=false});addEventListener('blur',()=>held=false);
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pitch=Math.max(.04,Math.min(1.45,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];cam='free';document.querySelectorAll('[data-camera]').forEach(b=>b.classList.remove('active'))};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
function render(){
 const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const right=[cy,0,-sy],up=[-sy*sp,cp,-cy*sp],eye=[sy*cp,sp,cy*cp];
 // head is +Z: the side preset views the course from +X. Invert side yaw for left-to-right travel.
 const target=[0,.75,runners[0].z*.72];
 if(cam==='overhead')target[2]=0;
 const pix=canvas.height/15*scale;
 let n=ground.length/11;work.set(ground);
 for(const r of runners){
   const src=poses[Math.floor(((r.phase%1+1)%1)*nFrames)],s=.46,ss=s*s,x=(r.i-1.5)*1.76;
   for(let i=0;i<src.length;i+=11){const p=n*11;work[p]=src[i]*s+x;work[p+1]=src[i+1]*s+.06;work[p+2]=src[i+2]*s+r.z;work[p+3]=src[i+3];work[p+4]=src[i+4]*ss;work[p+5]=src[i+5]*ss;work[p+6]=src[i+6]*ss;work[p+7]=src[i+7];work[p+8]=src[i+8]*ss;work[p+9]=src[i+9]*ss;work[p+10]=src[i+10]*ss;n++;}
 }
 // Global stable bucket sorting, far to near; approximate order within each bucket.
 hist.fill(0);for(let i=0;i<n;i++){const p=i*11,k=Math.max(0,Math.min(255,Math.floor((work[p]*eye[0]+work[p+1]*eye[1]+work[p+2]*eye[2]+28)*255/56)));keys[i]=k;hist[k]++}
 let sum=0;for(let k=0;k<256;k++){cursor[k]=sum;sum+=hist[k]}
 for(let i=0;i<n;i++){let j=cursor[keys[i]]++*11,p=i*11;for(let k=0;k<11;k++)sorted[j+k]=work[p+k]}
 gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.063,.129,.153,1);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.uniform3fv(un.rightV,right);gl.uniform3fv(un.upV,up);gl.uniform3fv(un.target,target);gl.uniform2f(un.res,canvas.width,canvas.height);gl.uniform1f(un.pixels,pix);
 gl.bindBuffer(gl.ARRAY_BUFFER,instance);gl.bufferData(gl.ARRAY_BUFFER,sorted.subarray(0,n*11),gl.DYNAMIC_DRAW);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,n);
 return n;
}
camera('side');
function tick(now){
 const begin=performance.now(),dt=last?Math.max(0,Math.min(1,(now-last)/1000)):0;last=now;
 if(mode==='race'){
 for(let remaining=dt;remaining>1e-9;){const step=Math.min(remaining,.025);remaining-=step;elapsed+=step;for(const r of runners){if(r.done)continue;const use=r.i===0&&held&&r.energy>.02;r.energy=Math.max(0,Math.min(1,r.energy+(use?-.36:.11)*step));const speed=r.i===0?1.65+(use?1:0):1.65+r.i*.045+Math.sin(elapsed*.8+r.i)*.14;r.z=Math.min(10,r.z+speed*step);r.phase+=step*speed/1.65/data.duration;if(r.z===10){r.done=true;finish.push(r.i+1)}}if(finish.length===4){mode='done';break;}}
 }
 const n=render();frameTimes.push(performance.now()-begin);if(frameTimes.length>120)frameTimes.shift();frameN++;
 const pos=1+runners.slice(1).filter(r=>r.z>runners[0].z).length;$('energy').value=runners[0].energy;$('rank').textContent='PLAYER 1 · '+pos+'/4';$('status').textContent=mode==='done'?'FINISH '+finish.join(' > '):mode.toUpperCase()+' '+elapsed.toFixed(1)+' s';
 if(now-perfAt>500){$('perf').textContent=(frameN*1000/(now-perfAt)).toFixed(0)+' fps · '+n.toLocaleString()+' splats';window.__fps=frameN*1000/(now-perfAt);frameN=0;perfAt=now}
 window.__race={mode,elapsed,finish:finish.slice(),camera:cam,yaw,pitch,playerZ:runners[0].z,energy:runners[0].energy,n,fps:window.__fps??null,averageSubmitMs:frameTimes.reduce((a,b)=>a+b,0)/frameTimes.length,glError:gl.getError()};
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})().catch(e=>{document.getElementById('err').textContent=String(e);document.getElementById('status').textContent='FAILED';console.error(e)});
</script></html>
