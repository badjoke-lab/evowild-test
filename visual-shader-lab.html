<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoWild Run — Visual Shader Lab V3</title>
  </head>
  <body>
    <main id="lab">
      <canvas id="shader-lab-canvas"></canvas>
      <section class="hud">
        <div>
          <strong>Race Visual Shader Lab — V2</strong>
          <span>V0 ground + V1 grass + V2 dust locked / V3 race lighting</span>
        </div>
        <div class="metrics">
          <span id="fps">FPS --</span>
          <span id="mode">SHADER ON</span>
          <span id="grassMode">GRASS ON</span>
          <span id="dustMode">DUST ON</span>
          <span id="lightMode">LIGHTING ON</span>
        </div>
        <div class="controls">
          <button id="toggle" type="button">Toggle shader</button>
          <button id="grassToggle" type="button">Toggle grass</button>
          <button id="dustToggle" type="button">Toggle dust</button>
          <button id="lightToggle" type="button">Toggle lighting</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/visual_shader_lab.js"></script>
  </body>
</html>
