<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoWild S Shape V2 Review</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0f16; color: #eef3fb; }
    header { padding: 20px 24px 10px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0; color: #9eacbf; font-size: 13px; }
    main { padding: 14px 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #121824; border: 1px solid #263044; border-radius: 14px; overflow: hidden; min-height: 410px; position: relative; }
    .label { position: absolute; z-index: 2; left: 14px; top: 12px; background: rgba(8,12,18,.78); border: 1px solid #344158; border-radius: 8px; padding: 7px 10px; font-size: 12px; letter-spacing: .04em; }
    canvas { display: block; width: 100%; height: 100%; min-height: 410px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <h1>S-Type Shape Refinement — Baseline vs V2</h1>
  <p>Same Hunyuan-derived mesh family. Clay material only. Review silhouette/proportions, not texture.</p>
</header>
<main>
  <section class="card"><div class="label">BASELINE · SIDE</div><canvas id="base-side"></canvas></section>
  <section class="card"><div class="label">SHAPE V2 · SIDE</div><canvas id="v2-side"></canvas></section>
  <section class="card"><div class="label">BASELINE · 3/4</div><canvas id="base-34"></canvas></section>
  <section class="card"><div class="label">SHAPE V2 · 3/4</div><canvas id="v2-34"></canvas></section>
</main>
<script type="module" src="/src/shape_v2_review.js"></script>
</body>
</html>
