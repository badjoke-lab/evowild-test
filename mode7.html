<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>EvoWild Run — Pseudo-3D Race Proof</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071118}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef8fa}
    #wrap{position:fixed;inset:0;background:#071118}
    #race{position:absolute;inset:0;width:100%;height:100%;display:block}
    #hud{position:absolute;left:18px;top:16px;display:flex;gap:10px;align-items:center;
      padding:8px 11px;border:1px solid rgba(151,225,232,.25);border-radius:10px;
      background:rgba(5,16,23,.52);backdrop-filter:blur(8px);font-size:12px;letter-spacing:.04em}
    #hud strong{font-size:14px;letter-spacing:.08em}
    #hud i{width:6px;height:6px;border-radius:50%;background:#7ee9ef;box-shadow:0 0 12px #7ee9ef}
    #status{position:absolute;right:18px;top:16px;padding:7px 10px;border-radius:8px;
      background:rgba(5,16,23,.46);font:600 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.08em;color:#b9d7dc}
    #credit{position:absolute;right:12px;bottom:8px;font:500 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
      color:rgba(225,242,244,.38)}
    body.capture #hud,body.capture #status,body.capture #credit{display:none}
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="race"></canvas>
    <div id="hud"><i></i><strong>EvoWild Run</strong><span>S-class race / pseudo-3D renderer proof</span></div>
    <div id="status">BOOT</div>
    <div id="credit">Road projection adapted from Jake Gordon's MIT-licensed javascript-racer.</div>
  </div>
  <script type="module" src="/src/mode7.js"></script>
</body>
</html>
