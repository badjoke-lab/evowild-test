<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#071018" />
  <title>EvoWild Run — Lane 5 — Borrowed Racer Base</title>
  <link rel="stylesheet" href="/src/race_lane5.css" />
</head>
<body>
  <main id="stage" class="stage"
    data-mode="lane5-upstream-side-racer"
    data-s-run-sheet="loading"
    data-race-state="loading"
    data-renderer="fixed-step-side-racer">
    <canvas id="raceCanvas" aria-label="EvoWild Run S-only side-view 2.5D race"></canvas>

    <header class="hud top">
      <div>
        <span class="eyebrow">EVOWILD RUN / 2.5D REBUILD</span>
        <strong>LANE 5 / S-ONLY RACE</strong>
      </div>
      <div class="readout">
        <span id="rank">8 / 8</span>
        <b id="speed">0</b><small>km/h</small>
      </div>
    </header>

    <section class="hud agent">
      <span>RACE AGENT</span>
      <strong id="command">HOLD FORM</strong>
      <small id="reason">Pre-start</small>
    </section>

    <div id="countdown" class="countdown">3</div>

    <section class="hud bottom">
      <div class="meta">
        <span id="distance">0 / 1600 m</span>
        <span id="clock">00:00.00</span>
      </div>
      <div class="progress"><i id="progress"></i></div>
      <div id="ranking" class="ranking"></div>
    </section>

    <div class="controls">
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <div id="assetStatus" class="asset-status">Loading S run cycle…</div>
  </main>

  <script type="module" src="/src/race_lane5.js"></script>
</body>
</html>
