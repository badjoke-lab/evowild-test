<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoWild Run — Modern 2.5D Proof</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07131b; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #stage { position: relative; width: 100vw; height: 100vh; background: #07131b; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute; inset: 0; pointer-events: none; color: #eff8fb;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
    #top {
      position: absolute; top: 18px; left: 22px; right: 22px;
      display: flex; justify-content: space-between; gap: 12px; align-items: start;
    }
    .chip {
      min-width: 148px; padding: 10px 13px; border: 1px solid rgba(230,245,250,.22);
      border-radius: 10px; background: linear-gradient(180deg, rgba(8,24,35,.78), rgba(5,17,26,.58));
      backdrop-filter: blur(8px); box-shadow: 0 10px 28px rgba(0,0,0,.22);
      font-weight: 800; letter-spacing: .04em; font-size: clamp(12px, 1.2vw, 18px);
    }
    .chip strong { font-size: 1.28em; }
    .right { text-align: right; }
    #go {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: clamp(52px, 12vw, 150px); font-style: italic; font-weight: 1000;
      letter-spacing: -.04em; color: #f6fbff; opacity: 0; transform: scale(.8);
      filter: drop-shadow(0 14px 28px rgba(0,0,0,.35));
    }
    #go.play { animation: go .72s cubic-bezier(.2,.8,.2,1); }
    @keyframes go { 0% { opacity: 1; transform: scale(.72); } 45% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }
    #tag {
      position: absolute; left: 22px; bottom: 18px; padding: 7px 10px;
      border-radius: 8px; background: rgba(4,14,21,.42); border: 1px solid rgba(255,255,255,.12);
      color: rgba(238,249,252,.78); font-size: 12px; letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <div id="stage" data-proof="modern-2p5d" data-renderer="clean-room-canvas">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hud">
      <div id="top">
        <div class="chip">RIDGE SPRINT<br><strong id="place">5 / 5</strong></div>
        <div class="chip right"><strong id="speed">000</strong> km/h<br><span id="phase">START</span></div>
      </div>
      <div id="go">GO</div>
      <div id="tag">ZERO-BASE MODERN 2.5D PROOF · S-FIELD</div>
    </div>
  </div>
  <script type="module" src="./src/modern-race.js"></script>
</body>
</html>
