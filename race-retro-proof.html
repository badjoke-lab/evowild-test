<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoWild Run — Retro Race Proof</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07121b; }
    body { display: grid; place-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #wrap { position: relative; width: 100vw; height: 100vh; background: #07121b; overflow: hidden; }
    canvas {
      width: 100%; height: 100%; display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: absolute; inset: 0; pointer-events: none;
      color: #f6fbff; text-shadow: 0 2px 0 #0a1721, 1px 0 0 #0a1721, -1px 0 0 #0a1721;
      font-weight: 800; letter-spacing: .03em;
    }
    .top {
      position: absolute; top: 16px; left: 18px; right: 18px;
      display: flex; justify-content: space-between; align-items: flex-start;
      font-size: clamp(13px, 1.5vw, 22px);
    }
    .badge {
      padding: 7px 10px; border: 2px solid rgba(235,248,255,.85);
      background: rgba(5,18,28,.55); box-shadow: 0 3px 0 rgba(0,0,0,.35);
    }
    #position { color: #ffe37a; }
    #speed { color: #8ff0ff; }
    #flash {
      position:absolute; inset:0; display:grid; place-items:center;
      font-size: clamp(44px, 10vw, 120px); font-style: italic;
      color:#fff6af; opacity:0; transform:scale(.8);
    }
    #flash.go { animation: go .65s ease-out; }
    @keyframes go { 0%{opacity:1;transform:scale(.75)} 35%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.22)} }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="640" height="360"></canvas>
    <div id="hud">
      <div class="top">
        <div class="badge">RIDGE SPRINT <span id="position">P5 / 5</span></div>
        <div class="badge"><span id="speed">000</span> km/h</div>
      </div>
      <div id="flash">GO!</div>
    </div>
  </div>
  <script type="module" src="./src/retro-race.js"></script>
</body>
</html>
